<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keystroke — KLM-GOMS task time evaluator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --scene:
    radial-gradient(60% 40% at 72% 58%, rgba(255,214,140,.85) 0%, rgba(255,190,110,0) 70%),
    radial-gradient(120% 50% at 20% 105%, #6e3f1b 0%, rgba(110,63,27,0) 60%),
    radial-gradient(120% 45% at 90% 110%, #8a5328 0%, rgba(138,83,40,0) 60%),
    linear-gradient(180deg,#56617c 0%,#8f8c94 24%,#c9a27a 46%,#e2ad62 58%,#b9773a 74%,#7b4a24 100%);
  --scene-base:#b9773a;
  --glass:rgba(244,240,234,.74);
  --glass-line:rgba(120,100,80,.16);
  --glass-border:rgba(255,255,255,.65);
  --panel:#f6f5f2;
  --card:#ffffff;
  --chip:#f1f0ed;
  --line:#e9e7e3;
  --line-soft:#f0eeea;
  --ink:#1c1b19;
  --ink-2:#3d3a36;
  --muted:#76726c;
  --black:#000000;
  --on-black:#ffffff;
  --accent:#7a2bf0;
  --accent-soft:#f1e8ff;
  --lime:#9cec3e;
  --lime-ink:#244d06;
  --amber-bg:#fff1cc;
  --amber-ink:#7a5200;
  --ice:linear-gradient(170deg,#e4eefc 0%,#eef2fb 55%,#f3f1fb 100%);
  --ice-bubble:rgba(255,255,255,.7);
  --sun:radial-gradient(110% 80% at 88% 8%, #fff8cf 0%, rgba(255,248,207,0) 55%),linear-gradient(140deg,#fdf1d0 0%,#ffe27c 42%,#ffd453 68%,#fff0b6 100%);
  --sun-ink:#24200f;
  --sun-muted:#5d5323;
  --c-visual:#7a2bf0;
  --c-audio:#2f74e0;
  --c-cog:#c08400;
  --c-motor:#e0475f;
  --c-sys:#16927f;
  --c-custom:#7b7b7b;
  --shadow-lift:0 1px 0 rgba(0,0,0,.03),0 10px 24px -14px rgba(40,24,0,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --scene:
      radial-gradient(55% 35% at 70% 60%, rgba(140,70,40,.55) 0%, rgba(140,70,40,0) 70%),
      radial-gradient(120% 50% at 20% 105%, #1d120b 0%, rgba(29,18,11,0) 60%),
      linear-gradient(180deg,#0f1424 0%,#1e2236 30%,#3a2b33 52%,#5a3826 66%,#2a1a10 100%);
    --scene-base:#2a1a10;
    --glass:rgba(24,22,26,.72);
    --glass-line:rgba(255,255,255,.08);
    --glass-border:rgba(255,255,255,.08);
    --panel:#17161a;
    --card:#211f24;
    --chip:#2c2a30;
    --line:#333137;
    --line-soft:#2a282e;
    --ink:#f2efea;
    --ink-2:#d8d4ce;
    --muted:#a29d97;
    --black:#f2efea;
    --on-black:#121114;
    --accent:#b083ff;
    --accent-soft:#2e2443;
    --lime:#8ad83a;
    --lime-ink:#0f2700;
    --amber-bg:#3b2f10;
    --amber-ink:#f3cf6e;
    --ice:linear-gradient(170deg,#1b2433 0%,#1d2230 60%,#211f2d 100%);
    --ice-bubble:rgba(255,255,255,.05);
    --sun:radial-gradient(110% 80% at 88% 8%, rgba(255,220,120,.25) 0%, rgba(255,220,120,0) 55%),linear-gradient(140deg,#3a2f12 0%,#6b5414 48%,#4a3a10 100%);
    --sun-ink:#fff6d6;
    --sun-muted:#e4d39a;
    --c-visual:#b083ff; --c-audio:#6aa4ff; --c-cog:#f0b43c; --c-motor:#ff7287; --c-sys:#3fc7b1; --c-custom:#a8a8a8;
    --shadow-lift:0 1px 0 rgba(255,255,255,.03),0 10px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --scene:
    radial-gradient(55% 35% at 70% 60%, rgba(140,70,40,.55) 0%, rgba(140,70,40,0) 70%),
    radial-gradient(120% 50% at 20% 105%, #1d120b 0%, rgba(29,18,11,0) 60%),
    linear-gradient(180deg,#0f1424 0%,#1e2236 30%,#3a2b33 52%,#5a3826 66%,#2a1a10 100%);
  --scene-base:#2a1a10;
  --glass:rgba(24,22,26,.72); --glass-line:rgba(255,255,255,.08); --glass-border:rgba(255,255,255,.08);
  --panel:#17161a; --card:#211f24; --chip:#2c2a30; --line:#333137; --line-soft:#2a282e;
  --ink:#f2efea; --ink-2:#d8d4ce; --muted:#a29d97; --black:#f2efea; --on-black:#121114;
  --accent:#b083ff; --accent-soft:#2e2443; --lime:#8ad83a; --lime-ink:#0f2700;
  --amber-bg:#3b2f10; --amber-ink:#f3cf6e;
  --ice:linear-gradient(170deg,#1b2433 0%,#1d2230 60%,#211f2d 100%); --ice-bubble:rgba(255,255,255,.05);
  --sun:radial-gradient(110% 80% at 88% 8%, rgba(255,220,120,.25) 0%, rgba(255,220,120,0) 55%),linear-gradient(140deg,#3a2f12 0%,#6b5414 48%,#4a3a10 100%);
  --sun-ink:#fff6d6; --sun-muted:#e4d39a;
  --c-visual:#b083ff; --c-audio:#6aa4ff; --c-cog:#f0b43c; --c-motor:#ff7287; --c-sys:#3fc7b1; --c-custom:#a8a8a8;
  --shadow-lift:0 1px 0 rgba(255,255,255,.03),0 10px 24px -14px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--scene-base)}
body{margin:0;min-height:100vh;font-family:var(--sans);font-size:15px;line-height:1.45;color:var(--ink);background:var(--scene);background-color:var(--scene-base);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
img,svg{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{position:relative;width:calc(100% - 2*clamp(10px,2.4vw,40px));max-width:1500px;margin:clamp(10px,3vw,44px) auto;display:grid;grid-template-columns:252px minmax(0,1fr);gap:6px;padding:10px;border-radius:34px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(26px) saturate(1.15);-webkit-backdrop-filter:blur(26px) saturate(1.15);box-shadow:0 40px 90px -40px rgba(30,15,0,.6)}
.side{padding:18px 10px 12px;display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px;border-bottom:1px solid var(--glass-line);font-weight:600;font-size:22px;letter-spacing:-.025em}
.brand svg{flex:none}
.side h3{font-size:13px;font-weight:500;color:var(--muted);margin:18px 10px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:15px;color:var(--ink);text-decoration:none;font-size:15px}
.nav a:hover{background:color-mix(in srgb,var(--card) 50%,transparent)}
.nav a[aria-current="page"]{background:var(--card);box-shadow:var(--shadow-lift)}
.nav svg{width:19px;height:19px;flex:none}
.alist{display:flex;flex-direction:column;gap:4px}
.aitem{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:15px;background:none;border:0;text-align:left;cursor:pointer;width:100%}
.aitem:hover{background:color-mix(in srgb,var(--card) 50%,transparent)}
.aitem[aria-current="true"] .atile{background:var(--card);box-shadow:var(--shadow-lift)}
.atile{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--card) 55%,transparent);display:grid;place-items:center;flex:none}
.atile svg{width:18px;height:18px}
.aname{font-size:14.5px;line-height:1.25;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.ameta{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.newa{margin:6px 10px 0;border:1px dashed color-mix(in srgb,var(--ink) 25%,transparent);background:none;border-radius:13px;padding:9px 12px;cursor:pointer;font-size:14px;color:var(--ink-2);text-align:left}
.side-foot{margin-top:auto;padding-top:18px}
.ref-card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--card) 50%,transparent)}
.ref-card .atile{background:var(--black);color:var(--on-black)}
.ref-card small{display:block;color:var(--muted);font-size:12.5px}
.ref-card strong{font-weight:500;font-size:14px}

/* main */
.main{overflow-x:clip;background:var(--panel);border-radius:26px;padding:20px clamp(16px,2.2vw,28px) 30px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{flex:1 1 280px;max-width:500px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:7px 0;font-size:15px}
.search input::placeholder{color:var(--muted)}
.kbd{background:var(--chip);border-radius:10px;padding:5px 9px;font-size:13px;white-space:nowrap}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.theme-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:15px;padding:10px 16px;font-weight:500;font-size:14.5px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 25%,transparent)}
.btn.primary{background:var(--black);color:var(--on-black);border-color:transparent;padding:12px 18px;border-radius:17px}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:12px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--c-motor)}
.btn svg{width:17px;height:17px}
.iconbtn{width:30px;height:30px;border-radius:9px;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--chip);color:var(--ink)}
.iconbtn svg{width:15px;height:15px}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:28px 0 18px}
.head-l{min-width:0;flex:1 1 620px}
h1,.h1in{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.3vw,42px);letter-spacing:-.01em;line-height:1.05;margin:0}
.h1in{border:0;background:transparent;outline:none;width:100%;padding:2px 0;border-bottom:1px dashed transparent}
.h1in:hover,.h1in:focus{border-bottom-color:var(--line)}
.sub{font-size:17px;color:var(--ink-2);margin:6px 0 0}
.meta-fields{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mfield{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px;font-size:13.5px;color:var(--muted)}
.mfield input{border:0;background:transparent;outline:none;color:var(--ink);font-size:14px;padding:4px 2px;width:clamp(100px,10vw,150px)}
.head-r{display:flex;gap:10px;flex-wrap:wrap}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tab{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14.5px}
.tab b{font-weight:500}
.tab span{font-variant-numeric:tabular-nums;background:var(--chip);border-radius:9px;padding:3px 8px;font-size:13px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--card);border-color:transparent;box-shadow:var(--shadow-lift)}
.tab.add{padding:8px 14px;border-style:dashed;color:var(--ink-2)}

.grid1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border-radius:24px;padding:20px 22px;border:1px solid var(--line-soft);min-width:0}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.005em;margin:0;flex:1;min-width:0;line-height:1.1}
.tile{width:32px;height:32px;border-radius:10px;background:var(--chip);display:grid;place-items:center;flex:none}
.tile svg{width:16px;height:16px}
.h2in{font-family:var(--serif);font-size:26px;border:0;background:transparent;outline:none;flex:1;min-width:120px;padding:0;border-bottom:1px dashed transparent}
.h2in:hover,.h2in:focus{border-bottom-color:var(--line)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 24px 22px;min-height:340px;display:flex;flex-direction:column;background:var(--sun);color:var(--sun-ink);border:1px solid color-mix(in srgb,var(--sun-ink) 10%,transparent)}
.hero .swoosh{position:absolute;inset:0;pointer-events:none;opacity:.7}
.hero-top{display:flex;align-items:center;gap:8px;position:relative;font-size:15px}
.dot-ico{width:32px;height:32px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center}
.dot-ico svg{width:15px;height:15px}
.dot-ico + .dot-ico{margin-left:-12px;box-shadow:0 0 0 2px color-mix(in srgb,#ffe27c 70%,transparent)}
.hero-num{margin-top:auto;position:relative;font-family:var(--serif);font-size:clamp(58px,6.4vw,92px);line-height:.92;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.hero-num em{display:block;font-size:.6em;margin-top:4px}
.hero-foot{position:relative;margin-top:16px;color:var(--sun-muted);font-size:15px;max-width:42ch}
.hero-foot strong{color:var(--sun-ink);font-weight:500}

/* timeline */
.tl-num{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-2px 0 12px}
.tl-num .n{font-family:var(--serif);font-size:32px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap}
.pill.lime{background:var(--lime);color:var(--lime-ink)}
.pill.amber{background:var(--amber-bg);color:var(--amber-ink)}
.pill.soft{background:var(--chip);color:var(--ink-2)}
.tl-note{color:var(--muted);font-size:13.5px}
.chart{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;height:232px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-size:12.5px;color:var(--muted);padding-bottom:22px;font-variant-numeric:tabular-nums}
.plot{position:relative;min-width:0;display:flex;flex-direction:column}
.bars{position:relative;flex:1;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line)}
.bars::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ink) 5%,transparent) 0 1px,transparent 1px 6px);pointer-events:none}
.bar{position:relative;flex:1 1 0;min-width:3px;max-width:44px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--bc) 0%,color-mix(in srgb,var(--bc) 25%,transparent) 100%);border:0;padding:0;cursor:pointer;opacity:.85}
.bar:hover,.bar:focus-visible,.bar.on{opacity:1;box-shadow:0 0 0 2px color-mix(in srgb,var(--bc) 35%,transparent)}
.cum{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.xax{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;box-shadow:var(--shadow-lift);min-width:170px;transform:translate(-50%,-110%);display:none}
.tip b{font-family:var(--serif);font-weight:400;font-size:20px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:1px}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}

/* palette + table */
.palette{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;padding:12px;border-radius:16px;background:var(--chip)}
.prow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prow > span{font-size:12.5px;color:var(--muted);width:118px;flex:none}
.opchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 9px;font-size:13px;cursor:pointer}
.opchip i{width:7px;height:7px;border-radius:50%;background:var(--oc)}
.opchip small{color:var(--muted);font-variant-numeric:tabular-nums}
.opchip:hover{border-color:var(--oc)}
.tblwrap{position:relative;overflow-x:auto;margin:0 -6px;padding:0 6px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
thead th{background:var(--chip);font-weight:500;text-align:left;padding:12px 8px;white-space:nowrap;color:var(--ink-2)}
thead th:first-child{border-radius:14px 0 0 14px;padding-left:14px}
thead th:last-child{border-radius:0 14px 14px 0}
tbody td{padding:5px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr.sel td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.stepno{color:var(--muted);font-variant-numeric:tabular-nums;width:26px}
.chk{width:20px;height:20px;accent-color:var(--lime)}
.opcell{display:flex;align-items:center;gap:9px;min-width:118px}
.optile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--oc) 14%,transparent);color:var(--oc);flex:none}
.optile svg{width:17px;height:17px}
.opsel{border:0;background:transparent;font-weight:500;padding:2px 0;cursor:pointer;outline:none}
.opsel:focus-visible{outline:2px solid var(--accent)}
.catpill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12.5px;background:color-mix(in srgb,var(--oc) 13%,transparent);color:var(--oc);white-space:nowrap}
.cellin{width:100%;min-width:110px;border:1px solid transparent;background:transparent;border-radius:9px;padding:6px 8px;outline:none}
.cellin:hover{border-color:var(--line)}
.cellin:focus{border-color:var(--accent);background:var(--card)}
.cellin.n{min-width:0;width:64px;text-align:right;font-variant-numeric:tabular-nums}
.cellin.c{width:48px}
.rowtot{font-weight:500;white-space:nowrap}
.acts{white-space:nowrap;text-align:right}
.tfoot td{padding:14px 8px 4px;font-weight:500;border:0}
.script{margin-top:14px;padding:14px;border-radius:16px;background:var(--chip);display:none}
.script.open{display:block}
.script textarea{width:100%;min-height:130px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px 12px;font-size:14px;line-height:1.5;resize:vertical}
.script p{margin:0 0 8px;font-size:13.5px;color:var(--ink-2)}
.script .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.script output{font-size:13px;color:var(--muted)}

/* compare card */
.big-pct{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big-pct .n{font-size:46px;font-weight:500;color:var(--accent);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.big-pct .l{font-size:14px;color:var(--ink-2)}
.striped{height:30px;border-radius:6px;margin:12px 0 18px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ink) 12%,transparent) 0 2px,transparent 2px 5px);position:relative;overflow:hidden}
.striped > div{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 5px)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line-soft)}
.mrow .nm{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .v{font-variant-numeric:tabular-nums;font-size:14.5px}
.thin{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.thin > div{height:100%;background:var(--accent);border-radius:4px}
.valid{margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.valid label{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
.valid .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:8px 10px;outline:none;min-width:0}
.inp:focus{border-color:var(--accent)}
.inp.n{width:110px;font-variant-numeric:tabular-nums}
.vres{margin-top:10px;font-size:13.5px;color:var(--ink-2)}

/* checks card */
.ice{background:var(--ice);border-color:transparent}
.bubbles{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;border:1px solid color-mix(in srgb,var(--card) 70%,transparent);background:color-mix(in srgb,var(--card) 25%,transparent)}
.bubble{background:var(--ice-bubble);border-radius:14px;padding:11px 13px;font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.bubble .k{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--muted)}
.bubble.fix .k{background:var(--c-motor)}
.bubble.hint .k{background:var(--c-cog)}
.bubble.ok .k{background:var(--lime)}
.bubble .t{flex:1}
.bubble .btn{margin-top:8px}

/* other views */
.prose{max-width:72ch}
.prose h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:4px 0 10px}
.prose p,.prose li{color:var(--ink-2)}
.steps-ol{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps-ol li{counter-increment:s;display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:16px;background:var(--chip)}
.steps-ol li::before{content:counter(s);width:30px;height:30px;border-radius:10px;background:var(--black);color:var(--on-black);display:grid;place-items:center;font-size:14px;font-weight:500}
.steps-ol b{font-weight:500;color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid label{font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.fout{margin-top:18px;padding:18px;border-radius:18px;background:var(--sun);color:var(--sun-ink)}
.fout .n{font-family:var(--serif);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.formula{font-family:var(--serif);font-size:24px;margin:6px 0 14px}
.cmpsel{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.cmpsel select{min-width:220px}
.stack{display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--chip)}
.stack > div{height:100%}
.cmprow{margin:14px 0 18px}
.cmprow .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.cmprow .top b{font-weight:500}
.diff td,.diff th{text-align:right}
.diff td:first-child,.diff th:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--black);color:var(--on-black);padding:11px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:22px;padding:22px;background:var(--card);color:var(--ink);width:min(640px,92vw);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(20,12,4,.45)}
dialog textarea{width:100%;min-height:240px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:10px;font-size:13px}
.note{font-size:13px;color:var(--muted)}
.hidden{display:none !important}
/* onboarding */
.wiz{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:14px;align-items:stretch}
.wiz-side{min-height:520px}
.wiz-side h2{position:relative;font-family:var(--serif);font-weight:400;font-size:clamp(44px,4.6vw,66px);line-height:.95;letter-spacing:-.02em;margin:auto 0 0}
.wiz-side h2 em{display:block}
.wsteps{position:relative;list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:6px}
.wsteps li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--sun-muted)}
.wsteps li span{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:500;border:1px solid color-mix(in srgb,var(--sun-ink) 25%,transparent)}
.wsteps li[aria-current="step"]{color:var(--sun-ink);font-weight:500}
.wsteps li[aria-current="step"] span{background:#000;color:#fff;border-color:#000}
.wsteps li.done span{background:color-mix(in srgb,var(--sun-ink) 12%,transparent)}
.wiz-main{display:flex;flex-direction:column;padding:26px 28px}
.wiz-main h3{font-family:var(--serif);font-weight:400;font-size:32px;margin:0 0 6px;line-height:1.1}
.wiz-main .lead{color:var(--ink-2);margin:0 0 22px;max-width:56ch}
.wf{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.wf > span{font-size:14px;font-weight:500}
.wf small{color:var(--muted);font-size:13px}
.wf .inp{padding:12px 14px;font-size:15.5px;border-radius:13px}
.wrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.chipb:hover{border-color:var(--accent)}
.devs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dev{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;cursor:pointer}
.dev .tile{width:38px;height:38px;border-radius:12px}
.dev b{display:block;font-weight:500}
.dev small{color:var(--muted);font-size:13px}
.dev[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.dev[aria-pressed="true"] .tile{background:var(--accent-soft);color:var(--accent)}
.need{list-style:none;padding:0;margin:0 0 22px;display:flex;flex-direction:column;gap:10px}
.need li{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--chip)}
.need b{font-weight:500;display:block}
.need small{color:var(--ink-2);font-size:14px}
.toggle{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer;margin:4px 0 16px}
.toggle input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.sumry{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px 14px;padding:16px;border-radius:16px;background:var(--chip);margin:0 0 16px;font-size:14.5px}
.sumry dt{color:var(--muted)}
.sumry dd{margin:0}
.wnav{margin-top:auto;padding-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line-soft)}
.werr{color:var(--c-motor);font-size:13.5px}
.firstrun{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 12px;text-align:center;color:var(--ink-2)}
.firstrun .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media (max-width:1100px){.wiz{grid-template-columns:minmax(0,1fr)}.wiz-side{min-height:0}.wiz-side h2{margin-top:30px}}
@media (max-width:600px){.wrow,.devs{grid-template-columns:minmax(0,1fr)}.sumry{grid-template-columns:minmax(0,1fr)}}


@media (max-width:1180px){.grid1,.grid2,.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);border-radius:26px}
  .side{padding:10px 6px}
  .brand{border:0;padding-bottom:8px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;max-width:100%;min-width:0}
  .side{overflow:hidden}
  .nav a{white-space:nowrap;padding:9px 12px}
  .side h3,.alist,.newa,.side-foot{display:none}
  .prow > span{width:100%}
  .chart{height:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Sidebar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><circle cx="16" cy="7" r="5"/><circle cx="25" cy="16" r="5"/><circle cx="16" cy="25" r="5"/><circle cx="7" cy="16" r="5"/></g><circle cx="16" cy="16" r="3.2" fill="var(--panel)"/></svg>
      Keystroke
    </div>
    <h3>Main</h3>
    <nav class="nav" id="nav"></nav>
    <h3>Analyses</h3>
    <div class="alist" id="alist"></div>
    <button class="newa" data-act="new-analysis">+ New analysis</button>
    <div class="side-foot">
      <div class="ref-card">
        <div class="atile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></div>
        <div><strong>Operator set</strong><small>NN/g table, Cogulator defaults</small></div>
      </div>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <div class="topbar">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr">Find an operator</span>
        <input id="q" type="search" placeholder="Find an operator — press Enter to add it" autocomplete="off">
        <span class="kbd" id="kbdhint">Ctrl + K</span>
      </label>
      <div class="top-right">
        <button class="theme-btn" data-act="theme" aria-label="Switch light or dark theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
        <button class="btn primary" data-act="csv">Copy as CSV
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 15V3m0 0-4 4m4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        </button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="tip" id="tip" role="status"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg">
  <h2 style="font-family:var(--serif);font-weight:400;margin:0 0 6px;font-size:28px">CSV export</h2>
  <p class="note" style="margin:0 0 10px">Your browser blocked clipboard access here. Select all and copy it manually.</p>
  <textarea id="dlgtext" readonly></textarea>
  <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" data-act="close-dlg">Done</button></div>
</dialog>

<script>
(function(){
"use strict";
/* ---------- reference data ---------- */
var CAT = {
  visual:{n:"Visual",c:"var(--c-visual)"},
  audio:{n:"Audition & speech",c:"var(--c-audio)"},
  cognition:{n:"Cognition",c:"var(--c-cog)"},
  motor:{n:"Motor",c:"var(--c-motor)"},
  system:{n:"System",c:"var(--c-sys)"},
  custom:{n:"Custom",c:"var(--c-custom)"}
};
var CAT_ORDER = ["visual","audio","cognition","motor","system","custom"];
var DEF_OPS = [
  {k:"Look",cat:"visual",ms:550,d:"Look at an item at a known position"},
  {k:"Read",cat:"visual",ms:260,d:"Read one word",u:"words"},
  {k:"Proofread",cat:"visual",ms:330,d:"Carefully read one word or a 3–5 character chunk",u:"words"},
  {k:"Search",cat:"visual",ms:1250,d:"Visually search for an item at an unknown position"},
  {k:"Hear",cat:"audio",ms:400,d:"Attend to someone speaking (begin listening)"},
  {k:"Say",cat:"audio",ms:400,d:"Speak (preparing to)"},
  {k:"Attend",cat:"cognition",ms:50,d:"Shift attention to a stimulus"},
  {k:"Initiate",cat:"cognition",ms:50,d:"Initiate a motor process"},

  {k:"Tap",cat:"motor",ms:450,d:"Tap a touchscreen target (finger already near it)"},

  {k:"Type",cat:"motor",ms:200,d:"Type a key on a keyboard (slower on touchscreens)",u:"keys"},
  {k:"Render",cat:"system",ms:300,d:"System renders the UI, including animation"},
  {k:"Load",cat:"system",ms:1000,d:"Load a page: 500–10,000 ms. Users notice delays over 1,000 ms"}
];
var MOTOR = {Click:1,Drag:1,Grasp:1,Hands:1,Keystroke:1,Point:1,Write:1,Swipe:1,Tap:1,Turn:1,Type:1};
var POINTER = {Point:1,Click:1};
var KEYS = {Type:1,Keystroke:1};

var ICONS = {
  visual:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  audio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>',
  cognition:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  motor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5m0-1V4a1.5 1.5 0 0 1 3 0v6m0-3a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L3 13.5a1.6 1.6 0 0 1 2.6-1.8L9 15"/></svg>',
  system:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
  custom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>'
};
var I = {
  model:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>',
  ops:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg>',
  compare:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>',
  fitts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4l6.5 15 2-6.5L19 10.5z"/><circle cx="19" cy="19" r="2"/></svg>',
  guide:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',

  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg>',
  desk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>'
};

/* ---------- state ---------- */
var KEY = "keystroke-klm-poc-v2";
var uid = function(){ return Math.random().toString(36).slice(2,10); };
function S(op,label,count,ms){ return {id:uid(),op:op,label:label||"",count:count||1,ms:(ms==null?null:ms)}; }

function seed(){
  return {ops:DEF_OPS.map(function(o){return Object.assign({},o);}),analyses:[],cur:null,meth:null,theme:null,onboarded:false};
}
var DEVICES = {
  phone:{n:"Touchscreen phone",h:"Taps, swipes and screen renders",ops:["Tap","Swipe","Look","Initiate","Render"]},
  desktop:{n:"Desktop or laptop",h:"Mouse, keyboard and page loads",ops:["Point","Click","Hands","Type","Keystroke","Look","Initiate","Load"]},
  tablet:{n:"Tablet",h:"Touch, drag and on-screen typing",ops:["Tap","Swipe","Drag","Look","Initiate","Render"]},
  other:{n:"Other system",h:"Kiosk, console, voice or a physical device",ops:[]}
};
var wiz=null;
function newWiz(){ return {step: st&&st.onboarded?1:0, name:"", start:"", end:"", persona:"", kind:"", m1:"", two:false, m2:"", attend:true, script:false, err:""}; }
var st;
try{ st = JSON.parse(localStorage.getItem(KEY)); }catch(e){ st=null; }
if(!st || !Array.isArray(st.analyses)){ st = seed(); }
if(!st.analyses.length) wiz=newWiz();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(st)); }catch(e){} }
if(st.theme) document.documentElement.setAttribute("data-theme",st.theme);

function A(){ if(!st.analyses.length) return null; var a=st.analyses.find(function(x){return x.id===st.cur;}); if(!a){a=st.analyses[0];st.cur=a.id;} return a; }
function M(){ var a=A(); if(!a) return null; var m=a.methods.find(function(x){return x.id===st.meth;}); if(!m){m=a.methods[0];st.meth=m.id;} return m; }
function opDef(k){ return st.ops.find(function(o){return o.k===k;}) || {k:k,cat:"custom",ms:0,d:"Unknown operator"}; }
function unitMs(s){ return (s.ms!==null && s.ms!=="" && !isNaN(+s.ms)) ? +s.ms : opDef(s.op).ms; }
function stepMs(s){ return unitMs(s) * Math.max(1, +s.count||1); }
function total(m){ return m.steps.reduce(function(t,s){return t+stepMs(s);},0); }
function byCat(m){ var r={}; m.steps.forEach(function(s){var c=opDef(s.op).cat; r[c]=(r[c]||0)+stepMs(s);}); return r; }

/* ---------- helpers ---------- */
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmt(n){ return Math.round(n).toLocaleString("en-US"); }
function sec(ms,d){ return (ms/1000).toFixed(d==null?2:d); }
function $(id){ return document.getElementById(id); }
var toastT;
function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("on");},2200); }
var isMac = /Mac|iPhone|iPad/.test(navigator.platform||"");
$("kbdhint").textContent = isMac ? "⌘ + K" : "Ctrl + K";

/* ---------- routing ---------- */
var VIEWS = [["model","Task model",I.model],["operators","Operators",I.ops],["compare","Compare methods",I.compare],["fitts","Fitts’ Law",I.fitts],["guide","Method guide",I.guide]];
function view(){ var h=(location.hash||"").replace("#",""); return VIEWS.some(function(v){return v[0]===h;}) ? h : "model"; }
window.addEventListener("hashchange",render);

function renderNav(){
  var v=view();
  $("nav").innerHTML = VIEWS.map(function(x){
    return '<a href="#'+x[0]+'"'+(x[0]===v?' aria-current="page"':'')+'>'+x[2]+'<span>'+x[1]+'</span></a>';
  }).join("");
  $("alist").innerHTML = st.analyses.map(function(a){
    var best = Math.min.apply(null,a.methods.map(total));
    var mobile = /phone|ios|android|touch/i.test(a.device||"");
    return '<button class="aitem" data-act="pick-analysis" data-id="'+a.id+'"'+(a.id===st.cur?' aria-current="true"':'')+'>'+
      '<span class="atile">'+(mobile?I.phone:I.desk)+'</span><span><span class="aname">'+esc(a.name||"Untitled analysis")+'</span>'+
      '<span class="ameta">'+a.methods.length+(a.methods.length===1?' method':' methods')+', best '+sec(best)+' s</span></span></button>';
  }).join("");
}

function render(){
  renderNav();
  var v=view();
  $("q").placeholder = v==="operators" ? "Filter operators" : "Find an operator — press Enter to add it";
  if(v==="model"){ if(wiz || !st.analyses.length){ if(!wiz) wiz=newWiz(); renderWizard(); } else renderModel(); }
  else if(v==="operators") renderOps();
  else if(v==="compare") renderCompare();
  else if(v==="fitts") renderFitts();

}

function renderTimeline(){
  var m=M(), t=total(m), el=$("timeline");
  var head='<div class="card-h"><span class="tile">'+I.chart+'</span><h2>Time by step</h2></div>';
  if(!m.steps.length){ el.innerHTML=head+'<div class="empty">No steps yet. Add an operator from the palette or paste a script.</div>'; return; }
  var max = Math.max.apply(null,m.steps.map(stepMs));
  var ceil = Math.max(500, Math.ceil(max/500)*500);
  var refTxt = "";
  if(m.ref){ var dev=(t-m.ref)/m.ref*100; refTxt='<span class="tl-note">'+fmt(m.ref)+' ms reference ('+esc(m.refSrc||"observed")+'), '+(dev>0?"+":"")+dev.toFixed(1)+'%</span>'; }
  var cum=0, pts=[];
  var bars = m.steps.map(function(s,i){
    var ms=stepMs(s), c=CAT[opDef(s.op).cat]||CAT.custom; cum+=ms;
    pts.push([(i+.5)/m.steps.length*100, 100-cum/t*100]);
    return '<button class="bar" style="height:'+Math.max(2,ms/ceil*100)+'%;--bc:'+c.c+'" data-i="'+i+'" aria-label="Step '+(i+1)+', '+esc(s.op)+', '+fmt(ms)+' ms"></button>';
  }).join("");
  var d = pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2);}).join(" ");
  var cats = byCat(m);
  el.innerHTML = head +
    '<div class="tl-num"><span class="n">'+fmt(t)+' ms</span><span class="pill lime">'+m.steps.length+(m.steps.length===1?' step':' steps')+'</span>'+refTxt+'</div>'+
    '<div class="chart"><div class="yax"><span>'+fmt(ceil)+'</span><span>'+fmt(ceil*.75)+'</span><span>'+fmt(ceil/2)+'</span><span>'+fmt(ceil/4)+'</span><span>0</span></div>'+
    '<div class="plot"><div class="bars" id="bars">'+bars+
    '<svg class="cum" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg></div>'+
    '<div class="xax"><span>Step 1</span><span>Purple line: cumulative time</span><span>Step '+m.steps.length+'</span></div></div></div>'+
    '<div class="legend">'+CAT_ORDER.filter(function(k){return cats[k];}).map(function(k){return '<span><i style="background:'+CAT[k].c+'"></i>'+CAT[k].n+' '+Math.round(cats[k]/t*100)+'%</span>';}).join("")+'</div>';
}

/* ---------- model checks (Cogulator-style tips) ---------- */
function checks(m){
  var out=[], s=m.steps, sawPointer=false, handsSince=true;
  if(!s.length) return out;
  for(var i=0;i<s.length;i++){
    var k=s[i].op, prev=i?s[i-1].op:null;
    if(MOTOR[k] && prev!=="Initiate" && !MOTOR[prev]){
      out.push({lv:"fix",t:"Step "+(i+1)+" ("+k+") starts a motor action with no Initiate before it.",fix:{at:i,op:"Initiate",label:""},btn:"Insert Initiate"});
    }
    if(POINTER[k]){ sawPointer=true; handsSince=false; }
    if(k==="Hands") handsSince=true;
    if(KEYS[k] && sawPointer && !handsSince){
      out.push({lv:"fix",t:"Step "+(i+1)+" types after using the mouse, but hands never move back to the keyboard.",fix:{at:i,op:"Hands",label:"Hands to keyboard"},btn:"Insert Hands"});
      handsSince=true;
    }
    if(k==="Search") out.push({lv:"tip",t:"Step "+(i+1)+" uses Search (1,250 ms), which assumes the user doesn’t know where the item is. For an expert persona, Look (550 ms) is usually the fit."});
    if(k==="Think" && !s[i].label) out.push({lv:"tip",t:"Step "+(i+1)+" uses Think without a label. Write down the decision so reviewers can challenge it."});
    if(k==="Load" && unitMs(s[i])>1000) out.push({lv:"tip",t:"Step "+(i+1)+" waits "+fmt(unitMs(s[i]))+" ms. Users notice delays over 1,000 ms and abandon more past 10,000 ms."});
  }
  if(!s.some(function(x){return opDef(x.op).cat==="system";})) out.push({lv:"tip",t:"No system response in this method. Add Render or Load wherever the screen changes."});
  if(s[0] && opDef(s[0].op).cat!=="cognition" && opDef(s[0].op).cat!=="visual") out.push({lv:"tip",t:"The method starts with an action. Most models begin with Attend or Look."});
  return out;
}
function renderChecks(){
  var m=M(), list=checks(m);
  var bubbles = !m.steps.length ? '<div class="bubble"><span class="k"></span><div class="t">Checks run as you add steps. They flag missing Initiate or Hands operators, unknown-position searches and slow loads.</div></div>' : list.length ? list.map(function(c,i){
    return '<div class="bubble '+(c.lv==="tip"?"hint":c.lv)+'"><span class="k"></span><div class="t">'+esc(c.t)+(c.fix?'<div><button class="btn sm" data-act="fix" data-i="'+i+'">'+esc(c.btn)+'</button></div>':'')+'</div></div>';
  }).join("") : '<div class="bubble ok"><span class="k"></span><div class="t">No structural issues found. Still confirm the path is how your expert users really do it.</div></div>';
  $("checks").innerHTML='<div class="card-h"><span class="tile">'+I.spark+'</span><h2>Model checks</h2><span class="pill soft">'+list.length+(list.length===1?' note':' notes')+'</span></div><div class="bubbles">'+bubbles+'</div>';
  $("checks")._list=list;
}

/* ---------- actions ---------- */
function addStep(op,label,count,ms,at){
  var m=M(); var s=S(op,label,count,ms);
  if(at==null) m.steps.push(s); else m.steps.splice(at,0,s);
  save(); return s;
}
function parseScript(txt){
  var added=0, skipped=[];
  txt.split(/\r?\n/).forEach(function(line){
    var l=line.trim(); if(!l || /^(\*|#|goal:|also:|task:|@)/i.test(l.replace(/^\.+\s*/,""))) return;
    l=l.replace(/^\.+\s*/,"");
    var mm=l.match(/^(\S+)\s*(.*)$/); if(!mm) return;
    var def=st.ops.find(function(o){return o.k.toLowerCase()===mm[1].toLowerCase();});
    if(!def){ skipped.push(mm[1]); return; }
    var rest=mm[2], ms=null, count=1, t;
    if((t=rest.match(/\(\s*([\d.]+)\s*(ms|milliseconds?|s|secs?|seconds?)\s*\)/i))){ ms=+t[1]*(/^m/i.test(t[2])?1:1000); rest=rest.replace(t[0],""); }
    if((t=rest.match(/(?:^|\s)[x×]\s*(\d+)\b/i))){ count=+t[1]; rest=rest.replace(t[0],""); }
    rest=rest.replace(/^(at|to|on)\s+/i,"").replace(/[<>]/g,"").trim();
    addStep(def.k,rest,count,ms); added++;
  });
  return {added:added,skipped:skipped};
}
function csv(){
  var a=A(), q=function(v){v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};

  a.methods.forEach(function(m){ m.steps.forEach(function(s,i){ var o=opDef(s.op); rows.push([a.name,a.persona,a.device,m.name,i+1,s.op,(CAT[o.cat]||CAT.custom).n,s.label,s.count||1,unitMs(s),stepMs(s)]); }); rows.push([a.name,a.persona,a.device,m.name,"","TOTAL","","","","",total(m)]); });
  return rows.map(function(r){return r.map(q).join(",");}).join("\n");
}

      if(st.ops.some(function(x){return x.k.toLowerCase()===kk.toLowerCase();})){ $("nop-out").textContent=kk+" already exists."; break; }
      st.ops.push({k:kk,cat:$("nop-c").value,ms:ms,d:$("nop-d").value||""}); save(); renderOps(); toast(kk+" added to the operator set"); break;
    case "fitts-add": var rr=fittsMs(); addStep("Point","Point (Fitts: D "+fit.D+", W "+fit.W+")",1,Math.round(rr.mt)); toast("Point added to "+M().name); break;
    case "csv": if(!a){ toast("Create an analysis first"); break; } var text=csv();
      var fallback=function(){ $("dlgtext").value=text; $("dlg").showModal(); $("dlgtext").select(); };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){toast("CSV copied for "+a.name);},fallback); } else fallback();
      break;
    case "close-dlg": $("dlg").close(); break;
    case "theme": var dark = st.theme ? st.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; st.theme = dark?"light":"dark"; document.documentElement.setAttribute("data-theme",st.theme); save(); break;
  }
});

document.addEventListener("input",function(e){
  var t=e.target, a=A(), m=M();
  if(t.hasAttribute("data-w")){ var k=t.getAttribute("data-w");
    if(t.type==="checkbox"){ wiz[k]=t.checked; if(k==="two") renderWizard(); }
    else { wiz[k]=t.value; if(wiz.err){ wiz.err=""; var we=$("werr"); if(we) we.textContent=""; } }
    return; }
  if(t.id==="q"){ if(wiz && view()==="model") return; if(view()==="model") renderPalette(); else if(view()==="operators"){ var p=t.selectionStart; renderOps(); } return; }
  if(t.hasAttribute("data-af")){ a[t.getAttribute("data-af")]=t.value; save(); renderNav(); return; }
  if(t.hasAttribute("data-mf")){ var f=t.getAttribute("data-mf"); m[f]= f==="ref" ? (t.value===""?null:+t.value) : t.value; save();
    if(f==="name"){ renderTabs(); renderHero(); renderCmpCard(); renderNav(); }
    else { renderTimeline(); var keep=document.activeElement; var pos=keep&&keep.selectionStart; renderCmpCard(); var again=document.querySelector('[data-mf="'+f+'"]'); if(again){ again.focus(); try{ if(pos!=null) again.setSelectionRange(pos,pos);}catch(_){} } }
    return; }
  if(t.hasAttribute("data-sf")){
    var row=t.closest("tr[data-id]"), s=m.steps.find(function(x){return x.id===row.getAttribute("data-id");});
    var f2=t.getAttribute("data-sf");
    if(f2==="label") s.label=t.value;
    else if(f2==="count") s.count=Math.max(1,parseInt(t.value,10)||1);
    else if(f2==="ms") s.ms = t.value==="" ? null : +t.value;
    else if(f2==="op"){ s.op=t.value; save(); renderTable(); live(); return; }
    save(); $("t-"+s.id).textContent=fmt(stepMs(s)); $("t-total").textContent=fmt(total(m)); live(); return;
  }
  if(t.hasAttribute("data-of")){ var o=opDef(t.closest("tr").getAttribute("data-op")); var f3=t.getAttribute("data-of"); o[f3]= f3==="ms" ? (+t.value||0) : t.value; save(); return; }
  if(t.hasAttribute("data-fit")){ fit[t.getAttribute("data-fit")]=+t.value; var r=fittsMs(), ok=fit.D>0&&fit.W>0&&isFinite(r.mt);
    $("fout").innerHTML= ok?'<div class="n">'+fmt(r.mt)+' ms</div><div>Index of difficulty '+r.id.toFixed(2)+' bits</div>':'<div>Enter a distance and width above zero.</div>';
    var fb=document.querySelector('[data-act="fitts-add"]'); if(fb) fb.disabled=!ok; return; }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.hasAttribute("data-cmp")){ cmpSel[t.getAttribute("data-cmp")]=t.value; renderCompare(); }
  if(t.hasAttribute("data-of")) renderOps();
});

/* search shortcuts */
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && wiz && e.target.matches && e.target.matches('.wiz-main input.inp')){ e.preventDefault(); var nb=document.querySelector('[data-act="w-next"],[data-act="w-create"]'); if(nb) nb.click(); }
});
document.addEventListener("keydown",function(e){
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("q").focus(); $("q").select(); }
});
$("q").addEventListener("keydown",function(e){
  if(e.key==="Enter" && view()==="model" && !wiz){ var first=document.querySelector("#palette .opchip"); if(first){ e.preventDefault(); first.click(); toast(first.getAttribute("data-op")+" added"); } }
  if(e.key==="Escape"){ this.value=""; if(view()==="model") renderPalette(); else if(view()==="operators") renderOps(); }
});

/* chart tooltip */
function showTip(bar){
  var i=+bar.getAttribute("data-i"), s=M().steps[i]; if(!s) return;
  var tip=$("tip"), r=bar.getBoundingClientRect(), cum=0;
  for(var j=0;j<=i;j++) cum+=stepMs(M().steps[j]);
  tip.innerHTML='<b>'+fmt(stepMs(s))+' ms</b>Step '+(i+1)+': '+esc(s.op)+(s.label?' — '+esc(s.label):'')+'<div class="note">Elapsed '+sec(cum)+' s</div>';
  tip.style.display="block";
  tip.style.left=Math.min(window.innerWidth-100,Math.max(100,r.left+r.width/2))+"px";
  tip.style.top=(r.top+window.scrollY-6)+"px";
  tip.style.position="absolute";
}
function hideTip(){ $("tip").style.display="none"; }
document.addEventListener("mouseover",function(e){ var b=e.target.closest(".bar"); if(b) showTip(b); else if(!e.target.closest(".tip")) hideTip(); });
document.addEventListener("focusin",function(e){ var b=e.target.closest&&e.target.closest(".bar"); if(b) showTip(b); else hideTip(); });
document.addEventListener("click",function(e){ var b=e.target.closest(".bar"); if(!b) return; var s=M().steps[+b.getAttribute("data-i")]; var row=s&&document.querySelector('tr[data-id="'+s.id+'"]'); if(row){ row.scrollIntoView({block:"center",behavior:"smooth"}); var inp=row.querySelector('[data-sf="label"]'); if(inp) inp.focus({preventScroll:true}); } });

render();
})();
</script>
</body>
</html>
