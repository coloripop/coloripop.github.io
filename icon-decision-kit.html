<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Icon Decision Kit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECECEF; --frame:#FBFBFC; --surface:#FFFFFF; --surface-2:#F2F2F4;
  --ink:#1C1C1E; --muted:#97979D; --line:#E7E7EA; --fab:#000000; --fab-ink:#FFFFFF;
  --shadow:0 14px 34px rgba(30,30,60,.07), 0 2px 6px rgba(30,30,60,.03);
  --shadow-lg:0 40px 80px rgba(30,30,60,.10);
  --e:#3F7FD6; --e-soft:#CFE0F8; --e-tint:#EEF4FD;
  --c:#6A5AD3; --c-soft:#D8D2F7; --c-tint:#F2F0FD;
  --x:#E3842B; --x-soft:#F8D6AE; --x-tint:#FDF3E8;
  --a:#D9665A; --a-soft:#F6C6C0; --a-tint:#FCEFED;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E11; --frame:#17171B; --surface:#212126; --surface-2:#2A2A30;
    --ink:#F2F2F5; --muted:#8C8C94; --line:#2F2F36; --fab:#F2F2F5; --fab-ink:#000000;
    --shadow:0 14px 34px rgba(0,0,0,.35); --shadow-lg:0 40px 80px rgba(0,0,0,.5);
    --e:#7DAAF0; --e-soft:#2C4466; --e-tint:#1D2736;
    --c:#A497F2; --c-soft:#3D3570; --c-tint:#232036;
    --x:#F2A65E; --x-soft:#5E4122; --x-tint:#2D2318;
    --a:#F08C80; --a-soft:#5C2F2A; --a-tint:#2E1F1D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E11; --frame:#17171B; --surface:#212126; --surface-2:#2A2A30;
  --ink:#F2F2F5; --muted:#8C8C94; --line:#2F2F36; --fab:#F2F2F5; --fab-ink:#000000;
  --shadow:0 14px 34px rgba(0,0,0,.35); --shadow-lg:0 40px 80px rgba(0,0,0,.5);
  --e:#7DAAF0; --e-soft:#2C4466; --e-tint:#1D2736;
  --c:#A497F2; --c-soft:#3D3570; --c-tint:#232036;
  --x:#F2A65E; --x-soft:#5E4122; --x-tint:#2D2318;
  --a:#F08C80; --a-soft:#5C2F2A; --a-tint:#2E1F1D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--frame);color:var(--ink);
  font-family:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--e);outline-offset:3px}
.app{width:100%;margin:0;background:var(--frame);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.screen{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:32px clamp(20px,4vw,48px) 24px}
.hub-grid{margin-top:22px}
.hub-grid>.card{margin-top:0!important}
.hub-grid .map{max-width:min(560px,calc((100vh - 240px) * 360 / 520));min-width:300px}
.hidden{display:none!important}

/* header */
.top{display:flex;align-items:center;gap:14px}
.logo{width:54px;height:54px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.top-text{flex:1;min-width:0}
.top-sub{color:var(--muted);font-size:14px}
.top-title{font-size:26px;font-weight:500;letter-spacing:-.01em;line-height:1.15}
.round{width:50px;height:50px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.round svg{width:22px;height:22px}

.row-head{display:flex;justify-content:space-between;align-items:baseline;margin:30px 2px 14px}
.row-head h2{margin:0;font-size:17px;font-weight:600}
.row-head span{color:var(--muted);font-size:15px}

/* project cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:16px 16px 18px;text-align:left;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;position:relative;min-height:128px;transition:transform .15s ease}
.pcard .ico{margin-bottom:10px}
.pcard .pc-title{font-weight:600;font-size:16px}
.pcard .pc-sub{color:var(--muted);font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pc-num{position:absolute;top:16px;right:18px;font-size:19px;font-weight:500}
.pcard:hover{transform:translateY(-1px)}
@media (max-width:380px){.grid{grid-template-columns:1fr}}

.empty{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:28px 22px;text-align:center}
.empty p{margin:6px 0 18px;color:var(--muted)}

.strip{display:flex;gap:10px;margin-top:14px}
.strip .chip{flex:1;border-radius:20px;padding:12px;background:var(--surface-2);display:flex;align-items:center;gap:8px;font-size:14px}
.strip b{font-weight:600;font-size:18px}

/* bottom bar */
.bottom{position:sticky;bottom:0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:center;
  background:linear-gradient(to top,var(--frame) 70%,transparent)}
.nav{max-width:560px}
@media (min-width:700px){.bottom .btn-ghost+span{flex:0 1 420px!important}}
.nav{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:40px;box-shadow:var(--shadow);padding:8px}
.nav button{height:52px;min-width:52px;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button{flex:1;height:60px;flex-direction:column;gap:3px;border-radius:26px;padding:0 6px}
.nav button .lbl{font-size:12px;line-height:1;white-space:nowrap}
.nav button.on{background:var(--surface-2);color:var(--ink);font-weight:500}
.fab.fab-main{width:auto;min-width:88px;height:76px;border-radius:30px;padding:0 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.fab.fab-main .lot{width:34px!important;height:34px!important}
.fab.fab-main .lot svg{width:34px!important;height:34px!important}
.fab-main .lbl{font-size:12px;font-weight:500;line-height:1;white-space:nowrap}
.fab{width:68px;height:68px;border-radius:50%;background:var(--fab);color:var(--fab-ink);display:grid;place-items:center;flex:none;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.fab svg{width:28px;height:28px}
.fab:disabled{opacity:.25;cursor:not-allowed}
.btn-ghost{height:56px;padding:0 22px;border-radius:30px;background:var(--surface);box-shadow:var(--shadow);font-weight:500}
.btn-ghost:disabled{opacity:.4;cursor:default}
.btn-dark{height:52px;padding:0 24px;border-radius:30px;background:var(--fab);color:var(--fab-ink);font-weight:500}

/* question */
.qhead{display:flex;align-items:center;gap:14px}
.qhead .qmeta{flex:1}
.qmeta .top-sub{font-size:14px}
.bar{height:6px;border-radius:6px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:6px;transition:width .3s ease}
.cat{display:inline-flex;align-items:center;gap:6px;margin-top:30px;padding:6px 12px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;color:var(--muted)}
.qtitle{font-size:25px;font-weight:500;line-height:1.2;letter-spacing:-.01em;margin:16px 0 8px}
.qhelp{color:var(--muted);margin:0 0 22px;max-width:40ch}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;text-align:left;display:flex;gap:14px;align-items:center;border:2px solid transparent}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:var(--ink)}
.opt[aria-checked="true"] .dot{border-color:var(--ink);background:var(--ink)}
.opt[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--surface)}
.opt b{display:block;font-weight:500}
.opt small{display:block;color:var(--muted);font-size:13.5px}
.field{width:100%;height:58px;border-radius:20px;border:2px solid transparent;background:var(--surface);box-shadow:var(--shadow);padding:0 18px;font:inherit;color:var(--ink)}
.field:focus{border-color:var(--ink);outline:none}
.err{color:var(--a);font-size:14px;margin-top:10px;min-height:20px}

/* verdict */
.hero{border-radius:32px;padding:24px;margin-top:22px;position:relative;overflow:hidden}
.hero .rec{font-size:14px;color:var(--muted)}
.hero h1{margin:6px 0 10px;font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-.015em;max-width:11ch}
.hero p{margin:0;max-width:34ch;color:var(--ink);opacity:.8}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ring{flex:none;position:relative;width:96px;height:96px}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .val b{font-size:24px;font-weight:600}
.ring .val small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.clarity{display:inline-block;margin-top:16px;padding:6px 12px;border-radius:20px;background:var(--surface);font-size:13.5px}

.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:20px;margin-top:16px}
.card h3{margin:0 0 14px;font-size:16px;font-weight:600}
.cmp{display:flex;flex-direction:column;gap:14px}
.cmp-row{display:grid;grid-template-columns:28px 1fr 44px;gap:10px;align-items:center;font-size:15px}
.cmp-row .track{height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden;grid-column:2}
.cmp-row .track i{display:block;height:100%;border-radius:10px}
.cmp-row .nm{grid-column:2;grid-row:1;margin-bottom:-6px}
.cmp-row .pct{text-align:right;font-weight:500}
.cmp-item{display:grid;grid-template-columns:28px 1fr 44px;gap:2px 10px;align-items:center}
.cmp-item .ico{grid-row:1 / span 2}
.cmp-item .pct{grid-row:1 / span 2;grid-column:3;text-align:right;font-weight:500}

.alert{display:flex;gap:12px;padding:14px;border-radius:20px;background:var(--a-tint);margin-top:10px;font-size:14.5px}
.alert:first-of-type{margin-top:0}
.alert svg{flex:none;width:22px;height:22px}
.factor{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px}
.factor:first-of-type{border-top:0;padding-top:0}
.factor .q{color:var(--muted);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-content:flex-start;flex:none;max-width:45%}
.pill{padding:3px 9px;border-radius:12px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill.E{background:var(--e-tint);color:var(--e)} .pill.C{background:var(--c-tint);color:var(--c)} .pill.X{background:var(--x-tint);color:var(--x)}
.pill.N{background:var(--surface-2);color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.link-danger{color:var(--a);font-size:14.5px;padding:10px 4px}
.soon{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:14.5px}

.placeholder{text-align:center;padding:60px 20px}
.placeholder .round{margin:0 auto 18px;width:72px;height:72px}
.placeholder h2{margin:0 0 6px;font-weight:600}
.placeholder p{margin:0 auto;color:var(--muted);max-width:30ch}

/* iteraciones 2 y 3 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:18px -2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:40px;padding:0 16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);font-size:14.5px;display:flex;align-items:center;gap:8px}
.chips button[aria-pressed="true"]{background:var(--fab);color:var(--fab-ink)}
.chips .sw{width:10px;height:10px;border-radius:50%}
.seg{display:flex;background:var(--surface-2);border-radius:22px;padding:4px;gap:4px;margin-top:18px}
.seg button{flex:1;height:40px;border-radius:18px;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.page-title{font-size:26px;font-weight:500;letter-spacing:-.01em;line-height:1.15;margin:0}
.lead{color:var(--muted);margin:6px 0 0;max-width:40ch}
.tool{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line)}
.tool:first-of-type{border-top:0;padding-top:0}
.tool .t-ic{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;flex:none}
.tool .t-ic svg{width:22px;height:22px}
.tool b{display:block;font-weight:500}
.tool small{display:block;color:var(--muted);font-size:13.5px}
.tool .chev{margin-left:auto;color:var(--muted);flex:none}
.tool .chev svg{width:18px;height:18px;transform:rotate(180deg)}
.tp{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.tp:first-of-type{border-top:0;padding-top:0}
.tp .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:600;flex:none;margin-top:6px}
.edit{width:100%;border:2px solid transparent;border-radius:14px;background:transparent;font:inherit;color:var(--ink);resize:none;padding:6px 8px;line-height:1.45;overflow:hidden}
.edit:hover{background:var(--surface-2)}
.edit:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.why{margin:0;padding:0;list-style:none}
.why li{padding:8px 0 8px 22px;position:relative;font-size:15px}
.why li::before{content:"";position:absolute;left:4px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--dotc,var(--muted))}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:0 10px 8px 0}
.tbl td{padding:10px 10px 10px 0;border-top:1px solid var(--line);vertical-align:top}
.tbl-wrap{overflow-x:auto}
.small-btn{height:36px;padding:0 14px;border-radius:20px;background:var(--surface-2);font-size:13.5px;font-weight:500}
.row-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.acc{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.acc>button{width:100%;text-align:left;padding:18px 18px;display:flex;gap:12px;align-items:center}
.acc>button .qt{flex:1;font-weight:500}
.acc>button .pm{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;transition:transform .2s ease}
.acc>button .pm svg{width:16px;height:16px}
.acc[data-exp="true"]>button .pm{transform:rotate(45deg)}
.acc .body{padding:0 18px 18px}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:500;margin-bottom:6px}
.note{background:var(--surface-2);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px}
.note b{display:block;font-weight:600;font-size:13px;margin-bottom:2px}
.disc{font-size:13.5px;color:var(--muted);margin-top:14px;max-width:44ch}
.ctrl{margin-top:18px}
.ctrl label{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px}
.ctrl label b{font-weight:600}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.est-row{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;margin-top:14px}
.est-row .ico{grid-row:1 / span 2}
.est-row .nm2{grid-column:2;grid-row:1}
.est-row .track{grid-column:2;grid-row:2}
.est-row .hrs{grid-column:3;grid-row:1 / span 2;text-align:right;font-weight:600;font-size:17px}
.est-row .hrs small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.est-row .track{height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden}
.est-row .track i{display:block;height:100%;border-radius:10px;transition:width .25s ease}
.stage{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.stage:first-of-type{border-top:0}
.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.chk:first-of-type{border-top:0;padding-top:0}
.chk .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
.chk .box svg{width:14px;height:14px;opacity:0}
.chk[aria-checked="true"] .box{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chk[aria-checked="true"] .box svg{opacity:1}
.chk[aria-checked="true"] span:last-child{color:var(--muted);text-decoration:line-through}
.phase{font-size:13px;color:var(--muted);margin:16px 0 6px}
.phase:first-child{margin-top:0}
.adn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adn label{min-width:0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.adn input,.adn select{width:100%;min-width:0;height:46px;border-radius:14px;border:2px solid transparent;background:var(--surface-2);padding:0 12px;font:inherit;color:var(--ink);font-size:15px}
.adn input:focus,.adn select:focus{outline:none;border-color:var(--ink)}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-top:14px}
.prog .bar{flex:1;margin:0}
.step{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:0}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.step b{display:block;font-weight:500;margin-bottom:2px}
.step p{margin:0;color:var(--muted);font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fab);color:var(--fab-ink);padding:10px 18px;border-radius:22px;font-size:14.5px;opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:20}
.toast.show{opacity:1}
/* iteración 4: modo cliente y resumen */
.mode{display:flex;background:var(--surface-2);border-radius:20px;padding:3px;gap:2px;flex:none}
.mode button{height:34px;padding:0 12px;border-radius:17px;font-size:13.5px;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.client .qtitle{font-size:31px;line-height:1.15}
.client .opt{padding:20px 20px}
.client .opt b{font-size:18px}
.cl-hero{text-align:left;padding:30px 4px 10px}
.cl-hero h1{font-size:36px;line-height:1.08;font-weight:600;letter-spacing:-.02em;margin:18px 0 12px}
.cl-hero p{color:var(--muted);font-size:18px;margin:0;max-width:30ch}
.cl-choice{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.cl-choice button{height:62px;border-radius:24px;font-size:17px;font-weight:500}
.ben{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.ben:first-of-type{border-top:0;padding-top:0}
.ben .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none}
.ben b{display:block;font-size:18px;font-weight:600;margin-bottom:2px}
.ben span{color:var(--muted);font-size:16px}
.scard{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:18px;margin-top:12px;border:2px solid transparent}
.scard.rec{border-color:var(--ink)}
.scard-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.scard-head b{font-size:18px;font-weight:600;flex:1}
.lv{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;font-size:15px}
.lv .dots{display:flex;gap:4px}
.lv .dots i{width:22px;height:8px;border-radius:4px;background:var(--surface-2)}
.lv .lvt{color:var(--muted);font-size:13.5px;min-width:44px;text-align:right}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--frame);width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:32px 32px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.doc{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:22px;margin-top:18px;font-size:15px}
.doc h2{margin:0 0 2px;font-size:22px;font-weight:600}
.doc h4{margin:18px 0 6px;font-size:13.5px;color:var(--muted);font-weight:500}
.doc ul,.doc ol{margin:0;padding-left:20px}
.doc li{margin:4px 0}
.opt-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.opt-row:first-of-type{border-top:0;padding-top:0}
.switch{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s ease}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s ease}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.ai-note{width:100%;border-radius:14px;border:2px solid transparent;background:var(--surface-2);font:inherit;font-size:14px;color:var(--ink);padding:10px 12px;resize:none;margin-top:8px}
.ai-note:focus{outline:none;border-color:var(--ink)}

/* mapa mental */
.map{position:relative;width:100%;max-width:520px;margin:8px auto 0;aspect-ratio:360/520}
.map svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--shadow);border-radius:24px;padding:8px 14px 8px 8px;font-weight:600;font-size:15.5px;border:2px solid transparent;transition:transform .15s ease;white-space:nowrap}
.node:hover{transform:translate(-50%,-50%) scale(1.04)}
.node.rec{border-color:var(--ink)}
.node .rtag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--fab);color:var(--fab-ink);font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:10px}
.hubnode{position:absolute;transform:translate(-50%,-50%);width:31%;aspect-ratio:1;border-radius:50%;background:var(--fab);color:var(--fab-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;box-shadow:0 12px 28px rgba(0,0,0,.18);transition:transform .15s ease}
.hubnode:hover{transform:translate(-50%,-50%) scale(1.04)}
.hubnode b{font-size:15px;font-weight:600;line-height:1.15}
.hubnode small{font-size:12px;opacity:.7}
.leaf{position:absolute;transform:translate(-50%,-50%);font-size:12.5px;padding:5px 10px;border-radius:14px;white-space:nowrap;font-weight:500}
.leaf:hover{filter:brightness(.97)}
.map-hint{text-align:center;color:var(--muted);font-size:13.5px;margin:4px 0 0}
.step.hl{background:var(--surface-2);border-radius:16px;padding:12px;margin:0 -12px}
.fab .lot{width:40px;height:40px;display:grid;place-items:center}
.fab .lot svg{width:40px!important;height:40px!important}
.fab .lot path[stroke]{stroke:currentColor}
.logo .lot-logo{width:34px;height:34px;display:grid;place-items:center;color:var(--ink)}
.logo .lot-logo svg{width:100%!important;height:100%!important}
.cl-hero .logo .lot-logo{width:42px;height:42px}
.lot-logo path[stroke]{stroke:currentColor}
.result-pill-row{margin-top:20px}
.result-pill{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 12px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);font-size:15px}
.result-pill b{font-weight:600}
.theme-btn{margin-left:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <main class="screen" id="screen"></main>
  <div class="bottom" id="bottom"></div>
</div>

<script>
/* ---------- iconos duotono ---------- */
const ICON = {
  E: (s=44) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 44 44" aria-hidden="true">
    <rect x="7" y="7" width="13" height="13" rx="4" fill="var(--e-soft)"/><rect x="24" y="7" width="13" height="13" rx="4" fill="var(--e-soft)"/>
    <rect x="7" y="24" width="13" height="13" rx="4" fill="var(--e-soft)"/><rect x="24" y="24" width="13" height="13" rx="4" fill="var(--e)"/>
    <path d="M27.5 30.5l2.3 2.3 4-4.3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  C: (s=44) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 44 44" aria-hidden="true">
    <path d="M10 34l3.2-10.5L28.5 8.2a3.5 3.5 0 015 0l2.3 2.3a3.5 3.5 0 010 5L20.5 30.8z" fill="var(--c-soft)"/>
    <path d="M10 34l3.2-10.5 7.3 7.3z" fill="var(--c)"/><path d="M26 10.7l7.3 7.3" stroke="var(--c)" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  X: (s=44) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 44 44" aria-hidden="true">
    <rect x="6" y="12" width="20" height="20" rx="6" fill="var(--x-soft)"/>
    <rect x="22" y="12" width="16" height="20" rx="6" fill="var(--x)"/>
    <path d="M30 18v8M26 22h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  alert: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--a-soft)"/><path d="M12 7v6" stroke="var(--a)" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1.3" fill="var(--a)"/></svg>`,
  logo: `<svg width="30" height="30" viewBox="0 0 44 44" aria-hidden="true"><circle cx="15" cy="15" r="8" fill="var(--e-soft)"/><rect x="22" y="7" width="15" height="15" rx="4" fill="var(--c-soft)"/><rect x="7" y="22" width="15" height="15" rx="4" fill="var(--x-soft)"/><circle cx="29.5" cy="29.5" r="7.5" fill="var(--ink)"/></svg>`
};
const NAV_ICON = {
  home:`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.5 10.2L12 3.5l8.5 6.7V20a1.5 1.5 0 01-1.5 1.5h-4.2v-6.2h-5.6v6.2H5A1.5 1.5 0 013.5 20z"/></svg>`,
  homeOff:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.2L12 3.5l8.5 6.7V20a1.5 1.5 0 01-1.5 1.5h-4.2v-6.2h-5.6v6.2H5A1.5 1.5 0 013.5 20z"/></svg>`,
  args:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="4"/><path d="M8 21l3-4M8 9h8M8 12.5h5"/></svg>`,
  obj:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>`,
  guide:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>`,
  next:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`,
  close:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`
};

/* ---------- modelo de decisión ---------- */
const STRAT = {
  E:{name:"Elegir", title:"Elegir una familia existente",
     why:"Una librería establecida cubre las necesidades de la interfaz con menor costo, aprendizaje rápido e integración inmediata."},
  C:{name:"Crear", title:"Crear una familia propia",
     why:"El producto necesita una voz visual inconfundible o metáforas que no existen en los paquetes comerciales."},
  X:{name:"Extender", title:"Extender el set existente", titleLib:"Extender una librería existente",
     why:"Conviene partir de una base y completarla con iconos propios que respeten su ADN gráfico."}
};
const QS = [
  {cat:"Producto", q:"¿El producto ya tiene una familia de iconos en uso?",
   help:"Si ya existe un set coherente, extenderlo por ingeniería inversa suele ser más eficiente que reemplazarlo.",
   o:[{l:"Sí, y es consistente",d:"Mismo trazo, radios y remates",p:{X:3}},
      {l:"Sí, pero es inconsistente",d:"Mezcla estilos o fuentes",p:{E:2,C:1}},
      {l:"No, empezamos de cero",p:{E:1,C:1}}]},
  {cat:"Marca", q:"¿Qué tan importante es que el producto se diferencie visualmente?",
   help:"Un set propio aporta una voz visual inconfundible; uno estándar aporta familiaridad.",
   o:[{l:"Poco",d:"La prioridad es la funcionalidad",p:{E:3}},
      {l:"Algo",d:"Queremos coherencia con la marca, sin exclusividad",p:{E:1,X:1}},
      {l:"Mucho",d:"La identidad visual es parte del valor del producto",p:{C:3,X:1}}]},
  {cat:"Producto", q:"¿El dominio tiene conceptos sin metáfora en las librerías comerciales?",
   help:"Software médico, industrial o científico suele necesitar pictogramas que no existen en los paquetes de iconos.",
   o:[{l:"No, son acciones estándar",d:"Buscar, editar, compartir, ajustes",p:{E:2}},
      {l:"Algunos",d:"Menos de 10 conceptos especializados",p:{X:2}},
      {l:"Muchos",d:"El vocabulario del producto es muy específico",p:{C:3}}]},
  {cat:"Marca", q:"¿La tipografía de la interfaz tiene rasgos formales particulares?",
   help:"Si tiene radios de curva o pesos muy marcados, los iconos deberían compartir ese mismo ritmo formal.",
   o:[{l:"No, es neutra",p:{E:1}},
      {l:"Sí, moderados",d:"Algún rasgo distintivo, fácil de acompañar",p:{E:1,X:1}},
      {l:"Sí, muy marcados",d:"Tipografía propia o con mucha personalidad",p:{C:2,X:1}}]},
  {cat:"Producto", q:"¿Qué tipo de interacción propone la interfaz?",
   help:"Las metáforas universales de iOS o Material favorecen el comportamiento predecible y el aprendizaje rápido.",
   o:[{l:"Estándar y predecible",d:"Sigue las guías de la plataforma",p:{E:2}},
      {l:"Mixta",d:"Base estándar con momentos propios",p:{E:1,X:1}},
      {l:"Propia y expresiva",d:"La experiencia es parte de la marca",p:{C:2}}]},
  {cat:"Recursos", q:"¿Cuánto tiempo hay para resolver la iconografía?",
   help:"Crear implica investigación, diseño, pruebas de usabilidad y soporte.",
   o:[{l:"Menos de un mes",p:{E:3,X:1}},
      {l:"Entre uno y tres meses",p:{X:2,E:1}},
      {l:"Más de tres meses",p:{C:2}}]},
  {cat:"Recursos", q:"¿Hay equipo para diseñar, probar y mantener los iconos?",
   help:"Una familia propia necesita a alguien que la mantenga cuando el producto crezca.",
   o:[{l:"No",p:{E:2}},
      {l:"Parcialmente",d:"Tiempo compartido con otras tareas",p:{X:2}},
      {l:"Sí, con dedicación",p:{C:2}}]},
  {cat:"Recursos", q:"¿Cuántos iconos se estima que necesita el producto?",
   help:"El volumen multiplica el costo de crear y mantener un set.",
   o:[{l:"Menos de 30",p:{C:1,E:1}},
      {l:"Entre 30 y 100",p:{E:1,X:1}},
      {l:"Más de 100",p:{E:2}}]},
  {cat:"Técnica", q:"¿Qué formato técnico prefiere el equipo de desarrollo?",
   help:"Las fuentes de iconos alinean con el texto pero dificultan sumar iconos propios; el SVG permite animar y editar trazos y rellenos.",
   o:[{l:"Fuente de iconos",d:"Integración inmediata y escalado simple",p:{E:2}},
      {l:"SVG personalizable",d:"Animaciones y control de trazo",p:{C:1,X:1}},
      {l:"Sin preferencia",p:{}}]}
];

function score(ans){
  const s={E:0,C:0,X:0};
  ans.forEach((a,i)=>{ if(a==null) return; const p=QS[i].o[a].p; for(const k in p) s[k]+=p[k]; });
  const total=s.E+s.C+s.X||1;
  const order=Object.keys(s).sort((a,b)=>s[b]-s[a]);
  const pct={}; for(const k in s) pct[k]=Math.round(s[k]/total*100);
  const gap=(s[order[0]]-s[order[1]])/total*100;
  const clarity = gap>=20?"Recomendación clara":gap>=10?"Recomendación moderada":"Resultado ajustado";
  return {s,pct,top:order[0],second:order[1],gap,clarity};
}
function alerts(ans,r){
  const out=[];
  if(r.gap<10) out.push(`Las dos primeras opciones están casi empatadas. Revisa con el equipo las respuestas que más pesan antes de llevarlo al cliente.`);
  if(ans[1]===2 && ans[5]===0) out.push(`Se pide identidad propia con un plazo menor a un mes. Extender una librería permite diferenciar sin crear todo desde cero.`);
  if(ans[2]===2 && ans[6]===0) out.push(`Hay muchos conceptos especializados pero no hay equipo para mantenerlos. Prioriza una librería base y crea solo los iconos que faltan.`);
  if(ans[0]===0 && r.top==="C") out.push(`El producto ya tiene un set consistente. Crear uno nuevo implica migrar y volver a probar la interfaz completa.`);
  if(ans[7]===2 && r.top==="C") out.push(`Más de 100 iconos propios es un volumen alto. Estima el costo de mantenimiento antes de comprometer el alcance.`);
  if(ans[8]===0 && (r.top==="C"||ans[2]===2)) out.push(`Una fuente de iconos dificulta agregar iconos personalizados sin servicios externos. Valida el formato con desarrollo.`);
  return out;
}

/* ---------- estado ---------- */
const KEY="icon-decision-kit:v1";
let projects=load();
let view={name:"hub"}; // hub | name | q | verdict | tab
let draft=null;

function load(){ try{ localStorage.removeItem(KEY); }catch(e){} return []; }
function save(){}

/* ---------- render ---------- */
const $screen=document.getElementById("screen"), $bottom=document.getElementById("bottom");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function greet(){const h=new Date().getHours();return h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches";}
function ago(t){const m=Math.round((Date.now()-t)/6e4);if(m<1)return"hace un momento";if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<24)return`hace ${h} h`;const d=Math.round(h/24);return d===1?"ayer":`hace ${d} días`;}

function render(){
  document.getElementById("app").classList.toggle("client",view.name==="client"); const sh=document.getElementById("sheet"); if(sh) sh.remove();
  $screen.classList.remove("fade"); void $screen.offsetWidth; $screen.classList.add("fade");
  ({hub:renderHub,name:renderName,q:renderQ,verdict:renderVerdict,tab:renderTab,est:renderEst,plan:renderPlan,client:renderClient,onepager:renderOnepager})[view.name]();
  window.scrollTo({top:0});
}

function navBar(active){
  const items=[["hub","Inicio"],["args","Argumentos"],["obj","Objeciones"]];
  return `<nav class="nav" aria-label="Secciones">${items.map(([k,l])=>{
    const on=k===active; const ic=k==="hub"?(on?NAV_ICON.home:NAV_ICON.homeOff):NAV_ICON[k];
    return `<button class="${on?"on":""}" data-tab="${k}" ${on?'aria-current="page"':""}>${ic}<span class="lbl">${l}</span></button>`;
  }).join("")}</nav>
  <button class="fab fab-main" data-act="new"><span class="lot" data-lot="road" aria-hidden="true">${NAV_ICON.plus}</span><span class="lbl">Diagnóstico</span></button>`;
}

const MAPN={E:{x:88,y:150,leaves:[["Tono visual",52,52],["Formato",128,40],["Auditoría",44,250]]},
  C:{x:272,y:150,leaves:[["Metáforas",236,40],["Retícula",312,64],["En contexto",312,250],["Figma",298,330]]},
  X:{x:180,y:410,leaves:[["ADN gráfico",64,470],["Ajuste",180,502],["Alineación",296,470]]}};
const CX=180, CY=270, px=(x)=>x/360*100+"%", py=(y)=>y/520*100+"%";
function renderHub(){
  const cur=latest(), r=cur?score(cur.ans):null, rk=r?r.top:null;
  const lines=Object.entries(MAPN).map(([k,n])=>{const c=`var(--${k.toLowerCase()})`;
    const mx=(CX+n.x)/2+(k==="X"?0:(k==="E"?-20:20)), my=(CY+n.y)/2+(k==="X"?0:20);
    return `<path d="M${CX} ${CY} Q${mx} ${my} ${n.x} ${n.y}" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".55"/>`+
      n.leaves.map(([,lx,ly])=>`<path d="M${n.x} ${n.y} L${lx} ${ly}" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 4" fill="none" opacity=".5"/>`).join("")}).join("");
  $screen.innerHTML=`
    <header class="top">
      <div class="logo"><span class="lot lot-logo" data-lot="finder" aria-hidden="true">${ICON.logo}</span></div>
      <div class="top-text"><div class="top-sub">Elegir, crear o extender</div><div class="top-title">Icon Decision Kit</div></div>
      ${themeBtn()}
    </header>
    ${cur?`<div class="result-pill-row"><button class="result-pill" data-open="${cur.id}">${ICON[rk](26)}<span>Ver resultado: <b style="color:var(--${rk.toLowerCase()})">${STRAT[rk].name}</b></span></button></div>`:""}
    <div class="hub-grid">
    <div><div class="map" aria-label="Mapa de los tres caminos">
      <svg class="lines" viewBox="0 0 360 520" aria-hidden="true">${lines}</svg>
      ${Object.entries(MAPN).map(([k,n])=>{const kl=k.toLowerCase();return n.leaves.map(([l,lx,ly],i)=>
        `<button class="leaf" style="left:${px(lx)};top:${py(ly)};background:var(--${kl}-tint);color:var(--${kl})" data-gnode="${k}" data-gstep="${i}" aria-label="${STRAT[k].name}: ${l}">${l}</button>`).join("")+
        `<button class="node ${k===rk?"rec":""}" style="left:${px(n.x)};top:${py(n.y)};color:var(--${kl})" data-gnode="${k}" aria-label="Ver el proceso para ${STRAT[k].name.toLowerCase()}">${k===rk?`<span class="rtag">Tu resultado</span>`:""}${ICON[k](34)}${STRAT[k].name}</button>`}).join("")}
      <button class="hubnode" style="left:${px(CX)};top:${py(CY)}" data-act="summary" aria-label="Comparar los tres caminos"><b>Familia<br>de iconos</b><small>Comparar</small></button>
    </div>
    <p class="map-hint">Toca un camino para ver su proceso o el centro para compararlos.</p></div></div>
  `;
  $bottom.innerHTML=navBar("hub");
}
function openSheet(title,inner){
  const old=document.getElementById("sheet"); if(old) old.remove();
  const bg=document.createElement("div"); bg.className="sheet-bg"; bg.id="sheet";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h2 style="margin:0;font-size:20px;font-weight:600">${title}</h2><button class="round" data-act="closeSheet" aria-label="Cerrar" style="width:42px;height:42px">${NAV_ICON.close}</button></div>${inner}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click",e=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector("[data-act=closeSheet]").focus();
  return bg;
}
function guideSheet(k,step){
  const kl=k.toLowerCase();
  const bg=openSheet(GUIDE[k].t,`

function estDefaults(p){ return {n:[20,60,120][p.ans[7]]||40, pct:15, cx:1}; }
function estimate(e){
  const m=[0.75,1,1.4][e.cx], n=e.n, k=Math.max(1,Math.round(n*e.pct/100));
  const E=[["Auditoría y selección de librería",12],["Integración en desarrollo",n*0.15],["Pruebas en contexto",4]];
  const X=[["Descompilar el ADN gráfico",8],["Selección de la base",6],["Metáforas de iconos propios",k*0.5*m],["Diseño de iconos propios",k*2*m],["Pruebas de alineación y contexto",k*0.75*m],["Integración en desarrollo",n*0.15]];
  const C=[["Retícula, formas clave y reglas",16],["Investigación de metáforas",n*0.75*m],["Diseño en compañía",n*2*m],["Pruebas en contexto",n*0.75*m],["Componentes y nomenclatura",n*0.25]];
  const sum=a=>a.reduce((s,x)=>s+x[1],0);
  return {k, E:{st:E,t:sum(E),mt:4}, X:{st:X,t:sum(X),mt:k*0.5}, C:{st:C,t:sum(C),mt:n*0.5}};
}

function isDark(){ const t=document.documentElement.dataset.theme; return t?t==="dark":!!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches); }
function themeBtn(){ const d=isDark(); return `<button class="round theme-btn" data-act="theme" aria-label="${d?"Cambiar a modo claro":"Cambiar a modo oscuro"}">${d?SUN:MOON}</button>`; }
/* ---------- acciones ---------- */
function act(a,el){
  if(a==="new"){ const nums=projects.map(x=>+((x.name.match(/^Diagnóstico (\d+)$/)||[])[1]||0)); draft={id:null,name:"Diagnóstico",ans:Array(QS.length).fill(null)}; view={name:"q",i:0}; }
  else if(a==="home"){ view={name:"hub"}; }
  else if(a==="toQ"){
    if(!draft.name.trim()){ document.getElementById("err").textContent="Escribe un nombre para continuar."; return; }
    view={name:"q",i:0};
  }
  else if(a==="prev"){ if(view.i===0){ view = draft.id?{name:"verdict",id:draft.id}:{name:"hub"}; } else view.i--; }
  else if(a==="next"){
    if(draft.ans[view.i]==null) return;
    if(view.i<QS.length-1) view.i++;
    else{
      if(draft.id){ const p=projects.find(x=>x.id===draft.id); p.ans=draft.ans.slice(); p.t=Date.now(); }
      else{ draft.id="p"+Date.now(); projects=[]; projects.push({id:draft.id,name:draft.name.trim(),ans:draft.ans.slice(),t:Date.now()}); }
      save(); view={name:"verdict",id:draft.id};
    }
  }
  else if(a==="resetArgs"){ const p=projById(view.id); if(p&&p.args){ delete p.args[strat(p)]; save(); } }
  else if(a==="copyArgs"){ const p=projById(view.id); const k=strat(p); return copy(((p.args||{})[k]||TALK[k]).map((t,i)=>`${i+1}. ${t}`).join("\n")); }
  else if(a==="cprev"){ view.step=Math.max(0,view.step-1); }
  else if(a==="cnext"){ const st=CSTEPS[view.step]; const p=projById(view.id); if(typeof st==="number"&&p.ans[st]==null) return; view.step=Math.min(CSTEPS.length-1,view.step+1); }
  else if(a==="theme"){ document.documentElement.dataset.theme = isDark()?"light":"dark"; }
  else if(a==="summary"){ return summarySheet(); }
  else if(a==="objSheet"){ return renderObjSheet(); }
  else if(a==="closeSheet"){ const sh=document.getElementById("sheet"); if(sh) sh.remove(); return; }
  else if(a==="dlOp"){ return downloadOp(projById(view.id)); }
  else if(a==="copyOp"){ return copy(opMarkdown(projById(view.id))); }
  else if(a==="edit"){ const p=projects.find(x=>x.id===view.id); draft={id:p.id,name:p.name,ans:p.ans.slice()}; view={name:"q",i:0}; }
  else if(a==="del"){
    const p=projects.find(x=>x.id===view.id);
    if(confirm(`¿Eliminar este diagnóstico? Esta acción no se puede deshacer.`)){ projects=projects.filter(x=>x.id!==p.id); save(); view={name:"hub"}; }
    else return;
  }
  render();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab],[data-open],[data-pick],[data-sel],[data-acc],[data-copy],[data-back],[data-cx],[data-chk],[data-g],[data-tool],[data-copyk],[data-gnode],[data-mode],[data-cstep],[data-cpick],[data-op]"); if(!t) return;
  if(t.dataset.act) return act(t.dataset.act,t);
  if(t.dataset.gnode){ return guideSheet(t.dataset.gnode, t.dataset.gstep!=null?+t.dataset.gstep:null); }
  if(t.dataset.copyk){ const k=t.dataset.copyk; return copy(TALK[k].map((x,i)=>`${i+1}. ${x}`).join("\n")); }
  if(t.dataset.tab){ const id=view.id; if(t.dataset.gk){ view={name:"tab",tab:"guide",g:t.dataset.gk}; return render(); } view = t.dataset.tab==="hub"?{name:"hub"}:{name:"tab",tab:t.dataset.tab,id}; return render(); }
  if(t.dataset.sel){ view.id=t.dataset.sel; view.open=null; return render(); }
  if(t.dataset.acc){ const y=window.scrollY; view.open = view.open===t.dataset.acc?null:t.dataset.acc; renderObj(); window.scrollTo(0,y); return; }
  if(t.dataset.copy){ return copy(OBJ.find(o=>o.id===t.dataset.copy).a); }
  if(t.dataset.back){ view={name:"verdict",id:t.dataset.back}; return render(); }
  if(t.dataset.tool){ const id=view.id; view = t.dataset.tool==="args"?{name:"tab",tab:"args",id}:{name:t.dataset.tool,id}; return render(); }
  if(t.dataset.cx){ const p=projById(view.id); p.est.cx=+t.dataset.cx; save(); const y=window.scrollY; renderEst(); window.scrollTo(0,y); return; }
  if(t.dataset.chk){ const p=projById(view.id); const d=p.plan[strat(p)]; d[t.dataset.chk]=!d[t.dataset.chk]; save(); const y=window.scrollY; renderPlan(); window.scrollTo(0,y); return; }
  if(t.dataset.g){ view.g=t.dataset.g; return render(); }
  if(t.dataset.mode){ view = t.dataset.mode==="c"?{name:"client",id:t.dataset.pid,step:0}:{name:"verdict",id:t.dataset.pid}; return render(); }
  if(t.dataset.cstep){ view.step=+t.dataset.cstep; return render(); }
  if(t.dataset.cpick!=null){ const p=projById(view.id); p.ans[CSTEPS[view.step]]=+t.dataset.cpick; p.t=Date.now(); save(); const y=window.scrollY; renderClient(); window.scrollTo(0,y); return; }
  if(t.dataset.op){ const p=projById(view.id); p.op[t.dataset.op]=!p.op[t.dataset.op]; save(); const y=window.scrollY; renderOnepager(); window.scrollTo(0,y); return; }
  if(t.dataset.open){ view={name:"verdict",id:t.dataset.open}; return render(); }
  if(t.dataset.pick!=null){ draft.ans[view.i]=+t.dataset.pick; renderQ(); }
});
