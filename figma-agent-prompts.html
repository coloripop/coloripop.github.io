<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompts para el agente de Figma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --page:#ECECEC; --shell:#F7F7F7; --card:#FBFBFB; --inset:#F2F2F2;
  --ink:#000000; --ink-2:#8E8E8E; --ink-3:#B4B4B4; --line:rgba(0,0,0,.06);
  --hi:rgba(255,255,255,.95);
  --shadow-shell:0 40px 80px -30px rgba(0,0,0,.18), 0 2px 0 var(--hi) inset;
  --shadow-card:0 14px 30px -18px rgba(0,0,0,.18), 0 1px 0 var(--hi) inset;
  --fab:#000000; --fab-ink:#FFFFFF;
  --purple:#7461E0; --blue:#4D84E6; --coral:#E8776C; --orange:#EE8634; --teal:#25A68B; --pink:#D2608D;
  --tint:12%;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#121212; --shell:#1B1B1B; --card:#222222; --inset:#191919;
    --ink:#FFFFFF; --ink-2:#9A9A9A; --ink-3:#6A6A6A; --line:rgba(255,255,255,.07);
    --hi:rgba(255,255,255,.05);
    --shadow-shell:0 40px 80px -30px rgba(0,0,0,.7), 0 1px 0 var(--hi) inset;
    --shadow-card:0 14px 30px -18px rgba(0,0,0,.8), 0 1px 0 var(--hi) inset;
    --fab:#FFFFFF; --fab-ink:#000000;
    --purple:#9A8BF0; --blue:#76A3F0; --coral:#F09A91; --orange:#F4A462; --teal:#4CC7AB; --pink:#E688AC;
    --tint:18%;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#121212; --shell:#1B1B1B; --card:#222222; --inset:#191919;
  --ink:#FFFFFF; --ink-2:#9A9A9A; --ink-3:#6A6A6A; --line:rgba(255,255,255,.07);
  --hi:rgba(255,255,255,.05);
  --shadow-shell:0 40px 80px -30px rgba(0,0,0,.7), 0 1px 0 var(--hi) inset;
  --shadow-card:0 14px 30px -18px rgba(0,0,0,.8), 0 1px 0 var(--hi) inset;
  --fab:#FFFFFF; --fab-ink:#000000;
  --purple:#9A8BF0; --blue:#76A3F0; --coral:#F09A91; --orange:#F4A462; --teal:#4CC7AB; --pink:#E688AC;
  --tint:18%;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Outfit",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.wrap{max-width:980px;margin:0 auto;padding:clamp(12px,4vw,48px) clamp(10px,3vw,32px) 24px}
.shell{background:var(--shell);border-radius:clamp(32px,5vw,56px);box-shadow:var(--shadow-shell);padding:clamp(20px,4vw,48px) clamp(16px,4vw,48px) 0;position:relative}

/* header */
.head{display:flex;align-items:center;gap:clamp(14px,2.5vw,26px)}
.avatar{flex:none;width:clamp(56px,8vw,88px);aspect-ratio:1;border-radius:50%;background:var(--inset);display:grid;place-items:center;box-shadow:var(--shadow-card)}
.avatar svg{width:46%;height:46%}
.head-text{flex:1;min-width:0}
.head-sub{margin:0;color:var(--ink-2);font-size:clamp(14px,1.8vw,19px);font-weight:300}
.head-title{margin:4px 0 0;font-size:clamp(24px,3.6vw,36px);font-weight:400;letter-spacing:-.01em;line-height:1.1}
.round{flex:none;width:clamp(52px,7vw,72px);aspect-ratio:1;border-radius:50%;background:var(--card);box-shadow:var(--shadow-card);display:grid;place-items:center;position:relative;transition:transform .15s}
.round:active{transform:scale(.95)}
.round svg{width:40%;height:40%}

.row{display:flex;justify-content:space-between;align-items:baseline;margin:clamp(28px,4vw,44px) 4px 16px}
.row h2{margin:0;font-size:clamp(17px,2vw,20px);font-weight:500}
.row span{color:var(--ink-2);font-size:clamp(15px,1.8vw,19px);font-weight:300}

/* tabs as habit cards */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.6vw,16px)}
@media (max-width:640px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tab{text-align:left;display:flex;align-items:center;gap:clamp(10px,1.6vw,18px);background:var(--card);border-radius:clamp(22px,3vw,30px);box-shadow:var(--shadow-card);padding:clamp(14px,2vw,22px);position:relative;transition:transform .15s, box-shadow .2s;border:1.5px solid transparent;min-height:clamp(84px,11vw,112px)}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) var(--tint),var(--card))}
.ico{flex:none;width:clamp(40px,5vw,56px);aspect-ratio:1;display:grid;place-items:center}
.ico svg{width:100%;height:100%}
.tab-name{display:block;color:var(--c);font-size:clamp(16px,2vw,21px);font-weight:500;line-height:1.15}
.tab-meta{display:block;color:var(--ink-2);font-size:clamp(13px,1.6vw,17px);font-weight:300;margin-top:4px}
.card{position:relative;display:grid;min-width:0}

.card .tab{padding-right:clamp(52px,6vw,64px)}
.card-copy{position:absolute;top:50%;right:clamp(10px,1.4vw,16px);transform:translateY(-50%);width:clamp(36px,4.2vw,42px);aspect-ratio:1;border-radius:50%;background:var(--shell);color:var(--c);box-shadow:var(--shadow-card);display:grid;place-items:center;transition:transform .15s,background .2s,color .2s}
.card-copy:hover{background:var(--c);color:var(--shell)}
.card-copy:active{transform:translateY(-50%) scale(.92)}
.card-copy svg{width:46%;height:46%}
.card .tab{flex-direction:column;align-items:flex-start;justify-content:center;gap:clamp(8px,1.2vw,12px);padding-right:clamp(14px,2vw,22px)}
.card-copy{top:clamp(12px,1.8vw,18px);right:clamp(12px,1.8vw,18px);transform:none}
.card-copy:active{transform:scale(.92)}
.tab-name{hyphens:auto}
.card-copy.copied{background:var(--c);color:var(--shell)}
.p-copy{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--c);color:var(--shell);font-size:15px;font-weight:500;box-shadow:0 10px 20px -12px var(--c);transition:transform .15s}
.p-copy:active{transform:scale(.96)}
.p-copy svg{width:18px;height:18px}
@media (max-width:520px){.p-head{flex-wrap:wrap}.p-copy{margin-left:0;width:100%;justify-content:center}}
.head-actions{display:flex;gap:clamp(8px,1.2vw,14px)}
@media (max-width:520px){.round{width:44px}.head-actions{gap:6px}.avatar{width:48px}}
.lang-btn{font-size:clamp(14px,1.6vw,17px);font-weight:500;letter-spacing:.02em}
.info{display:flex;gap:clamp(12px,1.6vw,16px);align-items:flex-start;margin-top:clamp(18px,3vw,28px);background:color-mix(in srgb,var(--blue) var(--tint),var(--card));border:1px solid color-mix(in srgb,var(--blue) 25%,transparent);border-radius:clamp(20px,2.6vw,26px);padding:clamp(14px,2vw,18px) clamp(16px,2.4vw,22px)}
.info-ico{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:var(--shell);display:grid;place-items:center}
.info-ico svg{width:20px;height:20px}
.info p{margin:0;font-size:clamp(14px,1.6vw,16px);line-height:1.5;font-weight:300;color:var(--ink);max-width:78ch;align-self:center}
.info strong{font-weight:500}

/* panel */
.panel{margin-top:clamp(18px,3vw,28px);background:var(--inset);border-radius:clamp(26px,3.5vw,36px);padding:clamp(20px,3.5vw,40px);box-shadow:inset 0 2px 10px rgba(0,0,0,.04)}
.p-head{display:flex;align-items:center;gap:16px;margin-bottom:clamp(16px,2.5vw,26px)}
.p-head .ico{width:clamp(44px,5vw,60px)}
.p-title{margin:0;color:var(--c);font-size:clamp(22px,3vw,30px);font-weight:500;line-height:1.1}
.p-kicker{margin:6px 0 0;color:var(--ink-2);font-size:clamp(13px,1.5vw,15px);font-weight:300;max-width:62ch}
.body{max-width:72ch;font-size:clamp(15px,1.6vw,16.5px);line-height:1.6;font-weight:300}
.body p{margin:0 0 .55em}
.body strong{font-weight:500}
.body h3{font-size:clamp(14px,1.5vw,15px);font-weight:500;margin:1.6em 0 .5em;color:var(--c)}
.body h3:first-child{margin-top:0}
.step{display:flex;gap:12px;align-items:flex-start;margin:1.5em 0 .6em}
.step b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--shell);display:grid;place-items:center;font-size:14px;font-weight:500;margin-top:-1px}
.step p{margin:0;font-weight:400}
.code{margin:0;background:var(--card);border:1px solid var(--line);border-radius:clamp(18px,2.4vw,24px);padding:clamp(16px,2.6vw,26px);box-shadow:var(--shadow-card);white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:clamp(12.5px,1.4vw,14px);line-height:1.65;color:var(--ink);max-height:70vh;overflow:auto;tab-size:2}
.code::selection,.code *::selection{background:color-mix(in srgb,var(--c) 30%,transparent)}

/* dock */
.dock{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:clamp(10px,2vw,22px);padding:clamp(18px,3vw,30px) 0 clamp(18px,3vw,34px)}
.nav{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--card);border-radius:999px;padding:clamp(6px,1vw,12px);box-shadow:var(--shadow-card),0 20px 40px -24px rgba(0,0,0,.25)}
.nav button{height:clamp(44px,6vw,62px);min-width:clamp(40px,5.5vw,56px);border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 clamp(6px,1vw,12px);color:var(--ink-3);transition:background .2s,color .2s}
.nav button svg{width:clamp(22px,2.8vw,28px);height:clamp(22px,2.8vw,28px);flex:none}
.nav button[aria-current="true"]{background:var(--inset);color:var(--ink);padding:0 clamp(12px,2.2vw,26px)}
.nav .lbl{display:none;font-size:clamp(15px,1.9vw,19px);font-weight:500;white-space:nowrap}
.nav button[aria-current="true"] .lbl{display:inline}
@media (max-width:520px){.nav button[aria-current="true"] .lbl{display:none}.nav button[aria-current="true"]{padding:0 12px}}
.fab{flex:none;width:clamp(60px,9vw,92px);aspect-ratio:1;border-radius:50%;background:var(--fab);color:var(--fab-ink);display:grid;place-items:center;box-shadow:0 18px 30px -14px rgba(0,0,0,.45);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:36%;height:36%}

.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--fab);color:var(--fab-ink);padding:12px 20px;border-radius:999px;font-size:15px;font-weight:400;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <main class="shell">
    <header class="head">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" fill="var(--purple)" opacity=".35"/><path d="M12 6l1.3 3.7L17 11l-3.7 1.3L12 16l-1.3-3.7L7 11l3.7-1.3z" fill="var(--purple)"/></svg>
      </div>
      <div class="head-text">
        <p class="head-sub" id="headSub"></p>
        <h1 class="head-title" id="headTitle"></h1>
      </div>
      <div class="head-actions">
      <button class="round lang-btn" id="langBtn"></button>
      <button class="round" id="themeBtn"></button>
      <button class="round" id="copyAll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      </button>
      </div>
    </header>

    <aside class="info" role="note" id="info">
      <span class="info-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.01" stroke-width="2.6"/></svg></span>
      <p id="infoText"></p>
    </aside>

    <div class="row"><h2 id="tabsLabel"></h2><span id="countLbl"></span></div>
    <div class="tabs" role="tablist" aria-labelledby="tabsLabel" id="tabs"></div>

    <section class="panel" role="tabpanel" id="panel" tabindex="0"></section>

    <div class="dock">
      <nav class="nav" id="nav"></nav>
      <button class="fab" id="fab"></button>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const RAW = ["[PROMPT DE GENERACIÓN DE TOKENS DE COLOR: PRIMITIVAS CROMÁTICAS Y SEMÁNTICAS EN INGLÉS]\nRol: Actúa como un experto en Design Systems especializado en arquitectura de tokens en Figma.\nREGLA DE REUTILIZACIÓN DE COLECCIONES Y MODOS:\nComprobación de Colecciones Existentes: Revisa si ya existen las colecciones llamadas Primitives, Semantic, Tokens o UI Kit Foundations.\nSi la colección YA EXISTE: Agrega o actualiza las variables dentro de la colección existente sin duplicarla ni crear una nueva.\nSi la colección NO EXISTE: Créala desde cero según la estructura indicada.\nESTRUCTURA DE NIVELES Y AGRUPACIÓN RAÍZ (CRUCIAL):\nTodas las variables de color DEBEN estar agrupadas bajo la categoría superior Color.\nIDIOMA Y NOMENCLATURA STRICTA:\nToda la nomenclatura DEBE crearse exclusivamente en INGLÉS. Traduce los conceptos adecuadamente (ej. \"Neutros\" → neutral, \"Exito\" → success, \"Advertencia\" → warning, \"Error\" → error, \"Acento\" → accent, \"Primario\" → primary).\nReglas de Nomenclatura:\nPRIMITIVAS: Nombres PUROS del color cromático en inglés (ej. blue, slate, red, emerald, amber). NO uses roles de interfaz ni el nombre del archivo de Figma.\nSEMÁNTICAS: Nombres con significado o propósito funcional en inglés (ej. primary, neutral, accent, success, warning, error).\nPaso 1: Análisis Dinámico y Mapeo del Canvas Escanea el marco o selección de colores visible. Para cada muestra de color:\nIdentifica el código Hexadecimal.\nIdentifica la etiqueta del rol semántico en el lienzo (ej. \"Primario\", \"Neutros\", \"Exito\", \"Error\") y su escala/número (ej. 50, 200, 400, 600, 800).\nIdentifica o infiere el nombre puro/real del color cromático en inglés basándote en el valor Hexadecimal o matiz visual (ej. \"Primario\" usa tonos azules → blue; \"Exito\" usa verdes → emerald o green; \"Error\" usa rojos → red; \"Advertencia\" usa amarillos/naranjas → amber o yellow).\nPaso 2: Creación/Actualización de Variables Primitivas En la colección Primitives (o existente), crea las variables dentro del grupo raíz color:\nNomenclatura: color / [Color Pure Name in English] / [Scale]\nEjemplos: color / blue / 400, color / slate / 50, color / red / 600, color / emerald / 500.\nValor: Asigna el valor HEX exacto extraído del lienzo.\nPaso 3: Creación/Actualización de Variables Semánticas En la colección Semantic (o existente), crea las variables dentro del grupo raíz color:\nNomenclatura: color / [role] / [scale] (o color / [role] si no requiere escala).\nEjemplos: color / primary / 400, color / neutral / 50, color / success / 600, color / error / 800.\nValor: Conecta cada variable semántica como un Alias / Referencia a la variable primitiva correspondiente en Primitives (ej. color / primary / 400 → alias de color / blue / 400).\nPaso 4: Creación de Estilos de Color Tradicionales Genera los Local Color Styles en inglés usando la jerarquía semántica:\nNomenclatura: Color / [Role] / [Scale] (ej. Color / Primary / 400, Color / Success / 600).\nVinculación: Enlaza cada estilo a la Variable Semántica correspondiente.\nReporte de Salida: Confirma explícitamente al finalizar:\nColecciones reutilizadas/creadas.\nConfirmación de que las variables quedaron bajo la carpeta/grupo color.\nLista de variables Primitivas y Semánticas generadas.\nEstilos locales tradicionales creados.", "[PROMPT DE GENERACIÓN DE ESTILOS Y TOKENS DE TIPOGRAFÍA DINÁMICOS EN INGLÉS]\nRol: Actúa como un experto en Design Systems especializado en jerarquía tipográfica y tokens de texto en Figma.\nREGLA DE REUTILIZACIÓN DE COLECCIONES:\nComprobación de Colecciones Existentes: Revisa si ya existen las colecciones llamadas Primitives, Semantic o UI Kit Foundations.\nSi la colección YA EXISTE: Incorpora las variables de tipografía dentro de la carpeta/grupo raíz typography dentro de las colecciones primitivas y semánticas ya creadas. NO crees colecciones duplicadas.\nESTRUCTURA DE NIVELES Y AGRUPACIÓN RAÍZ:\nTodas las variables tipográficas DEBEN crearse bajo la categoría raíz Typography.\nIDIOMA Y NOMENCLATURA STRICTA:\nToda la nomenclatura DEBE estar 100% en INGLÉS. Traduce dinámicamente las etiquetas del lienzo (ej. \"Textos de Párrafo\" → body o paragraph, \"Textos Display\" → display, \"Encabezados\" / \"Titulares\" → heading).\nPaso 1: Análisis y Detección Dinámica del Canvas Escanea el marco o selección visible en el lienzo. Para cada bloque o muestra de tipografía detectada, lee dinámicamente:\nCategoría o Sección principal: Detecta el título del grupo/sección en el lienzo (ej. \"Textos de Párrafo\", \"Textos Display\", \"H1/H2/...\", o cualquier etiqueta definida por el estudiante).\nNombre de la Variante / Subnivel: Identifica la etiqueta del texto o el nombre del elemento (ej. Paragraph 01, Display 1, H1, H1 (S), Body / Large, etc.).\nPropiedades Técnicas de la Capa de Texto:\nFont Family (ej. Inter, Roboto, Poppins).\nFont Weight (ej. Regular, Medium, Semi Bold, Bold, Extra Bold).\nFont Size (Extrae el valor en px).\nLine Height y Letter Spacing (si aplican).\nPaso 2: Creación/Actualización de Variables Primitivas de Tipografía (REGLAS DE FORMATO Y ORDEN) Dentro de la colección Primitives (o existente), crea o actualiza las variables en el grupo typography:\nfont-family: typography / font-family / primary (o display si aplican varias).\nfont-size (REGLAS STRICTAS DE FORMATO Y ORDEN):\nRedondeo Obligatorio: NUNCA crees nombres o valores con decimales (ej. 28.91 o 20.48). Redondea siempre al entero más cercano (28.91 → 29, 20.48 → 20, 16.87 → 17, 13.85 → 14, 11.44 → 11, 8.43 → 8).\nNomenclatura Limpia: typography / font-size / [Rounded Integer] (ej. typography / font-size / 14, typography / font-size / 16, typography / font-size / 20).\nValor por Defecto: Asigna el número entero redondeado como el valor por defecto.\nOrden Ascendente: Genera e inserta la lista de variables de font-size estrictamente ordenadas de menor a mayor (ej. 8, 11, 14, 16, 17, 19, 20, 23, 29, 60, 72).\nfont-weight: typography / font-weight / [weight_name] (ej. regular, semibold, bold, extrabold).\nPaso 3: Creación Dinámica de Estilos de Texto Locales (Text Styles) Genera los Local Text Styles estructurándolos según lo leído en el Paso 1. Adapta la estructura dinámicamente a lo diseñado en el lienzo.\nEstructura de Nomenclatura Dinámica: [Category Translated] / [Detected Variant Name] / [Weight]\nEjemplos de cómo estructurar según lo detectado:\nDisplay / Display 1 / Semi Bold\nHeading / H1 / Bold\nBody / Paragraph 01 / Regular\nPaso 4: Vinculación y Aplicación\nAsigna las propiedades técnicas extraídas de las capas del lienzo a cada Estilo de Texto correspondiente.\nVincula el font-family y el font-size de cada estilo de texto a sus respectivas variables tipográficas recién redondeadas dentro del grupo typography.\nReporte de Salida: Confirma en el chat al finalizar:\nColecciones existentes reutilizadas.\nLista de valores de font-size redondeados y ordenados de menor a mayor.\nLas Familias Tipográficas y categorías detectadas en el lienzo.\nLa lista completa de los Estilos de Texto Locales creados.", "[PROMPT DE GENERACIÓN DE TOKENS DE ESPACIADO DINÁMICOS EN INGLÉS]\nRol: Actúa como un experto en Design Systems especializado en sistemas de retícula, espaciado (layout grid & spacing) y tokens de dimensión en Figma.\nREGLA DE REUTILIZACIÓN DE COLECCIONES:\nComprobación de Colecciones Existentes: Revisa si ya existen las colecciones llamadas Primitives, Semantic o UI Kit Foundations.\nSi la colección YA EXISTE: Incorpora las variables de espaciado dentro del grupo/carpeta raíz spacing en las colecciones de Primitivas y Semánticas ya creadas. NO crees colecciones duplicadas.\nESTRUCTURA DE NIVELES Y AGRUPACIÓN RAÍZ (CRUCIAL):\nTodas las variables de espaciado DEBEN crearse bajo la categoría raíz Spacing.\nIDIOMA Y NOMENCLATURA STRICTA:\nToda la nomenclatura DEBE crearse exclusivamente en INGLÉS, sin importar el idioma del lienzo. Traduce dinámicamente según lo detectado (\"Espacios\" / \"Medidas\" → spacing).\nPaso 1: Análisis y Detección Dinámica del Canvas (Espacios) Escanea el marco o selección de espacios visible en el lienzo. Para cada muestra o bloque de medida:\nExtrae el valor numérico en píxeles (ej. 4px, 8px, 12px, 16px, 24px, etc.).\nLee dinámicamente cualquier etiqueta, nombre de capa, texto adjunto o rol que el usuario haya escrito para esa medida en el lienzo (ej. xs, sm, md, compact, spacious, padding-s, gap-1, etc.).\nPaso 2: Creación/Actualización de Variables Primitivas de Espaciado (Primitives) Dentro de la colección Primitives (o existente), crea/actualiza las variables de tipo número (NUMBER) dentro del grupo raíz spacing:\nReglas de Formato y Nomenclatura:\nNomenclatura Limpia: spacing / [Integer] (ej. spacing / 4, spacing / 8, spacing / 12, spacing / 16). Omite la palabra \"px\" en el nombre de la variable para mantener la nomenclatura pura.\nRedondeo Obligatorio: Si algún valor de dimensión contiene decimales, redondéalo al número entero más cercano.\nValor por Defecto: Asigna el número entero exacto como valor numérico de la variable.\nOrden Ascendente: Crea e inserta las variables de spacing estrictamente ordenadas de menor a mayor (ej. 4, 8, 12, 16, 20, 24, 28, 32, 40, 48, 64, 80, 96, 128, 160, 192).\nPaso 3: Creación Dinámica de Variables Semánticas de Espaciado (Semantic) Dentro de la colección Semantic (o existente), crea los alias dentro del grupo raíz spacing dependiendo exclusivamente de las etiquetas del usuario:\nSi el lienzo contiene etiquetas definidas por el usuario:\nTraduce/adapta las etiquetas al inglés y crea las variables semánticas usando exactamente los nombres que el usuario diseñó (ej. spacing / [User_Defined_Label]).\nVincula cada variable semántica como un Alias / Referencia a su respectiva variable en Primitives.\nSi el lienzo SOLO contiene los valores numéricos sin etiquetas semánticas:\nGenera variables semánticas directas o mapea la jerarquía semántica según la nomenclatura estándar que detectes, o mantén la estructura spacing / [Value] enlazada a la primitiva, confirmando al usuario el esquema generado.\nReporte de Salida: Confirma en el chat al finalizar:\nColecciones existentes reutilizadas.\nConfirmación de que las variables de espaciado quedaron organizadas bajo la categoría raíz spacing.\nLista de variables Primitivas de Espaciado creadas de forma ascendente.\nLista de variables Semánticas de Espaciado creadas basándote en las etiquetas detectadas en el diseño del usuario.", "[PROMPT DE GENERACIÓN DE TOKENS DE BORDER RADIUS DINÁMICOS EN INGLÉS]\nRol: Actúa como un experto en Design Systems especializado en tokens de apariencia, redondeo de bordes (border radius) y dimensiones en Figma.\nREGLA DE REUTILIZACIÓN DE COLECCIONES:\nComprobación de Colecciones Existentes: Revisa si ya existen las colecciones llamadas Primitives, Semantic o UI Kit Foundations.\nSi la colección YA EXISTE: Incorpora las variables de border radius dentro del grupo/carpeta raíz Radius en las colecciones de Primitivas y Semánticas ya creadas. NO crees colecciones duplicadas.\nESTRUCTURA DE NIVELES Y AGRUPACIÓN RAÍZ (CRUCIAL):\nTodas las variables de border radius DEBEN crearse bajo la categoría raíz Border Radius.\nIDIOMA Y NOMENCLATURA STRICTA:\nToda la nomenclatura DEBE estar en INGLÉS. Traduce únicamente si el título principal o la categoría está en español (\"Border Radius\" / \"Redondeo\" → radius).\nPaso 1: Análisis y Detección Dinámica del Canvas (Border Radius) Escanea el marco o tabla visible en el lienzo (ej. sección \"Border Radius\"). Para cada fila o muestra detectada:\nExtrae el valor numérico de la columna o muestra \"Value\" (ej. 0, 2, 4, 6, 8, 10, 12, 16, 20, 32, 48, 999).\nLee dinámicamente el nombre o etiqueta exacta escrita por el usuario en la columna \"Name\" o texto adjunto (ej. radius-none, radius-xxxs, radius-xxs, radius-xs, radius-s, radius-m, radius-l, radius-xl, radius-xxl, radius-xxxl, radius-xxxxl, radius-max, o cualquier etiqueta personalizada definida en el diseño).\nPaso 2: Creación/Actualización de Variables Primitivas (Primitives) Dentro de la colección Primitives (o existente), crea/actualiza las variables de tipo número (NUMBER) dentro del grupo raíz radius:\nReglas de Formato y Nomenclatura:\nNomenclatura Limpia: radius / [Integer] (ej. radius / 0, radius / 2, radius / 4, radius / 8, radius / 12, radius / 999).\nRedondeo Obligatorio: Si algún valor de redondeo contiene decimales, redondéalo al número entero más cercano.\nValor por Defecto: Asigna el número entero exacto como valor numérico de la variable.\nOrden Ascendente: Crea e inserta las variables de radius estrictamente ordenadas de menor a mayor según su valor numérico (ej. 0, 2, 4, 6, 8, 10, 12, 16, 20, 32, 48, 999).\nPaso 3: Creación Dinámica de Variables Semánticas (Semantic) Dentro de la colección Semantic (o existente), crea los alias dentro del grupo raíz radius dependiendo exclusivamente de las etiquetas del usuario:\nSi el lienzo contiene nombres/etiquetas definidos por el usuario:\nUsa los nombres exactos que el usuario definió en el lienzo para las variables semánticas (ej. radius / radius-none o radius / [User_Defined_Name]).\nVincula cada variable semántica como un Alias / Referencia a su respectiva variable primitiva en Primitives (ej. radius / radius-none ➔ alias de radius / 0, radius / radius-max ➔ alias de radius / 999).\nSi el lienzo SOLO contiene valores numéricos sin nombres/etiquetas semánticas:\nGenera los alias o confirma con el usuario la nomenclatura a aplicar.\nReporte de Salida: Confirma en el chat al finalizar:\nColecciones existentes reutilizadas.\nConfirmación de que las variables de border radius quedaron organizadas bajo la categoría raíz radius.\nLista de variables Primitivas de Border Radius creadas de forma ascendente.\nLista de variables Semánticas de Border Radius creadas respetando exactamente los nombres definidos por el usuario en su lienzo.", "[PROMPT DE GENERACIÓN DE ESTILOS DE GRILLAS Y TOKENS DE SCREEN SIZES EN INGLÉS]\nRol: Actúa como un experto en Design Systems especializado en responsive design, layout grids y breakpoints de pantalla en Figma.\nREGLA DE REUTILIZACIÓN DE COLECCIONES:\nComprobación de Colecciones Existentes: Revisa si ya existen las colecciones llamadas Primitives, Semantic o UI Kit Foundations.\nSi la colección YA EXISTE: Incorpora las variables de dimensiones de pantalla dentro del grupo/carpeta raíz Screen Sizes en las colecciones de Primitivas y Semánticas ya creadas. NO crees colecciones duplicadas.\nIDIOMA Y NOMENCLATURA STRICTA:\nToda la nomenclatura DEBE estar en INGLÉS. Traduce únicamente los títulos o categorías si están en español (\"Grillas\" → Grid, \"Pequeño\" → Small, \"Mediano\" → Medium, \"Grande\" → Large).\nPaso 1: Análisis y Detección Dinámica del Canvas Escanea el marco o sección visible en el lienzo (ej. \"Grillas\" o \"Layout Grids\"):\nPara Tamaños de Pantalla (Breakpoints / Screen Sizes):\nDetecta los rangos o valores de resolución definidos en las etiquetas/subtítulos (ej. 320px - 599px ➔ 320, 600px - 1135px ➔ 600, 1136px & Larger ➔ 1136).\nLee dinámicamente el nombre o etiqueta semántica definida por el usuario para cada rango (ej. Small, Medium, Large, Fluid container, o cualquier otra etiqueta escrita en el canvas).\nPara Configuración de Grillas (Layout Grids):\nExtrae las propiedades técnicas de cada muestra de grilla:\nCount / Columns: Número de columnas (ej. 4 columns, 6 columns, 8 columns, 12 columns).\nMargin: Valor en px (ej. 16px, 32px, 112px, 24px).\nGutter: Valor en px (ej. 12px, 20px, 32px, 24px).\nType: Stretch / Auto o Centered según la especificación del lienzo.\nPaso 2: Creación de Variables de Tamaños de Pantalla (Primitives & Semantic) (Aplica ÚNICAMENTE a Screen Sizes / Breakpoints; las grillas NO generan variables)\nPrimitivas (Primitives):\nCrea/actualiza en la colección Primitives dentro del grupo raíz screen (o breakpoint):\nNomenclatura Limpia: screen / [Integer] (ej. screen / 320, screen / 600, screen / 1136).\nOrden Ascendente: Genera las variables ordenadas numéricamente de menor a mayor.\nSemánticas (Semantic):\nCrea/actualiza en la colección Semantic dentro del grupo raíz screen (o breakpoint):\nNomenclatura Dinámica: screen / [User_Defined_Name] utilizando exactamente los nombres/etiquetas definidos por el usuario en el lienzo traducidos al inglés (ej. screen / small ➔ alias de screen / 320, screen / medium ➔ alias de screen / 600, screen / large ➔ alias de screen / 1136).\nPaso 3: Creación Dinámica de Estilos de Grilla Locales (Grid Styles) Genera los Local Layout Grid Styles en Figma basándote exclusivamente en la jerarquía y nombres que el usuario estructuró en su lienzo:\nNomenclatura Dinámica de Estilos: [Section_or_Category] / [User_Defined_Label_or_Columns] Ejemplos según lo detectado en el lienzo:\nSi detectas sección \"Small\" y tarjeta \"4 columns\" ➔ Small / 4 Columns\nSi detectas sección \"Medium\" y tarjeta \"8 columns\" ➔ Medium / 8 Columns\nSi detectas sección \"Fluid container / Layout\" y tarjeta \"12 columns (auto)\" ➔ Fluid Layout / 12 Columns (No fuerces prefijos fijos; adapta la estructura de carpetas a la organización del usuario).\nPropiedades Aplicadas al Layout Grid:\nPattern: Columns\nCount: Número de columnas extraído.\nGutter: Valor numérico de gutter extraído.\nMargin: Valor numérico de margin extraído.\nReporte de Salida: Confirma en el chat al finalizar:\nColecciones existentes reutilizadas para las variables de screen.\nLista de variables Primitivas y Semánticas de Screen Sizes creadas de forma ascendente.\nLista completa de los Local Grid Styles creados en Figma respetando la nomenclatura del usuario y sus parámetros técnicos (Columnas, Margin, Gutter).", "[PROMPT DE GENERACIÓN DE ESTILOS DE EFECTOS DINÁMICOS EN INGLÉS]\nRol: Actúa como un experto en Design Systems especializado en estilos de efectos visuales (Effect Styles: Sombras, Anillos de Enfoque/Focus, Blurs) en Figma.\nREGLA IMPORTANTE SOBRE VARIABLES:\nNO crees variables Primitivas ni Semánticas para esta sección. Los efectos se deben registrar exclusivamente como Effect Styles locales de Figma (Local Effect Styles).\nIDIOMA Y NOMENCLATURA STRICTA:\nToda la nomenclatura DEBE estar en INGLÉS. Traduce dinámicamente únicamente el nombre principal de la sección o categoría si está en español (ej. \"Sombras\" → Shadows, \"Focus\" → Focus).\nPaso 1: Análisis y Detección Dinámica del Canvas (Efectos) Escanea el marco, sección o tarjetas visibles dentro de la zona de \"Efectos\". Para cada muestra visual detectada:\nCategoría o Sección principal: Detecta el título del grupo/bloque en el lienzo (ej. \"Sombras\", \"Focus\", \"Elevations\", \"Blurs\", o cualquier otra categoría definida por el diseñador).\nNombre o Etiqueta de la Muestra: Lee el texto, nombre del nodo o etiqueta específica escrita por el usuario (ej. shadow-xs, shadow-s, focus-s, focus-m, elevation-1, o la etiqueta que haya colocado).\nPropiedades Técnicas del Efecto: Extrae de la capa inspeccionada todos sus parámetros de efecto:\nType: Drop Shadow, Inner Shadow, Layer Blur o Background Blur.\nColor & Opacity: Hexadecimal y porcentaje de transparencia/alpha.\nCoordinates & Blur: Offset X, Offset Y, Blur radius y Spread radius. (Si una muestra contiene múltiples sombras o efectos combinados en la misma capa, extrae la lista completa de efectos aplicados).\nPaso 2: Creación Dinámica de Estilos de Efectos Locales (Effect Styles) Genera los Local Effect Styles en Figma dependiendo exclusivamente de las secciones y etiquetas que el usuario diseñó en su lienzo:\nEstructura de Nomenclatura Dinámica: [Category Translated] / [Detected Label] o [Detected Label] (según la jerarquía visual del canvas)\nEjemplos de adaptación según lo que detectes en el lienzo:\nSi la sección se llama \"Sombras\" (traducido a Shadow o Shadows) y la tarjeta tiene el texto shadow-xs ➔ Shadow / shadow-xs (o simplemente Shadows / shadow-xs).\nSi la sección se llama \"Focus\" y la tarjeta tiene el texto focus-s ➔ Focus / focus-s.\nSi el lienzo no tiene categorías y solo tiene etiquetas directas como elevation-01 ➔ elevation-01.\n(NO fuerces prefijos ni nombres de carpetas preconcebidos; adapta la estructura de nombres a lo que el usuario haya escrito en su lienzo).\nPaso 3: Aplicación de Parámetros Técnicos Asigna a cada Estilo de Efecto local creado los valores exactos (Offset X, Offset Y, Blur, Spread, Color y Opacidad) extraídos de la muestra correspondiente del canvas.\nReporte de Salida: Confirma en el chat al finalizar:\nLas categorías de efectos detectadas en el lienzo (ej. Shadows, Focus).\nConfirmación de que NO se crearon variables (cumpliendo las buenas prácticas de Design Systems).\nLa lista completa de los Local Effect Styles creados en Figma respetando los nombres y la estructura diseñados por el usuario, junto con sus parámetros técnicos principales."];

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const sentence = s => { const l = s.toLocaleLowerCase("es"); return l.charAt(0).toLocaleUpperCase("es") + l.slice(1); };
const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let active = 0;
function flashCopied(list){
  list.forEach(p => { p.copied = true; clearTimeout(p.t); p.t = setTimeout(() => { p.copied = false; renderTabs(); renderPanel(); }, 2000); });
  renderTabs(); renderPanel();
}
try { const s = localStorage.getItem("fap-tab"); if (s !== null && PROMPTS[+s]) active = +s; } catch(e){}

function formatBody(text){
  const lines = text.split("\n").slice(1).filter(l => l.trim());
  return lines.map(l => {
    const t = esc(l.trim());
    const step = l.match(/^Paso (\d+):\s*(.*)$/);
    if (step) return `<div class="step"><b aria-hidden="true">${step[1]}</b><p><span class="sr">Paso ${step[1]}: </span>${esc(step[2])}</p></div>`;
    const letters = l.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g,"");
    if (letters.length > 4 && letters === letters.toUpperCase() && l.trim().endsWith(":")) return `<h3>${esc(sentence(l.trim().replace(/:$/,"")))}</h3>`;
    const lab = l.match(/^([^:]{2,45}):\s*(.*)$/);
    if (lab && !/[.(]/.test(lab[1])) return lab[2] ? `<p><strong>${esc(lab[1])}:</strong> ${esc(lab[2])}</p>` : `<p><strong>${esc(lab[1])}:</strong></p>`;
    return `<p>${t}</p>`;
  }).join("");
}

function renderTabs(){
  $("#countLbl").textContent = T().count(PROMPTS.length);
  $("#tabs").innerHTML = PROMPTS.map((p,i) => `
    <div class="card" role="presentation" style="--c:var(${p.c})">
    <button class="tab" role="tab" id="tab-${i}" aria-controls="panel" aria-selected="${i===active}" tabindex="${i===active?0:-1}" data-i="${i}">
      <span class="ico" aria-hidden="true">${ICONS[p.key](`var(${p.c})`)}</span>
      <span><span class="tab-name">${nm(p)}</span><span class="tab-meta">${T().steps(p.steps)}${p.copied?`<span class="sr">${T().copiedSr}</span>`:""}</span></span>
    </button>
    <button class="card-copy${p.copied?" copied":""}" data-copy="${i}" aria-label="${T().copyP(nm(p))}" title="${T().copyP(nm(p))}">${p.copied?CHECK_ICON:COPY_ICON}</button>
    </div>`).join("");
  $("#nav").innerHTML = PROMPTS.map((p,i) => `
    <button data-i="${i}" aria-current="${i===active}" aria-label="${nm(p)}" title="${nm(p)}">${NAVICON[p.key]}<span class="lbl">${nm(p)}</span></button>`).join("");
}
function renderPanel(){
  const p = PROMPTS[active];
  const panel = $("#panel");
  panel.style.setProperty("--c", `var(${p.c})`);
  panel.setAttribute("aria-labelledby", `tab-${active}`);
  panel.innerHTML = `
    <div class="p-head">
      <span class="ico" aria-hidden="true">${ICONS[p.key](`var(${p.c})`)}</span>
      <div><h2 class="p-title">${nm(p)}</h2><p class="p-kicker">${esc(sentence(p.kicker))}</p></div>
      <button class="p-copy" id="pCopy">${p.copied?CHECK_ICON:COPY_ICON}<span>${p.copied?T().copied:T().copyP(nm(p))}</span></button>
    </div>
    <pre class="code" tabindex="0" aria-label="${T().promptText(nm(p))}">${esc(p.text)}</pre>`;
  $("#pCopy").onclick = () => copyPrompt(active);
  $("#fab").innerHTML = p.copied ? CHECK_ICON : COPY_ICON;
  $("#fab").setAttribute("aria-label", T().copyP(nm(p)));
  $("#fab").title = T().copyP(nm(p));
}
function select(i, focus){
  active = (i + PROMPTS.length) % PROMPTS.length;
  try { localStorage.setItem("fap-tab", active); } catch(e){}
  renderTabs(); renderPanel();
  if (focus) $(`#tab-${active}`).focus();
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(_){}
    ta.remove(); return ok;
  }
}
let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800);
}

async function copyPrompt(i){
  const p = PROMPTS[i];
  if (await copyText(p.text)) { flashCopied([p]); toast(T().toastOne(nm(p))); }
  else toast(T().failOne);
}
$("#tabs").addEventListener("click", e => {
  const c = e.target.closest(".card-copy"); if (c) { copyPrompt(+c.dataset.copy); return; }
  const b = e.target.closest(".tab"); if (b) select(+b.dataset.i);
});
const SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>`;
const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`;
let theme = "light";
try { theme = localStorage.getItem("fap-theme") || "light"; } catch(e){}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  const next = theme === "light" ? "dark" : "light";
  const b = $("#themeBtn");
  b.innerHTML = theme === "light" ? MOON : SUN;
  b.setAttribute("aria-label", T().themeTo(next)); b.title = T().themeTo(next);
}
$("#themeBtn").addEventListener("click", () => { theme = theme === "light" ? "dark" : "light"; try { localStorage.setItem("fap-theme", theme); } catch(e){} applyTheme(); });
function applyLang(){
  const t = T();
  document.documentElement.lang = lang;
  document.title = t.docTitle;
  $("#headSub").textContent = t.headSub;
  $("#headTitle").textContent = t.headTitle;
  $("#info").setAttribute("aria-label", t.infoLabel);
  $("#infoText").innerHTML = t.info;
  $("#tabsLabel").textContent = t.yourPrompts;
  $("#nav").setAttribute("aria-label", t.nav);
  $("#copyAll").setAttribute("aria-label", t.copyAll); $("#copyAll").title = t.copyAll;
  const lb = $("#langBtn"); lb.textContent = t.langCode; lb.setAttribute("aria-label", t.langTo); lb.title = t.langTo;
  applyTheme(); renderTabs(); renderPanel();
}
$("#langBtn").addEventListener("click", () => { lang = lang === "es" ? "en" : "es"; try { localStorage.setItem("fap-lang", lang); } catch(e){} applyLang(); });
$("#tabs").addEventListener("keydown", e => {
  const cols = getComputedStyle($("#tabs")).gridTemplateColumns.split(" ").length;
  const map = {ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols};
  if (e.key in map){ e.preventDefault(); select(active + map[e.key], true); }
  if (e.key === "Home"){ e.preventDefault(); select(0, true); }
  if (e.key === "End"){ e.preventDefault(); select(PROMPTS.length-1, true); }
});
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) select(+b.dataset.i); });

$("#fab").addEventListener("click", () => copyPrompt(active));
$("#copyAll").addEventListener("click", async () => {
  const all = PROMPTS.map(p => p.text.trim()).join("\n\n---\n\n");
  if (await copyText(all)) { flashCopied(PROMPTS); toast(T().toastAll(PROMPTS.length)); }
  else toast(T().failAll);
});

select(active);
applyLang();
</script>
</body>
</html>
