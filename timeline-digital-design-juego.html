ch","title_en":"3D Touch","desc":"El iPhone 6s introduce 3D Touch, pantallas sensibles a la presión que habilitan las vistas previas de Peek & Pop y Acciones Rápidas desde la pantalla de inicio (descontinuado más adelante en favor de Haptic Touch).","desc_en":"The iPhone 6s introduces 3D Touch, pressure-sensitive screens enabling Peek & Pop previews and Quick Actions from the home screen (later discontinued in favor of Haptic Touch).","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Una tecnología ambiciosa que terminó siendo reemplazada: no todo patrón innovador sobrevive al mercado.","note_en":"An ambitious technology that ended up being replaced: not every innovative pattern survives the market."},{"id":"UX-0041","year":2015,"title":"Live Photos","title_en":"Live Photos","desc":"Apple introduce Live Photos, que capturan unos segundos de movimiento y sonido alrededor de una foto fija, difuminando la línea entre foto y video en la UX de cámara.","desc_en":"Apple introduces Live Photos, capturing a few seconds of motion and sound around a still image, blurring the line between photo and video in camera UX.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Un nuevo formato híbrido que exigió repensar cómo se visualiza y comparte una 'foto'.","note_en":"A new hybrid format that forced a rethink of how a 'photo' is viewed and shared."},{"id":"TEC-0104","year":2015,"title":"Creación de AGETIC — Bolivia impulsa soberanía tecnológica","title_en":"AGETIC is created — Bolivia pushes for technological sovereignty","desc":"Bolivia crea la Agencia de Gobierno Electrónico y TIC (AGETIC) mediante Decreto Supremo N° 2514, consolidando políticas de gobierno electrónico, software libre y estándares abiertos. Representa el mayor hito de política tecnológica soberana en la historia digital boliviana.","desc_en":"Bolivia creates the Agency for Electronic Government and ICT (AGETIC) through Supreme Decree No. 2514, consolidating e-government, free software and open standards policies. It is the biggest sovereign technology policy milestone in Bolivia's digital history.","cats":["Software"],"importance":2,"region":"Bolivia","region_en":"Bolivia","note":"","note_en":"","source":"Decreto Supremo N° 2514 (2015); AGETIC.gob.bo; Wikipedia Historia de Internet en Bolivia"},{"id":"PAT-0027","year":2016,"title":"Atomic Design (libro de Brad Frost)","title_en":"Atomic Design (Brad Frost's book)","desc":"Brad Frost publica el framework Atomic Design como libro, una guía para crear bibliotecas de componentes y sistemas de diseño.","desc_en":"Brad Frost publishes the Atomic Design framework as a book, a guide to creating component libraries and design systems.","cats":["Patrones","UX/UI"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"Probablemente el método de componentes más citado en equipos de producto.","note_en":"Probably the most-cited component method in product teams."},{"id":"UX-0042","year":2016,"title":"Chatbots","title_en":"Chatbots","desc":"Facebook Messenger y otras plataformas abren sus plataformas de bots, masificando la interfaz conversacional (chatbots) como capa de interacción con servicios dentro de apps de mensajería.","desc_en":"Facebook Messenger and other platforms open up bot platforms, mainstreaming the conversational interface (chatbot) as a layer for interacting with services inside messaging apps.","cats":["UX/UI","IA","Social"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"El chat, pensado para hablar con personas, se convierte también en la interfaz para hablar con software.","note_en":"Chat, designed for talking to people, also becomes the interface for talking to software."},{"id":"UX-0043","year":2016,"title":"Pokémon GO y AR masiva","title_en":"Pokémon GO and mass-market AR","desc":"Pokémon GO de Niantic se convierte en la primera experiencia de realidad aumentada móvil masiva, superponiendo elementos de juego sobre la cámara y popularizando la interacción AR basada en ubicación.","desc_en":"Niantic's Pokémon GO becomes the first mass-market mobile augmented-reality experience, overlaying game elements onto the camera feed and popularizing location-based AR interaction.","cats":["VR/AR","Mobile","Gaming"],"importance":3,"region":"Estados Unidos / Japón","region_en":"United States / Japan","note":"Millones de personas caminando con el teléfono en alto: la primera vez que AR salió del laboratorio a la calle.","note_en":"Millions of people walking around with their phone held up: the first time AR left the lab and hit the street."},{"id":"UX-0044","year":2016,"title":"Reacciones animadas","title_en":"Animated reactions","desc":"Facebook lanza Reacciones basadas en emoji (más allá del 'Me gusta'), y Messenger/iMessage suman reacciones tipo tapback, agregando gestos livianos de respuesta emocional a la mensajería.","desc_en":"Facebook launches emoji-based Reactions (beyond 'Like'), and Messenger/iMessage add tapback-style reactions, adding lightweight emotional-response gestures to messaging.","cats":["UX/UI","Social","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Responder con un gesto en vez de escribir: la eficiencia emocional como patrón de diseño.","note_en":"Responding with a gesture instead of typing: emotional efficiency as a design pattern."},{"id":"TEC-0105","year":2016,"title":"TikTok (Douyin)","title_en":"TikTok (Douyin)","desc":"ByteDance lanza Douyin en China (luego TikTok globalmente), introduciendo el formato de video corto algorítmico que redefiniría el consumo de contenido.","desc_en":"ByteDance launches Douyin in China (later TikTok globally), introducing the algorithmic short-video format that would redefine content consumption.","cats":["Social","Mobile"],"importance":3,"region":"China","region_en":"China","note":"","note_en":"","source":"Telefónica - Social Networks"},{"id":"PAT-0028","year":2017,"title":"Grandes empresas publican sus design systems","title_en":"Large companies publish their design systems","desc":"Desde 2014, muchas grandes corporaciones desarrollan y publican sus design systems completos: patrones, especificaciones visuales y componentes de código. La tendencia cierra el círculo al unir patrones de diseño y patrones de código (2014–presente).","desc_en":"Since 2014, many large corporations develop and publicly release complete design systems: patterns, visual specs and code components. The trend comes full circle, bringing design patterns and code patterns together (2014–present).","cats":["Patrones","UX/UI","Software"],"importance":3,"region":"Global","region_en":"Global","note":"De Alexander al design system: cuarenta años de la misma idea, problema recurrente → solución reutilizable.","note_en":"From Alexander to the design system: forty years of the same idea, recurring problem → reusable solution."},{"id":"UX-0045","year":2017,"title":"Navegación gestual (iPhone X)","title_en":"Gesture navigation (iPhone X)","desc":"El iPhone X elimina por completo el botón de inicio y lo reemplaza con un sistema de deslizamientos desde el borde (swipe-up para ir a inicio, mantener para el multitarea), el primer sistema de navegación totalmente gestual en un teléfono masivo.","desc_en":"The iPhone X removes the home button entirely, replacing it with a system of edge swipes (swipe-up for home, swipe-and-hold for the app switcher) — the first fully gesture-based navigation system on a mainstream phone.","cats":["UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"Quitar un botón físico obligó a rediseñar, de una sola vez, todo el sistema de navegación de iOS.","note_en":"Removing one physical button forced a complete, one-shot redesign of iOS's entire navigation system."},{"id":"UX-0046","year":2017,"title":"Face ID","title_en":"Face ID","desc":"Apple reemplaza Touch ID por Face ID en el iPhone X, usando una cámara TrueDepth infrarroja para autenticación por reconocimiento facial, ligada directamente al nuevo diseño sin botón físico.","desc_en":"Apple replaces Touch ID with Face ID on the iPhone X, using an infrared TrueDepth camera for facial-recognition authentication, tied directly to the new buttonless design.","cats":["UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"Mirar el teléfono para desbloquearlo: la autenticación más rápida jamás diseñada, hasta que dejás de mirarlo.","note_en":"Looking at your phone to unlock it: the fastest authentication ever designed — until you stop looking at it."},{"id":"UX-0047","year":2017,"title":"Animoji","title_en":"Animoji","desc":"La cámara TrueDepth del iPhone X habilita los Animoji, personajes animados que reflejan en tiempo real las expresiones faciales del usuario.","desc_en":"The iPhone X's TrueDepth camera enables Animoji, animated characters that mirror the user's facial expressions in real time.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Sensado facial usado para expresión lúdica, no solo para seguridad: el mismo hardware, dos propósitos.","note_en":"Facial sensing used for playful expression, not just security: the same hardware, two purposes."},{"id":"UX-0048","year":2017,"title":"Interfaces conscientes de la atención","title_en":"Attention-aware interfaces","desc":"El iPhone X usa su sensor frontal para detectar cuándo el usuario está mirando la pantalla, atenuando notificaciones o manteniendo la pantalla encendida solo mientras hay atención sostenida.","desc_en":"The iPhone X uses its front sensor to detect when the user is looking at the screen, dimming notifications or keeping the display on only while attention is sustained.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Un patrón temprano de diseño que responde a la mirada humana, no solo al toque.","note_en":"An early design pattern that responds to the human gaze, not just to touch."},{"id":"TEC-0106","year":2017,"title":"Apple Watch Series 3 (conectividad celular)","title_en":"Apple Watch Series 3 (cellular connectivity)","desc":"Apple Watch gana conectividad celular propia, liberando al smartwatch de la dependencia total del iPhone.","desc_en":"The Apple Watch gains its own cellular connectivity, freeing the smartwatch from total dependence on the iPhone.","cats":["Wearables"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"RoboticsBiz - Wearable Tech History"},{"id":"UX-0049","year":2018,"title":"Memoji","title_en":"Memoji","desc":"Apple extiende los Animoji hacia los Memoji, permitiendo construir un avatar animado y personalizable del propio usuario para usar en mensajería.","desc_en":"Apple extends Animoji into Memoji, letting users build a customizable, animated avatar of themselves for use in messaging.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"La identidad visual personal entra a la mensajería como un elemento diseñable, no solo una foto de perfil.","note_en":"Personal visual identity enters messaging as a designable element, not just a profile photo."},{"id":"UX-0050","year":2018,"title":"Haptic Touch","title_en":"Haptic Touch","desc":"Apple reemplaza el sensible a presión 3D Touch por Haptic Touch, una alternativa basada en mantener presionado más vibración, más fácil de implementar en un rango más amplio de hardware.","desc_en":"Apple replaces pressure-sensitive 3D Touch with Haptic Touch, a long-press-plus-vibration alternative that's easier to implement across a much wider range of hardware.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"A veces simplificar una tecnología (de presión a tiempo) mejora la consistencia del ecosistema completo.","note_en":"Sometimes simplifying a technology (from pressure to time) improves consistency across the whole ecosystem."},{"id":"UX-0051","year":2018,"title":"Navegación gesture-first","title_en":"Gesture-first navigation","desc":"Android 9 Pie introduce un nuevo sistema de navegación basado en gestos (indicador de inicio en forma de píldora), con Google siguiendo el camino abierto por el iPhone X para reducir botones en pantalla.","desc_en":"Android 9 Pie introduces a new gesture-based navigation system (a pill-shaped home indicator), with Google following the path opened by the iPhone X to reduce on-screen buttons.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"La convergencia de patrones entre iOS y Android acelera cuando un gesto exitoso se copia rápido.","note_en":"The convergence of patterns between iOS and Android accelerates whenever a successful gesture gets copied fast."},{"id":"TEC-0107","year":2018,"title":"Cambridge Analytica y regulación de datos","title_en":"Cambridge Analytica and data regulation","desc":"Se revela el escándalo de Cambridge Analytica con datos de Facebook, acelerando la regulación global de privacidad (GDPR) y el escrutinio de redes sociales.","desc_en":"The Cambridge Analytica scandal involving Facebook data is revealed, accelerating global privacy regulation (GDPR) and scrutiny of social networks.","cats":["Social"],"importance":2,"region":"Estados Unidos / Reino Unido","region_en":"United States / United Kingdom","note":"","note_en":"","source":"Hootsuite - History of Social Media"},{"id":"DEV-0011","year":2019,"title":"Samsung Galaxy Fold","title_en":"Samsung Galaxy Fold","desc":"Samsung lanza el primer smartphone plegable de producción masiva, introduciendo desafíos de diseño alrededor de layouts adaptativos y continuidad entre estados de pantalla.","desc_en":"Samsung launches the first mass-produced foldable smartphone, introducing design challenges around adaptive layouts and continuity across screen states.","cats":["Mobile","Hardware"],"importance":2,"region":"Corea del Sur","region_en":"South Korea","note":"Los patrones de 'continuidad' al plegar/desplegar se volverían un nuevo territorio de la UX.","note_en":"'Continuity' patterns for folding/unfolding would become an entirely new UX frontier."},{"id":"MOB-0009","year":2019,"title":"Despliegue comercial de 5G","title_en":"Commercial rollout of 5G","desc":"Corea del Sur y Estados Unidos (Verizon) lanzan las primeras redes 5G comerciales, prometiendo latencia ultra baja que habilitaría realidad aumentada, cloud gaming e interfaces IoT más densas.","desc_en":"South Korea and the United States (Verizon) launch the first commercial 5G networks, promising ultra-low latency that would enable augmented reality, cloud gaming, and denser IoT interfaces.","cats":["Mobile"],"importance":2,"region":"Corea del Sur / Estados Unidos","region_en":"South Korea / United States","note":"La latencia baja del 5G es lo que hace viables las interacciones AR en tiempo real.","note_en":"5G's low latency is what makes real-time AR interactions viable."},{"id":"UX-0052","year":2019,"title":"Navegación gestual de Android","title_en":"Android gesture navigation","desc":"Android 10 finaliza una navegación completamente gestual (deslizamientos desde el borde para atrás/inicio/apps recientes), permitiendo desactivar por completo la barra de navegación de tres botones.","desc_en":"Android 10 finalizes fully gestural navigation (edge swipes for back/home/recent apps), letting users disable the traditional three-button nav bar entirely.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Dos ecosistemas distintos convergen, con matices, en el mismo lenguaje gestual de navegación.","note_en":"Two distinct ecosystems converge, with nuances, on the same gestural navigation language."},{"id":"UX-0053","year":2019,"title":"UX para pantallas plegables","title_en":"Foldable UX","desc":"Con el Galaxy Fold y dispositivos similares, el diseño debe resolver la 'continuidad': apps que se redimensionan en vivo mientras la pantalla se despliega, y nuevos patrones de multitarea en pantallas plegadas más grandes.","desc_en":"With the Galaxy Fold and similar devices, design has to solve for 'continuity': apps resizing live as the screen unfolds, and new multitasking patterns for larger folded screens.","cats":["UX/UI","Mobile"],"importance":2,"region":"Corea del Sur","region_en":"South Korea","note":"Diseñar para un dispositivo que cambia de forma de tamaño en medio del uso es un problema nuevo por completo.","note_en":"Designing for a device that changes shape and size mid-use is an entirely new kind of problem."},{"id":"UX-0054","year":2019,"title":"Modo oscuro (Dark Mode)","title_en":"Dark Mode","desc":"iOS 13 y Android 10 lanzan modo oscuro a nivel de todo el sistema, obligando a todo el ecosistema de diseño a soportar temas de color claro y oscuro como expectativa básica.","desc_en":"iOS 13 and Android 10 both ship system-wide Dark Mode, forcing the entire design ecosystem to support light and dark color themes as a baseline expectation.","cats":["UX/UI","Mobile"],"importance":2,"region":"Global","region_en":"Global","note":"De opción estética a requisito de accesibilidad y ahorro de batería: el modo oscuro cambió el proceso de diseño de sistemas de color.","note_en":"From aesthetic option to accessibility and battery-saving requirement: Dark Mode changed how color systems get designed."},{"id":"DEV-0012","year":2020,"title":"iPad Pro con LiDAR","title_en":"iPad Pro with LiDAR","desc":"Apple incorpora un escáner LiDAR al iPad Pro, habilitando detección de profundidad para una colocación e interacción de objetos de realidad aumentada mucho más precisa.","desc_en":"Apple adds a LiDAR scanner to the iPad Pro, enabling depth sensing for far more precise placement and interaction with augmented-reality objects.","cats":["Mobile","Hardware"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Profundidad de sensor = objetos AR que finalmente 'se quedan quietos' en el mundo real.","note_en":"Sensor depth = AR objects that finally 'stay put' in the real world."},{"id":"UX-0055","year":2020,"title":"Widgets interactivos","title_en":"Interactive widgets","desc":"iOS 14 rediseña los widgets de pantalla de inicio para mostrar información viva y de un vistazo (y más adelante controles interactivos), moviendo la pantalla de inicio de íconos estáticos hacia contenido dinámico.","desc_en":"iOS 14 redesigns home-screen widgets to show live, glanceable information (and later interactive controls), moving the home screen from static icons toward dynamic content.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"La pantalla de inicio pasa de ser un directorio de apps a ser, en sí misma, una superficie de información.","note_en":"The home screen goes from being an app directory to becoming, in itself, an information surface."},{"id":"UX-0056","year":2020,"title":"Arrastrar y soltar múltiples ítems","title_en":"Multi-item drag & drop","desc":"iPadOS perfecciona el drag & drop para soportar tomar varios ítems a la vez y moverlos entre apps, extendiendo gestos de multitarea de nivel escritorio hacia las tablets.","desc_en":"iPadOS refines drag-and-drop to support picking up several items at once and moving them between apps, extending desktop-class multitasking gestures to tablets.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Un gesto que traslada metáforas de productividad de escritorio a un dispositivo pensado originalmente para consumo.","note_en":"A gesture that carries desktop productivity metaphors onto a device originally designed for consumption."},{"id":"UX-0057","year":2020,"title":"Interacciones con LiDAR","title_en":"LiDAR interactions","desc":"Los iPad/iPhone con LiDAR permiten que las apps de realidad aumentada coloquen objetos virtuales con comprensión de profundidad casi instantánea y precisa, mejorando oclusión y realismo en la UX de AR.","desc_en":"LiDAR-equipped iPads/iPhones let AR apps place virtual objects with near-instant, accurate depth understanding, improving occlusion and realism in AR UX.","cats":["VR/AR","UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Cuanto mejor entiende el sensor el mundo real, menos 'trucos' de diseño necesita disimular en AR.","note_en":"The better the sensor understands the real world, the fewer design 'tricks' AR needs to hide."},{"id":"TEC-0108","year":2020,"title":"TikTok se vuelve la app más descargada del mundo","title_en":"TikTok becomes the world's most downloaded app","desc":"TikTok lidera las descargas globales impulsado por la pandemia, consolidando el video corto algorítmico como formato dominante.","desc_en":"TikTok leads global downloads, boosted by the pandemic, consolidating algorithmic short video as the dominant format.","cats":["Social","Mobile"],"importance":2,"region":"China / Global","region_en":"China / Global","note":"","note_en":"","source":"Brand Vision - History of Social Media"},{"id":"TEC-0109","year":2020,"title":"Oura Ring","title_en":"Oura Ring","desc":"El anillo inteligente Oura gana popularidad por su monitoreo avanzado de sueño y salud, consolidando una nueva categoría de wearable discreto.","desc_en":"The Oura smart ring gains popularity for its advanced sleep and health tracking, consolidating a new category of discreet wearable.","cats":["Wearables"],"importance":1,"region":"Finlandia","region_en":"Finland","note":"","note_en":"","source":"RoboticsBiz - Wearable Tech History"},{"id":"UX-0059","year":2021,"title":"Design tokens","title_en":"Design tokens","desc":"Los sistemas de diseño multiplataforma formalizan cada vez más los 'design tokens' (valores nombrados de color, espaciado, tipografía) para que una sola fuente de verdad guíe una UI consistente en iOS, Android y web.","desc_en":"Cross-platform design systems increasingly formalize 'design tokens' (named values for color, spacing, typography) so a single source of truth can drive consistent UI across iOS, Android, and web.","cats":["Patrones","UX/UI"],"importance":1,"region":"Global","region_en":"Global","note":"Menos un gesto visible y más una infraestructura invisible que hace posible la consistencia entre plataformas.","note_en":"Less a visible gesture and more an invisible infrastructure that makes cross-platform consistency possible."},{"id":"UX-0058","year":2021,"title":"Live Text","title_en":"Live Text","desc":"iOS 15 introduce Live Text, permitiendo que la cámara o cualquier foto reconozca texto y deje seleccionarlo, copiarlo o accionarlo directamente dentro de una imagen en tiempo real.","desc_en":"iOS 15 introduces Live Text, letting the camera or any photo recognize text and let users select, copy, or act on it directly within an image in real time.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"La cámara deja de ser solo captura y se convierte en una herramienta de lectura e interacción con texto.","note_en":"The camera stops being just a capture tool and becomes a text-reading and interaction tool."},{"id":"TEC-0110","year":2021,"title":"Meta y el 'Metaverso'","title_en":"Meta and the 'Metaverse'","desc":"Facebook se rebautiza como 'Meta', apostando estratégicamente por el metaverso y la realidad virtual/aumentada como el futuro de la computación social.","desc_en":"Facebook rebrands as 'Meta', strategically betting on the metaverse and virtual/augmented reality as the future of social computing.","cats":["Social","VR/AR"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Conocimiento general verificado"},{"id":"TEC-0111","year":2021,"title":"Clubhouse","title_en":"Clubhouse","desc":"Clubhouse populariza brevemente las redes sociales basadas en audio en vivo, antes de ser eclipsada por funciones similares de competidores.","desc_en":"Clubhouse briefly popularizes live-audio social networks before being eclipsed by similar features from competitors.","cats":["Social"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Brand Vision - History of Social Media"},{"id":"UX-0060","year":2022,"title":"Dynamic Island","title_en":"Dynamic Island","desc":"Apple convierte el recorte de cámara frontal del iPhone 14 Pro en la Dynamic Island, un área interactiva que cambia de forma para mostrar actividades en vivo y notificaciones de manera contextual.","desc_en":"Apple turns the iPhone 14 Pro's front-camera cutout into the Dynamic Island, a shape-shifting interactive area that surfaces live activities and notifications contextually.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Convertir una 'limitación' de hardware (el recorte de cámara) en una oportunidad de interacción con marca propia.","note_en":"Turning a hardware 'limitation' (the camera cutout) into a branded interaction opportunity."},{"id":"UX-0061","year":2022,"title":"Passkeys","title_en":"Passkeys","desc":"Apple, Google y Microsoft adoptan el estándar de passkeys de la FIDO Alliance, reemplazando contraseñas escritas por inicio de sesión biométrico/criptográfico basado en el dispositivo, en las plataformas móviles.","desc_en":"Apple, Google, and Microsoft adopt the FIDO Alliance's passkey standard, replacing typed passwords with device-based biometric/cryptographic sign-in across mobile platforms.","cats":["UX/UI","Mobile"],"importance":2,"region":"Global","region_en":"Global","note":"El objetivo de décadas de UX de seguridad —eliminar la contraseña— empieza finalmente a ser realidad.","note_en":"A decades-long UX security goal — eliminating the password — finally starts to become reality."},{"id":"TEC-0112","year":2022,"title":"Meta Quest 2 consolida el VR de consumo masivo","title_en":"Meta Quest 2 consolidates mass-market VR","desc":"El Meta Quest 2 se convierte en el headset de VR más vendido de la historia, llevando la realidad virtual al consumidor masivo en gaming y fitness.","desc_en":"The Meta Quest 2 becomes the best-selling VR headset in history, bringing virtual reality to mass consumers in gaming and fitness.","cats":["VR/AR"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"RoboticsBiz - Wearable Tech History"},{"id":"TEC-0113","year":2022,"title":"Lanzamiento de ChatGPT","title_en":"ChatGPT launches","desc":"OpenAI lanza ChatGPT al público como vista previa de investigación gratuita; alcanza 100 millones de usuarios en solo 2 meses, el lanzamiento de consumo más rápido de la historia hasta ese momento.","desc_en":"OpenAI releases ChatGPT to the public as a free research preview; it reaches 100 million users in just 2 months, the fastest consumer launch in history up to that point.","cats":["Software","IA"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Search Engine Journal / The Neuron - ChatGPT Timeline"},{"id":"DEV-0013","year":2023,"title":"Dispositivos con IA on-device","title_en":"On-device AI devices","desc":"Smartphones como Google Pixel y Samsung Galaxy S24 comienzan a incluir chips neuronales dedicados para ejecutar funciones de IA generativa localmente, cambiando las expectativas de privacidad y latencia en la UX móvil.","desc_en":"Smartphones such as the Google Pixel and Samsung Galaxy S24 begin shipping dedicated neural chips to run generative-AI features locally, changing privacy and latency expectations in mobile UX.","cats":["Mobile","IA","Hardware"],"importance":2,"region":"Global","region_en":"Global","note":"Procesar IA en el dispositivo, no en la nube, es la nueva frontera de diseño de confianza.","note_en":"Processing AI on the device, not in the cloud, is the new frontier of trust-centered design."},{"id":"UX-0062","year":2023,"title":"Interfaces de IA generativa","title_en":"Generative AI interfaces","desc":"Las apps comienzan a incorporar interfaces de chat/prompt con IA generativa (al estilo ChatGPT) directamente en la UX móvil para creación de contenido, búsqueda y asistencia.","desc_en":"Apps begin embedding generative-AI chat/prompt interfaces (ChatGPT-style) directly into mobile UX for content creation, search, and assistance.","cats":["IA","UX/UI","Mobile"],"importance":2,"region":"Global","region_en":"Global","note":"El campo de texto de búsqueda evoluciona hacia una conversación abierta con un modelo de lenguaje.","note_en":"The search text field evolves into an open-ended conversation with a language model."},{"id":"UX-0063","year":2023,"title":"UX de IA on-device","title_en":"On-device AI UX","desc":"Los fabricantes llevan funciones de IA (transcripción, resúmenes, generación de imágenes) a ejecutarse en el propio dispositivo mediante chips neuronales dedicados, cambiando las expectativas de UX en velocidad, disponibilidad offline y privacidad.","desc_en":"Manufacturers push AI features (transcription, summarization, image generation) to run on the device itself via dedicated neural chips, changing UX expectations around speed, offline availability, and privacy.","cats":["IA","UX/UI","Mobile"],"importance":2,"region":"Global","region_en":"Global","note":"La IA que corre sin conexión cambia el contrato de confianza entre usuario y dispositivo.","note_en":"AI that runs offline changes the trust contract between user and device."},{"id":"TEC-0114","year":2023,"title":"GPT-4 y Claude de Anthropic","title_en":"GPT-4 and Anthropic's Claude","desc":"OpenAI lanza GPT-4 con capacidades multimodales; el mismo día, Anthropic lanza Claude, intensificando la carrera global de la IA generativa.","desc_en":"OpenAI launches GPT-4 with multimodal capabilities; the same day, Anthropic lau function eraOf(year){ let e = ERAS[0]; ERAS.forEach(x => { if(year >= x.from) e = x; }); return e; }

const EVENTS = JSON.parse(document.getElementById('events-data').textContent)
  .map(ev => ({ ...ev, era: eraOf(ev.year) }));
const YEAR_MIN = Math.min(...EVENTS.map(e => e.year));
const YEAR_MAX = Math.max(...EVENTS.map(e => e.year));
const CAT_COUNTS = {};
EVENTS.forEach(ev => ev.cats.forEach(c => { CAT_COUNTS[c] = (CAT_COUNTS[c] || 0) + 1; }));

// ===== I18N =====
const STR = {
  es: {
    titleHTML:'Historia del diseño digital',
    section:'Eventos',
    docTitle:'Historia del diseño digital',
    searchPlaceholder:'Buscar evento...',

    clearFilters:'Limpiar filtros',
    moreCats:'Más categorías',

    regionLabel:'Region / origin', importanceLabel:'Importance', sourceLabel:'Source', refIdLabel:'Reference ID',

};

// ===== STATE =====
let activeFilters = new Set();
let searchQuery = '';
let yearFrom = YEAR_MIN, yearTo = YEAR_MAX;
let selectedRegion = '';
let currentLang = 'es';
let currentTheme = 'light';

function L(ev, field){
  if(field === 'era') return ev.era[currentLang];
  return currentLang === 'es' ? ev[field] : (ev[field + '_en'] || ev[field]);
}
const catLabel = c => CATS[c][currentLang];
const catShort = c => CATS[c][currentLang + '_s'] || CATS[c][currentLang];

function store(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function recall(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

// ===== THEME =====
function setTheme(theme){
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeToggle');
  btn.innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
  const t = theme === 'dark' ? STR[currentLang].themeToLight : STR[currentLang].themeToDark;
  btn.title = t; btn.setAttribute('aria-label', t);
  store('tl-theme', theme);
}
document.getElementById('themeToggle').addEventListener('click', () => setTheme(currentTheme === 'dark' ? 'light' : 'dark'));

// ===== MAIN TOGGLES + DROPDOWN =====
const mainToggles = document.getElementById('mainToggles');
MAIN_CATS.forEach(cat => {
  const b = document.createElement('button');
  b.className = 'toggle-btn';
  b.dataset.cat = cat;
  b.style.setProperty('--btn-color', CATS[cat].color);
  b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<span class="dot"></span><span class="cat-label"></span>`;
  b.addEventListener('click', () => { toggleFilter(cat); syncFilterUI(); });
  mainToggles.appendChild(b);
});
const moreDropdown = document.getElementById('moreDropdown');
MORE_CATS.forEach(cat => {
  const row = document.createElement('button');
  row.className = 'check-row';
  row.dataset.cat = cat;
  row.style.setProperty('--chk-color', CATS[cat].color);
  row.setAttribute('aria-pressed', 'false');
  row.innerHTML = `<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span><span class="cat-label"></span><span class="cnt">${CAT_COUNTS[cat] || 0}</span>`;
  row.addEventListener('click', (e) => { e.stopPropagation(); toggleFilter(cat); syncFilterUI(); });
  moreDropdown.appendChild(row);
});
const moreWrap = document.getElementById('moreWrap');
const moreBtn = document.getElementById('moreBtn');
moreBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = moreWrap.classList.toggle('open');
  moreBtn.setAttribute('aria-expanded', open);
});
document.addEventListener('click', (e) => {
  if(!moreWrap.contains(e.target)){ moreWrap.classList.remove('open'); moreBtn.setAttribute('aria-expanded', 'false'); }
});

function toggleFilter(cat){
  activeFilters.has(cat) ? activeFilters.delete(cat) : activeFilters.add(cat);
  render();
}
function syncFilterUI(){
  document.querySelectorAll('#mainToggles .toggle-btn, .check-row').forEach(el => {
    const on = activeFilters.has(el.dataset.cat);
    el.classList.toggle(el.classList.contains('check-row') ? 'checked' : 'active', on);
    el.setAttribute('aria-pressed', on);
  });
  const n = MORE_CATS.filter(c => activeFilters.has(c)).length;
  const countEl = document.getElementById('moreCount');
  countEl.style.display = n ? 'flex' : 'none';
  countEl.textContent = n;
  moreBtn.classList.toggle('has-active', n > 0);
}

function applyStaticStrings(){

  document.getElementById('clearBtn').textContent = s.clearFilters;
  document.getElementById('moreLabel').textContent = s.moreCats;
  document.getElementById('fromEyebrow').textContent = s.from;
  document.getElementById('toEyebrow').textContent = s.to;

    el.textContent = catLabel(el.closest('[data-cat]').dataset.cat);

}

  buildRegionOptions();
  refreshEraTooltips();
  render();
  store('tl-lang', lang);

const regionSelect = document.getElementById('regionSelect');
function buildRegionOptions(){
  const counts = {};
  EVENTS.forEach(ev => { counts[ev.region] = (counts[ev.region] || 0) + 1; });
  const regions = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
  regionSelect.innerHTML = '';
  const def = document.createElement('option');
  def.value = ''; def.textContent = STR[currentLang].allRegions;
  regionSelect.appendChild(def);
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r;
    const label = currentLang === 'es' ? r : EVENTS.find(e => e.region === r).region_en;
    opt.textContent = `${label} (${counts[r]})`;
    regionSelect.appendChild(opt);
  });
  regionSelect.value = selectedRegion;
}
regionSelect.addEventListener('change', () => { selectedRegion = regionSelect.value; render(); });

// ===== CLEAR / SEARCH =====
document.getElementById('clearBtn').addEventListener('click', () => {
  activeFilters.clear(); searchQuery = ''; selectedRegion = '';
  yearFrom = YEAR_MIN; yearTo = YEAR_MAX;
  regionSelect.value = '';
  document.getElementById('searchInput').value = '';
  rangeFrom.value = YEAR_MIN; rangeTo.value = YEAR_MAX;
  syncFilterUI(); updateRangeUI(); render();
});
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  render();
});

// ===== FILTER =====
function getFiltered(){
  return EVENTS.filter(ev => {
    if(ev.year < yearFrom || ev.year > yearTo) return false;
    if(activeFilters.size && !ev.cats.some(c => activeFilters.has(c))) return false;
    if(selectedRegion && ev.region !== selectedRegion) return false;
    if(searchQuery){
      const hay = norm([ev.title, ev.title_en, ev.desc, ev.desc_en, ev.note, ev.note_en,
        ev.region, ev.region_en, String(ev.year), ev.id, ...ev.cats.map(c => CATS[c].es + ' ' + CATS[c].en)].join(' '));
      const terms = norm(searchQuery).split(/\s+/).filter(Boolean);
      if(!terms.every(t => hay.includes(t))) return false;
    }
    return true;
  });
}

// ===== RENDER HELPERS =====
function escapeHTML(str){ const d = document.createElement('div'); d.textContent = str == null ? '' : str; return d.innerHTML; }
// Normaliza para buscar sin distinguir mayúsculas ni tildes (ñ = n, é = e)
function norm(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function highlightMatch(text){
  if(!searchQuery) return escapeHTML(text);
  const plain = norm(text);
  if(plain.length !== text.length) return escapeHTML(text);
  const terms = norm(searchQuery).split(/\s+/).filter(Boolean);
  const marks = new Array(text.length).fill(false);
  terms.forEach(t => {
    let i = plain.indexOf(t);
    while(i !== -1){ for(let k = i; k < i + t.length; k++) marks[k] = true; i = plain.indexOf(t, i + t.length); }
  });
  let out = '', open = false;
  for(let k = 0; k < text.length; k++){
    if(marks[k] && !open){ out += '<mark>'; open = true; }
    if(!marks[k] && open){ out += '</mark>'; open = false; }
    out += escapeHTML(text[k]);
  }
  return out + (open ? '</mark>' : '');
}
const tagHTML = c => `<span class="tag" style="--c:${CATS[c].color}">${catLabel(c)}</span>`;
function activate(el, ev){
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.addEventListener('click', () => openModal(ev));
  el.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(ev); } });
}
function buildCard(ev){
  const main = ev.cats[0];
  const extra = ev.cats.length - 1;
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--c', CATS[main].color);
  card.setAttribute('aria-label', `${ev.year} · ${L(ev,'title')}`);
  const imp = [1,2,3].map(i => `<i class="${i <= ev.importance ? 'on' : ''}"></i>`).join('');
  card.innerHTML = `
    <div class="card-icon">${CATEGORY_ICONS[main] || ''}</div>
    <div class="card-body">
      <div class="card-top">
        <div class="card-cat">${catShort(main)}${extra > 0 ? ` <span class="more">+${extra}</span>` : ''}</div>
        <div class="card-year">${ev.year}</div>
      </div>
      <div class="title">${highlightMatch(L(ev,'title'))}</div>
      <div class="card-imp" aria-hidden="true">${imp}</div>
    </div>`;
  activate(card, ev);
  return card;
}
function buildNode(ev){
  const node = document.createElement('div');
  node.className = 'node imp-' + ev.importance;
  node.style.setProperty('--node-color', CATS[ev.cats[0]].color);
  node.addEventListener('click', () => openModal(ev));
  return node;
}

// ===== MODAL =====
let lastFocus = null;
function openModal(ev){
  lastFocus = document.activeElement;
  const s = STR[currentLang];
  const main = ev.cats[0];
  const card = document.getElementById('modalCard');
  const note = L(ev,'note');
  card.setAttribute('aria-label', L(ev,'title'));
  card.innerHTML = `
    <button class="modal-close" id="modalCloseBtn" aria-label="${s.close}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal-head">
      <div class="modal-icon" style="--c:${CATS[main].color}">${CATEGORY_ICONS[main] || ''}</div>
      <div><div class="modal-year">${ev.year}</div><div class="modal-date">${escapeHTML(L(ev,'era'))}</div></div>
    </div>
    <h2 class="modal-title">${escapeHTML(L(ev,'title'))}</h2>
    <div class="modal-tags">${ev.cats.map(tagHTML).join('')}</div>
    <p class="modal-desc">${escapeHTML(L(ev,'desc'))}</p>
    ${note ? `<div class="modal-note"><b>${s.designNote}</b>${escapeHTML(note)}</div>` : ''}
    <div class="modal-meta">
      <span><b>${s.regionLabel}:</b> ${escapeHTML(L(ev,'region') || '—')}</span>
      <span><b>${s.importanceLabel}:</b> ${ev.importance}/3</span>
      ${ev.source ? `<span><b>${s.sourceLabel}:</b> ${escapeHTML(ev.source)}</span>` : ''}
      <span><b>${s.refIdLabel}:</b> ${ev.id}</span>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
  const closeBtn = document.getElementById('modalCloseBtn');
  closeBtn.addEventListener('click', closeModal);
  closeBtn.focus();
}
function closeModal(){
  const o = document.getElementById('modalOverlay');
  if(!o.classList.contains('open')) return;
  o.classList.remove('open');
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById('modalOverlay').addEventListener('click', (e) => { if(e.target.id === 'modalOverlay') closeModal(); });
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){ closeModal(); moreWrap.classList.remove('open'); moreBtn.setAttribute('aria-expanded','false'); }
});

// ===== RENDER =====
function render(){
  const filtered = getFiltered();
  const s = STR[currentLang];
  const track = document.getElementById('timelineTrack');
  document.getElementById('resultCount').innerHTML = s.showing(filtered.length, EVENTS.length);
  document.getElementById('headerMeta').textContent = filtered.length
    ? s.headerMeta(filtered.length, filtered[0].year, filtered[filtered.length-1].year)
    : s.headerMeta(0, yearFrom, yearTo);

  track.innerHTML = '<div class="spine"></div>';
  if(!filtered.length){
    const empty = document.createElement('div');
    empty.className = 'empty-state'; empty.style.width = '100%';
    empty.textContent = s.emptyState;
    track.appendChild(empty);
    updateScrollProgress();
    return;
  }
  let lastEra = null, alt = 0;
  const frag = document.createDocumentFragment();
  filtered.forEach(ev => {
    if(ev.era !== lastEra){
      const m = document.createElement('div');
      m.className = 'era-marker';
      m.innerHTML = `<span class="year-big">${ev.year}</span><span class="era-label">${escapeHTML(L(ev,'era'))}</span>`;
      frag.appendChild(m);
      lastEra = ev.era;
    }
    const isTop = alt % 2 === 0;
    const col = document.createElement('div');
    col.className = 'event-col ' + (isTop ? 'top' : 'bottom');
    col.dataset.year = ev.year;
    col.style.setProperty('--conn-h', (ev.importance === 3 ? 26 : 22) + 'px');
    const top = document.createElement('div'); top.className = 'col-half half-top';
    const bot = document.createElement('div'); bot.className = 'col-half half-bottom';
    const half = isTop ? top : bot;
    const conn = document.createElement('div'); conn.className = 'connector';
    half.appendChild(conn);
    half.appendChild(buildNode(ev));
    const slot = document.createElement('div'); slot.className = 'card-slot';
    slot.appendChild(buildCard(ev));
    half.appendChild(slot);
    col.appendChild(top); col.appendChild(bot);
    frag.appendChild(col);
    alt++;
  });
  track.appendChild(frag);
  timelineScrollEl.scrollLeft = 0;
  updateScrollProgress();
}

// ===== YEAR RANGE =====
const rangeFrom = document.getElementById('rangeFrom');
const rangeTo = document.getElementById('rangeTo');
const rangeFill = document.getElementById('rangeFill');
const eraTicksWrap = document.getElementById('eraTicks');
const eraLabelsWrap = document.getElementById('eraLabels');
[rangeFrom, rangeTo].forEach(r => { r.min = YEAR_MIN; r.max = YEAR_MAX; });
rangeFrom.value = YEAR_MIN; rangeTo.value = YEAR_MAX;

const eraEls = [];
function buildEraTicks(){
  ERAS.forEach(e => {
    const startYear = Math.max(e.from, YEAR_MIN);
    const pct = ((startYear - YEAR_MIN) / (YEAR_MAX - YEAR_MIN)) * 100;
    const tick = document.createElement('div');
    tick.className = 'range-era-tick'; tick.style.left = pct + '%';
    tick.addEventListener('click', () => jumpToEra(e));
    eraTicksWrap.appendChild(tick);
    const label = document.createElement('div');
    label.className = 'range-era-label'; label.style.left = pct + '%';
    label.textContent = e.short; label.tabIndex = 0; label.setAttribute('role','button');
    label.addEventListener('click', () => jumpToEra(e));
    label.addEventListener('keydown', (k) => { if(k.key === 'Enter') jumpToEra(e); });
    eraLabelsWrap.appendChild(label);
    eraEls.push({ tick, label, e });
  });
  refreshEraTooltips();
}
function refreshEraTooltips(){
  eraEls.forEach(({tick, label, e}) => { tick.title = e[currentLang]; label.title = e[currentLang]; });
}
function jumpToEra(e){
  yearFrom = Math.max(e.from, YEAR_MIN);
  if(yearTo <= yearFrom) yearTo = YEAR_MAX;
  rangeFrom.value = yearFrom; rangeTo.value = yearTo;
  updateRangeUI(); render();
}
function updateRangeUI(){
  const pf = ((yearFrom - YEAR_MIN) / (YEAR_MAX - YEAR_MIN)) * 100;
  const pt = ((yearTo - YEAR_MIN) / (YEAR_MAX - YEAR_MIN)) * 100;
  rangeFill.style.left = pf + '%';
  rangeFill.style.width = (pt - pf) + '%';
  document.getElementById('yearFromLabel').textContent = yearFrom;
  document.getElementById('yearToLabel').textContent = yearTo;
}
rangeFrom.addEventListener('input', () => {
  yearFrom = Math.min(Number(rangeFrom.value), yearTo - 1);
  rangeFrom.value = yearFrom; updateRangeUI(); render();
});
rangeTo.addEventListener('input', () => {
  yearTo = Math.max(Number(rangeTo.value), yearFrom + 1);
  rangeTo.value = yearTo; updateRangeUI(); render();
});

// ===== SCROLL =====
const timelineScrollEl = document.getElementById('timelineScroll');
const scrollProgressBar = document.getElementById('scrollProgressBar');
const scrollPositionLabel = document.getElementById('scrollPositionLabel');
function updateScrollProgress(){
  const el = timelineScrollEl;
  const max = el.scrollWidth - el.clientWidth;
  scrollProgressBar.style.width = (max > 0 ? Math.min(100, (el.scrollLeft / max) * 100) : 0) + '%';
  const center = el.scrollLeft + el.clientWidth / 2;
  let closest = null, best = Infinity;
  el.querySelectorAll('.event-col').forEach(col => {
    const d = Math.abs(col.offsetLeft + col.offsetWidth / 2 - center);
    if(d < best){ best = d; closest = col; }
  });
  scrollPositionLabel.textContent = closest ? closest.dataset.year : '';
}
timelineScrollEl.addEventListener('scroll', updateScrollProgress, { passive:true });
// Rueda vertical del mouse → desplazamiento horizontal
timelineScrollEl.addEventListener('wheel', (e) => {
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX) && !e.shiftKey){
    timelineScrollEl.scrollLeft += e.deltaY;
    e.preventDefault();
  }
}, { passive:false });
// Teclado: flechas para recorrer la línea de tiempo
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'select' || document.body.dataset.view === 'game' || document.getElementById('modalOverlay').classList.contains('open')) return;
  if(e.key === 'ArrowRight') timelineScrollEl.scrollBy({ left: 440, behavior:'smooth' });
  if(e.key === 'ArrowLeft') timelineScrollEl.scrollBy({ left: -440, behavior:'smooth' });
});

// ===== HEIGHT SYNC =====
const yearRangeEl = document.querySelector('.year-range');
function syncHeights(){
  const yh = yearRangeEl.getBoundingClientRect().height;
  if(yh > 0) document.documentElement.style.setProperty('--year-range-h', yh + 'px');
  const th = timelineScrollEl.clientHeight;
  if(th > 0) document.getElementById('timelineTrack').style.setProperty('--track-h', Math.max(th, 340) + 'px');
}
if(typeof ResizeObserver !== 'undefined'){
  const ro = new ResizeObserver(syncHeights);
  ro.observe(timelineScrollEl); ro.observe(yearRangeEl);
}
window.addEventListener('resize', () => { syncHeights(); updateScrollProgress(); });

// ===== INIT =====
const savedTheme = recall('tl-theme');
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
setTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
currentLang = recall('tl-lang') === 'en' ? 'en' : 'es';
document.getElementById('langEs').classList.toggle('active', currentLang === 'es');
document.getElementById('langEn').classList.toggle('active', currentLang === 'en');
applyStaticStrings();
buildRegionOptions();
buildEraTicks();
syncFilterUI();
updateRangeUI();
syncHeights();
render();
</script>

function gMask(text){ return escapeHTML(text).replace(/\b(1[89]|20)\d{2}s?\b/g, '····').replace(/'\d{2}\b/g, "'··"); }
function gReadJSON(k, fb){ try{ const v = recall(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
function gWriteJSON(k, v){ store(k, JSON.stringify(v)); }
function gNameKey(n){ return norm(n).trim(); }
function gAvatarColor(name){ let h = 0; for(const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return G_AVATAR_COLORS[h % G_AVATAR_COLORS.length]; }
function gInitial(name){ return escapeHTML((name.trim()[0] || '?').toUpperCase()); }
function gAvatar(name){ return `<span class="avatar" style="--c:${gAvatarColor(name)}">${gInitial(name)}</span>`; }
function gDiffLabel(d){ return gt({facil:'dFacil', normal:'dNormal', dificil:'dDificil'}[d]); }
function gListJoin(names){ return names.length <= 1 ? names.join('') : names.slice(0, -1).join(', ') + gt('and') + names[names.length - 1]; }

let gEditingId = null;
function gValidateName(raw, list, exceptId){
  const name = raw.replace(/\s+/g, ' ').trim();
  if(!name) return { err: gt('errEmpty') };
  if(list.some(p => p.id !== exceptId && gNameKey(p.name) === gNameKey(name))) return { err: gt('errDup', name) };
  return { name };
}
function gAddPlayer(){
  const input = document.getElementById('playerInput');
  const err = document.getElementById('playerError');
  if(GS.players.length >= G_MAX_PLAYERS){ err.textContent = gt('errMax'); return; }
  const v = gValidateName(input.value, GS.players);
  if(v.err){ err.textContent = v.err; return; }
  GS.players.push({ id: ++gIdSeq, name: v.name });
  input.value = ''; err.textContent = '';
  gSavePlayers(); gRenderSetup(); input.focus();
}
document.getElementById('playerAddBtn').addEventListener('click', gAddPlayer);
document.getElementById('playerInput').addEventListener('keydown', e => { if(e.key === 'Enter') gAddPlayer(); });
document.getElementById('shuffleBtn').addEventListener('click', () => { GS.players = gShuffle(GS.players); gSavePlayers(); gRenderSetup(); });
document.getElementById('clearPlayersBtn').addEventListener('click', () => { GS.players = []; gSavePlayers(); gRenderSetup(); });

function gRenderPlayers(){
  document.getElementById('playersCount').textContent = gt('playersCount', GS.players.length);
  document.getElementById('shuffleBtn').disabled = GS.players.length < 2;
  document.getElementById('clearPlayersBtn').disabled = GS.players.length === 0;
  document.getElementById('playerAddBtn').disabled = GS.players.length >= G_MAX_PLAYERS;
  const ul = document.getElementById('playerList');
  if(!GS.players.length){ ul.innerHTML = `<li class="empty-players">${gt('noPlayers')}</li>`; return; }
  ul.innerHTML = '';
  GS.players.forEach((p, i) => {
    const li = document.createElement('li');
    li.className = 'player-item';
    if(gEditingId === p.id){
      li.innerHTML = `<span class="pos">${i + 1}</span><input class="g-input" maxlength="24" value="${escapeHTML(p.name)}" aria-label="${gt('edit')}">
        <button class="mini" data-act="save" aria-label="OK">${gIcon.plus}</button>`;
      const inp = li.querySelector('input');
      const save = () => {
        const v = gValidateName(inp.value, GS.players, p.id);
        if(v.err){ document.getElementById('playerError').textContent = v.err; inp.focus(); return; }
        p.name = v.name; gEditingId = null; document.getElementById('playerError').textContent = '';
        gSavePlayers(); gRenderSetup();
      };
      li.querySelector('[data-act="save"]').innerHTML = '✓';
      li.querySelector('[data-act="save"]').addEventListener('click', save);
      inp.addEventListener('keydown', e => { if(e.key === 'Enter') save(); if(e.key === 'Escape'){ gEditingId = null; gRenderPlayers(); } });
      setTimeout(() => { inp.focus(); inp.select(); }, 0);
    } else {
      li.innerHTML = `<span class="pos">${i + 1}</span>${gAvatar(p.name)}<span class="nm">${escapeHTML(p.name)}</span>
        <button class="mini" data-act="up" aria-label="${gt('moveUp')}" title="${gt('moveUp')}" ${i === 0 ? 'disabled' : ''}>${gIcon.up}</button>
        <button class="mini" data-act="down" aria-label="${gt('moveDown')}" title="${gt('moveDown')}" ${i === GS.players.length - 1 ? 'disabled' : ''}>${gIcon.down}</button>
        <button class="mini" data-act="edit" aria-label="${gt('edit')}" title="${gt('edit')}">${gIcon.edit}</button>
        <button class="mini" data-act="del" aria-label="${gt('remove')}" title="${gt('remove')}">${gIcon.x}</button>`;
      li.querySelector('[data-act="up"]').addEventListener('click', () => { [GS.players[i-1], GS.players[i]] = [GS.players[i], GS.players[i-1]]; gSavePlayers(); gRenderSetup(); });
      li.querySelector('[data-act="down"]').addEventListener('click', () => { [GS.players[i+1], GS.players[i]] = [GS.players[i], GS.players[i+1]]; gSavePlayers(); gRenderSetup(); });
      li.querySelector('[data-act="edit"]').addEventListener('click', () => { gEditingId = p.id; gRenderPlayers(); });
      li.querySelector('[data-act="del"]').addEventListener('click', () => { GS.players.splice(i, 1); gSavePlayers(); gRenderSetup(); });
    }
    ul.appendChild(li);
  });
}

document.getElementById('gStartBtn').addEventListener('click', () => gStart());

function gStart(keepPlayers){
  const isGroup = GS.mode === 'group';
  const players = isGroup
    ? (keepPlayers || GS.players).map(p => ({ id:p.id, name:p.name, score:0, hits:0, turns:0, streak:0 }))
    : [];
  const pool = gShuffle(gPool(GS.diff));
  const g = {
    status:'playing', mode:GS.mode, type:GS.type, diff:GS.diff, rounds:GS.rounds,
    players, turnIdx:0, round:1, pool, line:[], current:null, pair:null,
    answered:false, hintUsed:false, hintCount:0, lives:3, score:0, trRound:0, history:[], editing:false
  };
  if(g.type === 'timeline') g.line.push({ ev: pool.shift(), state:'anchor' });
  GS.game = g;
  document.querySelector('.app').classList.toggle('group-play', isGroup);
  document.getElementById('scoreboard').hidden = !isGroup;
  document.getElementById('playBody').classList.toggle('with-board', isGroup);
  document.getElementById('scoreboard').classList.remove('editing');
  document.getElementById('quitConfirm').classList.remove('show');
  document.getElementById('quitBtn').hidden = false;
  gShowScreen('gPlay');
  gSyncViewSwitch();
  gNextItem(true);
}

function gCurrentPlayer(){ const g = GS.game; return g && g.mode === 'group' ? g.players[g.turnIdx] : null; }

// Avanza al siguiente evento (o par) y, en grupo, al siguiente jugador
function gNextItem(first){
  const g = GS.game;
  gCancelDrag();
  gHideFeedback();
  if(!first && g.mode === 'group'){
    g.turnIdx++;
    if(g.turnIdx >= g.players.length){ g.turnIdx = 0; g.round++; }
  }
  if(gShouldEnd()) return gEnd();
  g.answered = false; g.hintUsed = false;
  if(g.type === 'timeline'){ g.current = g.pool.shift(); }
  else {
    const a = g.pool.shift(), b = g.pool.shift();
    g.pair = Math.random() < .5 ? [a, b] : [b, a];
    if(g.mode === 'solo') g.trRound++;
  }
  gRenderPlay(true);
}
function gShouldEnd(){
  const g = GS.game;
  if(!g) return true;
  if(g.mode === 'group'){
    if(!g.players.length) return true;
    if(g.round > g.rounds) return true;
  } else {
    if(g.lives <= 0) return true;
    if(g.type === 'timeline' && g.score >= G_SOLO_TARGET) return true;
    if(g.type === 'trivia' && g.trRound >= G_TRIVIA_ROUNDS) return true;
  }
  return g.type === 'timeline' ? g.pool.length < 1 : g.pool.length < 2;
}

function gRenderPlay(turnChanged){
  const g = GS.game;
  // cabecera de turno
  const tb = document.getElementById('turnBox');
  const p = gCurrentPlayer();
  if(p){
    tb.innerHTML = `${gAvatar(p.name)}<div style="min-width:0"><div class="k">${gt('turnOf')}</div><div class="v">${escapeHTML(p.name)}</div></div>`;
  } else {
    tb.innerHTML = `<div><div class="k">${gDiffLabel(g.diff)}</div><div class="v">${gt(g.type === 'timeline' ? 'placeIt' : 'whichOlder')}</div></div>`;
  }
  if(turnChanged){ tb.classList.remove('bump'); void tb.offsetWidth; tb.classList.add('bump'); }
  gRenderHud();
  // pista (solo en difícil)
  const hb = document.getElementById('hintBtn');
  hb.hidden = g.diff !== 'dificil';
  hb.textContent = '💡 ' + gt('hint');
  hb.disabled = g.hintUsed || g.answered;
  // contenido
  if(g.type === 'timeline') gRenderTimelinePlay(); else gRenderTriviaPlay();
  if(g.mode === 'group') gRenderBoard();
}
function gRenderHud(){
  const g = GS.game, hud = document.getElementById('gHud');
  const chip = (k, v) => `<div class="chip"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  if(g.mode === 'group'){
    hud.innerHTML = chip(gt('round'), `${Math.min(g.round, g.rounds)}/${g.rounds}`) + chip(gt('difficulty'), gDiffLabel(g.diff));
  } else {
    const lives = `<span class="lives">${[0,1,2].map(i => `<span class="${i < g.lives ? '' : 'lost'}">♥</span>`).join('')}</span>`;
    hud.innerHTML = chip(gt('lives'), lives) + (g.type === 'timeline'
      ? chip(gt('progress'), `${g.score}/${G_SOLO_TARGET}`)
      : chip(gt('round'), `${g.trRound}/${G_TRIVIA_ROUNDS}`) + chip(gt('correct'), g.score));
  }
}

function gCardHTML(ev, opts = {}){
  const main = ev.cats[0];
  const yr = opts.showYear ? `<span class="g-year shown">${ev.year}</span>` : `<span class="g-year">····</span>`;
  const title = opts.showYear ? escapeHTML(L(ev,'title')) : gMask(L(ev,'title'));
  const desc = opts.showYear ? escapeHTML(L(ev,'desc')) : gMask(L(ev,'desc'));
  const hint = opts.hint ? `<div class="g-hint">${gt('hintDecade', Math.floor(ev.year / 10) * 10)}</div>` : '';
  return `<div class="card-icon">${CATEGORY_ICONS[main] || ''}</div>
    <div class="g-body"><div class="g-cat">${ev.cats.map(catLabel).join(' · ')}</div>
    <div class="g-title">${title}</div><p class="g-desc">${desc}</p>${hint}</div>${yr}`;
}

// ---------- Ubica el evento ----------
function gRenderTimelinePlay(){
  const g = GS.game, main = document.getElementById('playMain');
  const ev = g.current;
  main.innerHTML = `
    <div class="draw-wrap">
      <div class="g-card ${g.answered ? 'locked' : ''}" id="drawCard" style="--c:${CATS[ev.cats[0]].color}">${gCardHTML(ev, { showYear:g.answered, hint:g.hintUsed })}</div>
      <p class="draw-tip">${g.answered ? '' : gt('dragTip')}</p>
    </div>
    <div class="g-line-scroll" id="gLineScroll"><div class="g-line" id="gLine"></div></div>
    <div class="next-row" id="nextRow"></div>`;
  gRenderLine();
  if(!g.answered) document.getElementById('drawCard').addEventListener('pointerdown', gStartDrag);
  gRenderNext();
}
function gSortedLine(){ return GS.game.line.slice().sort((a, b) => a.ev.year - b.ev.year); }
function gRenderLine(){
  const g = GS.game, line = document.getElementById('gLine');
  const sorted = gSortedLine();
  line.innerHTML = '';
  const addSlot = (idx) => {
    const s = document.createElement('div');
    s.className = 'tl-slot' + (g.answered ? ' disabled' : '');
    s.dataset.idx = idx;
    s.tabIndex = g.answered ? -1 : 0;
    s.setAttribute('role', 'button');
    s.setAttribute('aria-label', `+ ${idx === 0 ? '←' : sorted[idx - 1].ev.year}`);
    s.innerHTML = '<span class="plus">+</span>';
    s.addEventListener('click', () => gGuessTimeline(idx));
    s.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); gGuessTimeline(idx); } });
    line.appendChild(s);
  };
  addSlot(0);
  let focusEl = null;
  sorted.forEach((item, i) => {
    const c = document.createElement('div');
    c.className = 'tl-placed' + (item.state === 'new-ok' ? ' new-ok' : item.state === 'new-bad' ? ' new-bad' : item.state === 'missed' ? ' missed' : '');
    c.style.setProperty('--c', CATS[item.ev.cats[0]].color);
    c.innerHTML = `<span class="dot"></span><div class="yr">${item.ev.year}</div><div class="ti">${escapeHTML(L(item.ev,'title'))}</div>`;
    if(item.state === 'new-ok' || item.state === 'new-bad') focusEl = c;
    line.appendChild(c);
    addSlot(i + 1);
  });
  if(focusEl){ const sc = document.getElementById('gLineScroll'); sc.scrollLeft = focusEl.offsetLeft - sc.clientWidth / 2 + focusEl.offsetWidth / 2; }
}
function gGuessTimeline(idx){
  const g = GS.game;
  if(!g || g.answered || g.type !== 'timeline') return;
  const sorted = gSortedLine();
  const before = sorted[idx - 1], after = sorted[idx];
  const ev = g.current;
  const ok = (!before || ev.year >= before.ev.year) && (!after || ev.year <= after.ev.year);
  g.answered = true;
  g.line.forEach(it => { if(it.state === 'new-ok' || it.state === 'new-bad') it.state = it.state === 'new-bad' ? 'missed' : 'placed'; });
  if(ok){ g.line.push({ ev, state:'new-ok' }); }
  else if(g.mode === 'group'){ g.line.push({ ev, state:'new-bad' }); }  // como en el juego de mesa: queda en su lugar
  gResolve(ok, [ev], ev.importance === 3);
}

// ---------- ¿Cuál es más antiguo? ----------
function gRenderTriviaPlay(){
  const g = GS.game, main = document.getElementById('playMain');
  const [a, b] = g.pair;
  const older = a.year <= b.year ? a : b;
  const cls = (ev) => !g.answered ? '' : (ev === older ? 'done right' : (ev === g.picked ? 'done wrong' : 'done'));
  main.innerHTML = `
    <p class="draw-tip" style="text-align:center">${g.answered ? '' : gt('pickTip')}</p>
    <div class="pair">
      <button class="g-card ${cls(a)}" id="pairA" style="--c:${CATS[a.cats[0]].color}">${gCardHTML(a, { showYear:g.answered, hint:g.hintUsed })}</button>
      <div class="vs">vs</div>
      <button class="g-card ${cls(b)}" id="pairB" style="--c:${CATS[b.cats[0]].color}">${gCardHTML(b, { showYear:g.answered, hint:g.hintUsed })}</button>
    </div>
    <div class="next-row" id="nextRow"></div>`;
  document.getElementById('pairA').addEventListener('click', () => gGuessTrivia(a));
  document.getElementById('pairB').addEventListener('click', () => gGuessTrivia(b));
  gRenderNext();
}
function gGuessTrivia(picked){
  const g = GS.game;
  if(!g || g.answered) return;
  const [a, b] = g.pair;
  const other = picked === a ? b : a;
  const ok = picked.year <= other.year;
  g.answered = true; g.picked = picked;
  gResolve(ok, [a, b], a.importance === 3 || b.importance === 3);
}

// ---------- resultado de un turno ----------
function gResolve(ok, evs, isMilestone){
  const g = GS.game;
  evs.forEach(ev => g.history.push({ ev, ok }));
  const refEv = g.type === 'timeline' ? evs[0] : (evs[0].year <= evs[1].year ? evs[0] : evs[1]);
  let msg = `<span>${gt(ok ? 'ok' : 'bad')}</span><small>${g.type === 'timeline' ? gt('wasYear', refEv.year) : `${evs[0].year} · ${evs[1].year}`}</small>`;
  if(g.mode === 'group'){
    const p = gCurrentPlayer();
    p.turns++;
    if(ok){
      let pts = 1; const bonus = [];
      p.hits++; p.streak++;
      if(!g.hintUsed){
        if(p.streak % 3 === 0){ pts++; bonus.push(gt('bonusStreak')); }
        if(g.diff === 'dificil' && isMilestone){ pts++; bonus.push(gt('bonusMilestone')); }
      }
      p.score += pts;
      msg = `<span>${gt('ok')} +${pts}${bonus.length ? ' · ' + bonus.join(' · ') : ''}</span><small>${g.type === 'timeline' ? gt('wasYear', refEv.year) : `${evs[0].year} · ${evs[1].year}`}${g.hintUsed ? ' · ' + gt('bonusNoHint') : ''}</small>`;
    } else {
      p.streak = 0;
      if(g.type === 'timeline') msg = `<span>${gt('bad')}</span><small>${gt('wasYear', refEv.year)} · ${gt('placedAnyway')}</small>`;
    }
  } else {
    if(ok) g.score++;
    else { g.lives--; msg = `<span>${gt('bad')} · ${gt('lifeLost')}</span><small>${g.type === 'timeline' ? gt('wasYear', refEv.year) : `${evs[0].year} · ${evs[1].year}`}</small>`; }
  }
  gShowFeedback(msg, ok);
  gRenderPlay(false);
  // individual + ubicar: avanza solo, como en el borrador original
  if(g.mode === 'solo' && g.type === 'timeline') setTimeout(() => { if(GS.game === g && g.status === 'playing') gNextItem(false); }, 1500);
}
function gRenderNext(){
  const g = GS.game, row = document.getElementById('nextRow');
  if(!row) return;
  row.innerHTML = '';
  if(!g.answered || (g.mode === 'solo' && g.type === 'timeline')) return;
  const btn = document.createElement('button');
  btn.className = 'btn-ink';
  let label = gt('next');
  if(g.mode === 'group'){
    let ni = g.turnIdx + 1, nr = g.round;
    if(ni >= g.players.length){ ni = 0; nr++; }
    label = nr > g.rounds ? gt('seeResults') : gt('nextTurn', g.players[ni].name);
  } else if(g.lives <= 0 || g.trRound >= G_TRIVIA_ROUNDS){ label = gt('seeResults'); }
  btn.textContent = label;
  btn.addEventListener('click', () => gNextItem(false));
  row.appendChild(btn);
  setTimeout(() => btn.focus({ preventScroll:true }), 0);
}

// ---------- pista ----------
document.getElementById('hintBtn').addEventListener('click', () => {
  const g = GS.game;
  if(!g || g.answered || g.hintUsed) return;
  g.hintUsed = true; g.hintCount++;
  // individual: cada 2 pistas cuestan una vida (regla del borrador)
  if(g.mode === 'solo' && g.hintCount % 2 === 0){
    g.lives = Math.max(0, g.lives - 1);
    gShowFeedback(`<span>${gt('lifeLost')}</span>`, false);
    if(g.lives <= 0){ g.answered = true; gRenderPlay(false); setTimeout(() => gEnd(), 900); return; }
  }
  gRenderPlay(false);
});

// ---------- feedback ----------
let gFbTimer = null;
function gShowFeedback(html, ok){
  const f = document.getElementById('gFeedback');
  f.innerHTML = html; f.className = 'feedback show ' + (ok ? 'good' : 'bad');
  clearTimeout(gFbTimer); gFbTimer = setTimeout(gHideFeedback, 2600);
}
function gHideFeedback(){ document.getElementById('gFeedback').className = 'feedback'; }

// ---------- abandonar ----------
document.getElementById('quitBtn').addEventListener('click', () => { document.getElementById('quitConfirm').classList.add('show'); document.getElementById('quitBtn').hidden = true; });
document.getElementById('quitNo').addEventListener('click', () => { document.getElementById('quitConfirm').classList.remove('show'); document.getElementById('quitBtn').hidden = false; });
document.getElementById('quitYes').addEventListener('click', () => {
  GS.game = null; gCancelDrag(); gHideFeedback();
  document.querySelector('.app').classList.remove('group-play');
  gShowScreen('gSetup'); gRenderSetup(); gSyncViewSwitch();
});

// ---------- marcador (modo grupo) ----------
function gRanked(players){
  const sorted = players.slice().sort((a, b) => b.score - a.score || b.hits - a.hits || a.name.localeCompare(b.name));
  let rank = 0, last = null;
  return sorted.map((p, i) => { if(p.score !== last){ rank = i + 1; last = p.score; } return { p, rank }; });
}
function gRenderBoard(){
  const g = GS.game, board = document.getElementById('scoreboard');
  board.classList.toggle('editing', g.editing);
  document.getElementById('sbEditBtn').textContent = gt(g.editing ? 'doneBoard' : 'editBoard');
  const cur = gCurrentPlayer();
  const ul = document.getElementById('sbList');
  ul.innerHTML = '';
  gRanked(g.players).forEach(({ p, rank }) => {
    const li = document.createElement('li');
    li.className = 'sb-row' + (cur && cur.id === p.id ? ' current' : '');
    li.innerHTML = `<span class="rk">${rank}</span>${gAvatar(p.name)}<span class="nm">${escapeHTML(p.name)}${p.streak >= 2 ? ` <span class="streak">🔥${p.streak}</span>` : ''}</span>
      <span class="sb-edit">
        <button class="mini" data-act="minus" aria-label="${gt('minus')}" title="${gt('minus')}">${gIcon.minus}</button>
        <button class="mini" data-act="plus" aria-label="${gt('plus')}" title="${gt('plus')}">${gIcon.plus}</button>
        <button class="mini" data-act="del" aria-label="${gt('remove')}" title="${gt('remove')}">${gIcon.x}</button>
      </span>
      <span class="pts">${p.score}</span>`;
    li.querySelector('[data-act="minus"]').addEventListener('click', () => { p.score = Math.max(0, p.score - 1); gRenderBoard(); });
    li.querySelector('[data-act="plus"]').addEventListener('click', () => { p.score++; gRenderBoard(); });
    li.querySelector('[data-act="del"]').addEventListener('click', () => gRemoveFromGame(p.id));
    ul.appendChild(li);
  });
  document.getElementById('sbAddBtn').disabled = g.players.length >= G_MAX_PLAYERS;
}
document.getElementById('sbEditBtn').addEventListener('click', () => { const g = GS.game; if(!g) return; g.editing = !g.editing; document.getElementById('sbError').textContent = ''; gRenderBoard(); });
function gLateAdd(){
  const g = GS.game, inp = document.getElementById('sbAddInput'), err = document.getElementById('sbError');
  if(!g) return;
  if(g.players.length >= G_MAX_PLAYERS){ err.textContent = gt('errMax'); return; }
  const v = gValidateName(inp.value, g.players);
  if(v.err){ err.textContent = v.err; return; }
  g.players.push({ id: ++gIdSeq, name: v.name, score:0, hits:0, turns:0, streak:0 });
  inp.value = ''; err.textContent = '';
  gRenderBoard(); gRenderNext();
}
document.getElementById('sbAddBtn').addEventListener('click', gLateAdd);
document.getElementById('sbAddInput').addEventListener('keydown', e => { if(e.key === 'Enter') gLateAdd(); });
function gRemoveFromGame(id){
  const g = GS.game, i = g.players.findIndex(p => p.id === id);
  if(i < 0) return;
  const wasCurrent = i === g.turnIdx;
  g.players.splice(i, 1);
  if(!g.players.length) return gEnd();
  if(i < g.turnIdx) g.turnIdx--;
  if(wasCurrent && !g.answered){
    // el siguiente jugador toma el turno con el mismo evento
    if(g.turnIdx >= g.players.length){ g.turnIdx = 0; g.round++; if(g.round > g.rounds) return gEnd(); }
    gRenderPlay(true);
  } else {
    if(wasCurrent) g.turnIdx = i - 1;   // el turno ya se jugó: el siguiente es quien ocupa ahora su lugar
    gRenderBoard(); gRenderNext();
  }
}

// ---------- arrastrar y soltar ----------
let gDrag = null;
function gStartDrag(e){
  const g = GS.game;
  if(!g || g.answered || gDrag || (e.button !== undefined && e.button !== 0)) return;
  const card = e.currentTarget;
  const startX = e.clientX, startY = e.clientY;
  let ghost = null;
  const onMove = (ev) => {
    if(!ghost){
      if(Math.hypot(ev.clientX - startX, ev.clientY - startY) < 6) return;
      ghost = card.cloneNode(true); ghost.removeAttribute('id'); ghost.classList.add('drag-ghost');
      ghost.style.width = Math.min(card.offsetWidth, 420) + 'px';
      document.body.appendChild(ghost); card.classList.add('dragging');
    }
    ghost.style.left = (ev.clientX - ghost.offsetWidth / 2) + 'px';
    ghost.style.top = (ev.clientY - 40) + 'px';
    document.querySelectorAll('.tl-slot').forEach(s => s.classList.remove('drag-hover'));
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const slot = el && el.closest('.tl-slot');
    if(slot) slot.classList.add('drag-hover');
    // desplaza la línea al acercarse a los bordes
    const sc = document.getElementById('gLineScroll');
    if(sc){ const r = sc.getBoundingClientRect(); if(ev.clientY > r.top - 40 && ev.clientY < r.bottom + 40){ if(ev.clientX < r.left + 60) sc.scrollLeft -= 14; if(ev.clientX > r.right - 60) sc.scrollLeft += 14; } }
  };
  const onUp = (ev) => {
    const dropped = ghost ? (() => { const el = document.elementFromPoint(ev.clientX, ev.clientY); return el && el.closest('.tl-slot'); })() : null;
    gCancelDrag();
    if(dropped) gGuessTimeline(Number(dropped.dataset.idx));
  };
  const onCancel = () => gCancelDrag();
  gDrag = {
    cleanup: () => {
      window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onCancel);
      if(ghost) ghost.remove();
      card.classList.remove('dragging');
      document.querySelectorAll('.tl-slot').forEach(s => s.classList.remove('drag-hover'));
    }
  };
  window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onCancel);
}
function gCancelDrag(){ if(gDrag){ gDrag.cleanup(); gDrag = null; } document.querySelectorAll('.drag-ghost').forEach(x => x.remove()); }

// =================== RESULTADOS ===================
function gBest(key){ const v = Number(recall(key)); return Number.isFinite(v) && recall(key) !== null ? v : null; }
function gEnd(rerender){
  const g = GS.game;
  if(!g) return;
  g.status = 'ended';
  gCancelDrag(); gHideFeedback();
  gSyncViewSwitch();
  const wrap = document.getElementById('endWrap');
  let celebrate = false, html = '';
  if(g.mode === 'solo'){
    const key = `tl-best-${g.type}-${g.diff}`;
    const prev = gBest(key);
    if(prev === null || g.score > prev) store(key, String(g.score));
    const best = gBest(key);
    const total = g.type === 'timeline' ? G_SOLO_TARGET : G_TRIVIA_ROUNDS;
    const won = g.lives > 0 && (g.type === 'timeline' ? g.score >= G_SOLO_TARGET : g.trRound >= G_TRIVIA_ROUNDS);
    celebrate = won;
    const eyebrow = g.lives <= 0 ? gt('endHeartsOut') : (g.type === 'timeline' ? (won ? gt('endGoal') : gt('endAllPlaced')) : gt('endTriviaDone'));
    const prize = won ? `<a class="btn-soft" href="${G_PRIZE_URLS[Math.floor(Math.random() * G_PRIZE_URLS.length)]}" target="_blank" rel="noopener">🎁 ${gt('prize')}</a>` : '';
    html = `<div class="end-eyebrow">${eyebrow}</div>
      <div class="end-score">${g.score}/${total}</div>
      <div class="end-label">${gt(g.type === 'timeline' ? 'endTlLabel' : 'endTrLabel')}</div>
      <div class="end-best">${gt('best', gDiffLabel(g.diff), best)}</div>${prize}`;
  } else {
    const ranked = gRanked(g.players);
    const top = ranked.length ? ranked[0].p.score : 0;
    const winners = ranked.filter(r => r.p.score === top).map(r => r.p.name);
    celebrate = ranked.length > 0;
    const pods = ranked.slice(0, 3);
    const order = pods.length === 3 ? [pods[1], pods[0], pods[2]] : pods.length === 2 ? [pods[1], pods[0]] : pods;
    const podHTML = order.map(({ p, rank }) => {
      return `<div class="pod p${Math.min(rank, 3)}">${rank === 1 ? '<div class="crown">👑</div>' : ''}${gAvatar(p.name)}<div class="nm">${escapeHTML(p.name)}</div>
        <div class="block"><span class="pl">${rank}</span><span class="pt">${gt('pts', p.score)}</span></div></div>`;
    }).join('');
    const rows = ranked.map(({ p, rank }) => `<tr><td>${rank}</td><td>${escapeHTML(p.name)}</td><td>${p.hits}/${p.turns}</td><td>${p.score}</td></tr>`).join('');
    html = `<div class="end-eyebrow">${winners.length > 1 ? gt('winnerTie', gListJoin(winners.map(escapeHTML))) : gt('winnerOne', escapeHTML(winners[0] || ''))}</div>
      <div class="podium">${podHTML}</div>
      <table class="results-table"><thead><tr><th>#</th><th>${gt('colPlayer')}</th><th>${gt('colHits')}</th><th>${gt('colPts')}</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  // repaso de eventos (sin repetir)
  const seen = new Set(), items = [];
  g.history.forEach(h => { if(!seen.has(h.ev.id)){ seen.add(h.ev.id); items.push(h); } });
  const review = items.length ? `<div class="review"><h3>${gt('review')}</h3><div class="review-list">${items.map((h, i) =>
    `<button class="review-item" data-i="${i}"><span class="d ${h.ok ? 'ok' : 'bad'}"></span><b>${h.ev.year}</b> ${escapeHTML(L(h.ev,'title'))}</button>`).join('')}</div></div>` : '';
  wrap.innerHTML = html + `<div class="end-actions">
      <button class="btn-ink" id="gRematch">${gt('rematch')}</button>
      <button class="btn-soft" id="gNewGame">${gt('newGame')}</button>
      <button class="btn-ghost" id="gToExplore">${gt('goExplore')}</button></div>` + review;
  wrap.querySelectorAll('.review-item').forEach(b => b.addEventListener('click', () => openModal(items[Number(b.dataset.i)].ev)));
  document.getElementById('gRematch').addEventListener('click', () => {
    GS.mode = g.mode; GS.type = g.type; GS.diff = g.diff; GS.rounds = g.rounds;
    gStart(g.mode === 'group' ? g.players.map(p => ({ id:p.id, name:p.name })) : null);
  });
  document.getElementById('gNewGame').addEventListener('click', () => { GS.game = null; document.querySelector('.app').classList.remove('group-play'); gShowScreen('gSetup'); gRenderSetup(); gSyncViewSwitch(); });
  document.getElementById('gToExplore').addEventListener('click', () => { GS.game = null; document.querySelector('.app').classList.remove('group-play'); gShowScreen('gSetup'); gSetView('explore'); });
  gShowScreen('gEnd');
  if(celebrate && !rerender) setTimeout(() => { if(GS.game === g && g.status === 'ended') gConfetti(); }, 250);
}

// =================== CONFETI ===================
let gConfettiRun = 0;
function gStopConfetti(){ gConfettiRun++; const c = document.getElementById('confettiCanvas'); if(c) c.remove(); }
function gConfetti(){
  const run = ++gConfettiRun;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const old = document.getElementById('confettiCanvas'); if(old) old.remove();
  const cv = document.createElement('canvas'); cv.id = 'confettiCanvas'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const colors = ['--c-ux','--c-pat','--c-mobile','--c-web','--c-social','--c-gaming','--c-ia','--c-wearables'].map(v => cs.getPropertyValue(v).trim()).concat(['#111111','#FFD23F']);
  const parts = [];
  const burst = (x, y, n, dirX) => {
    for(let i = 0; i < n; i++){
      const ang = (-Math.PI / 2) + (Math.random() - .5) * 1.3 + dirX * .45;
      const sp = 9 + Math.random() * 9;
      parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, w: 6 + Math.random() * 7, h: 8 + Math.random() * 10,
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .35, c: colors[Math.floor(Math.random() * colors.length)],
        shape: Math.random() < .25 ? 'circle' : 'rect', wob: Math.random() * 6, life: 0 });
    }
  };
  burst(W * .2, H + 10, 90, 1); burst(W * .8, H + 10, 90, -1); burst(W * .5, H + 10, 60, 0);
  setTimeout(() => { burst(W * .35, H + 10, 50, .5); burst(W * .65, H + 10, 50, -.5); }, 450);
  const t0 = performance.now();
  const tick = (t) => {
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => {
      p.life++; p.vy += .28; p.vx *= .985; p.vy *= .985;
      p.x += p.vx + Math.sin((p.life + p.wob) / 9) * .8; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.globalAlpha = Math.max(0, 1 - (t - t0 - 3200) / 900);
      if(p.shape === 'circle'){ ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.life / 7)), p.w, p.h * Math.abs(Math.cos(p.life / 7)) + 1);
      ctx.restore();
    });
    if(run !== gConfettiRun){ cv.remove(); return; }
    if(t - t0 < 4200) requestAnimationFrame(tick); else cv.remove();
  };
  requestAnimationFrame(tick);
}

// =================== IDIOMA / INIT ===================
window.gameOnLang = function(){
  gApplyStrings(); gSyncViewSwitch();
  if(GS.game && GS.game.status === 'playing') gRenderPlay(false);
  else if(GS.game && GS.game.status === 'ended') gEnd(true);
  else gRenderSetup();
};
gBuildViewSwitch();
gApplyStrings();
gRenderSetup();
document.body.dataset.view = 'explore';
