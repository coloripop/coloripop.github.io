a de la World Wide Web","title_en":"World Wide Web proposal","desc":"Tim Berners-Lee propone en el CERN un sistema de información enlazado que se convertiría en la World Wide Web.","desc_en":"Tim Berners-Lee proposes at CERN a linked information system that would become the World Wide Web.","cats":["Web/Internet"],"importance":3,"region":"Suiza","region_en":"Switzerland","note":"","note_en":"","source":"Internet Society / Live Science"},{"id":"TEC-0061","year":1989,"title":"Nintendo Game Boy","title_en":"Nintendo Game Boy","desc":"Nintendo lanza el Game Boy, la consola portátil que popularizó masivamente el gaming móvil antes de los smartphones.","desc_en":"Nintendo launches the Game Boy, the handheld console that popularized mobile gaming long before smartphones.","cats":["Hardware","Gaming"],"importance":2,"region":"Japón","region_en":"Japan","note":"","note_en":"","source":"Wikipedia - History of Video Games"},{"id":"TEC-0062","year":1989,"title":"Proyecto Bolnet — Bolivia da sus primeros pasos hacia Internet","title_en":"Bolnet project — Bolivia's first steps toward the Internet","desc":"El PNUD impulsa el proyecto Bolnet en Bolivia, con el objetivo de establecer la primera red de comunicaciones académicas del país. Se conforma el comité impulsor con ENTEL, la UMSA y SEMTA, y se envían los primeros correos electrónicos desde Bolivia.","desc_en":"UNDP drives the Bolnet project in Bolivia, aimed at establishing the country's first academic communications network. A steering committee is formed with ENTEL, UMSA and SEMTA, and the first emails are sent from Bolivia.","cats":["Web/Internet"],"importance":2,"region":"Bolivia","region_en":"Bolivia","note":"","note_en":"","source":"Historia de Internet en Bolivia (internetbolivia.org, 2017); Wikipedia \"Historia de Internet en Bolivia\""},{"id":"PAT-0004","year":1990,"title":"La Gang of Four empieza a catalogar patrones de código","title_en":"The Gang of Four start cataloguing code patterns","desc":"Erich Gamma, Richard Helm, Ralph Johnson y John Vlissides —la 'Gang of Four'— comienzan a catalogar patrones recurrentes de diseño de código orientado a objetos.","desc_en":"Erich Gamma, Richard Helm, Ralph Johnson and John Vlissides—the 'Gang of Four'—begin cataloguing recurring object-oriented code design patterns.","cats":["Patrones","Software"],"importance":1,"region":"Global","region_en":"Global","note":"Catalogar es diseñar: nombrar una solución la vuelve enseñable y reutilizable.","note_en":"Cataloguing is designing: naming a solution makes it teachable and reusable."},{"id":"TEC-0063","year":1990,"title":"Primer servidor y navegador web","title_en":"First web server and browser","desc":"Tim Berners-Lee crea el primer servidor web y navegador (WorldWideWeb), implementando HTML, HTTP y URLs.","desc_en":"Tim Berners-Lee creates the first web server and browser (WorldWideWeb), implementing HTML, HTTP and URLs.","cats":["Web/Internet"],"importance":3,"region":"Suiza","region_en":"Switzerland","note":"","note_en":"","source":"Live Science / FindCheapBroadband"},{"id":"TEC-0064","year":1990,"title":"Bolnet conecta Bolivia a Internet 24 horas","title_en":"Bolnet connects Bolivia to the Internet 24/7","desc":"El 16 de julio de 1990, Bolnet completa su conexión a Internet las 24 horas del día, enlazando a Bolivia con 91 países y conectando 200 computadoras. El vicepresidente Víctor Hugo Cárdenas inaugura el servicio con la primera navegación web desde Bolivia.","desc_en":"On July 16, 1990, Bolnet completes its 24-hour Internet connection, linking Bolivia with 91 countries and connecting 200 computers. Vice President Víctor Hugo Cárdenas inaugurates the service with the first web browsing session from Bolivia.","cats":["Web/Internet"],"importance":3,"region":"Bolivia","region_en":"Bolivia","note":"","note_en":"","source":"Wikipedia \"Historia de Internet en Bolivia\"; Historia Internet Bolivia PDF (2017)"},{"id":"MOB-0005","year":1991,"title":"Primera red comercial GSM","title_en":"First commercial GSM network","desc":"Radiolinja lanza en Finlandia la primera red GSM (2G) comercial del mundo, habilitando voz digital, roaming internacional y, poco después, los mensajes de texto.","desc_en":"Radiolinja launches the world's first commercial GSM (2G) network in Finland, enabling digital voice, international roaming and, soon after, text messaging.","cats":["Mobile"],"importance":3,"region":"Finlandia","region_en":"Finland","note":"El 2G es la infraestructura invisible que hizo posible el SMS y, luego, el email móvil.","note_en":"2G is the invisible infrastructure that made SMS — and later mobile email — possible."},{"id":"TEC-0065","year":1991,"title":"Lanzamiento público de la World Wide Web","title_en":"Public launch of the World Wide Web","desc":"El CERN libera el software de la WWW al público; se publica el primer sitio web del mundo, info.cern.ch.","desc_en":"CERN releases the WWW software to the public; the world's first website, info.cern.ch, goes online.","cats":["Web/Internet"],"importance":3,"region":"Suiza","region_en":"Switzerland","note":"","note_en":"","source":"TechEngage / GeeksforGeeks"},{"id":"MOB-0006","year":1992,"title":"Primer SMS de la historia","title_en":"First SMS in history","desc":"Neil Papworth envía 'Merry Christmas' por SMS desde una computadora a un teléfono Vodafone en el Reino Unido, inaugurando la mensajería de texto como paradigma de comunicación.","desc_en":"Neil Papworth sends 'Merry Christmas' via SMS from a computer to a Vodafone phone in the UK, launching text messaging as a communication paradigm.","cats":["Mobile"],"importance":3,"region":"Reino Unido","region_en":"United Kingdom","note":"160 caracteres de límite técnico terminaron creando toda una cultura de abreviaciones y emojis.","note_en":"A 160-character technical limit ended up creating an entire culture of abbreviations and emoji."},{"id":"TEC-0066","year":1992,"title":"Acuñación del término 'Augmented Reality'","title_en":"The term 'Augmented Reality' is coined","desc":"Tom Caudell y David Mizell, de Boeing, acuñan formalmente el término 'realidad aumentada'.","desc_en":"Tom Caudell and David Mizell, at Boeing, formally coin the term 'augmented reality'.","cats":["VR/AR"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"arXiv - Augmented Reality in ICT"},{"id":"DEV-0001","year":1993,"title":"Apple Newton","title_en":"Apple Newton","desc":"Apple lanza el Newton MessagePad, la PDA que populariza el término y que apuesta por el reconocimiento de escritura y la interacción con lápiz óptico como entrada principal.","desc_en":"Apple launches the Newton MessagePad, the PDA that popularized the term and bet on handwriting recognition and stylus interaction as its primary input.","cats":["Mobile","Hardware"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Un fracaso comercial que, sin embargo, definió el vocabulario de 'asistente personal digital'.","note_en":"A commercial failure that nonetheless defined the vocabulary of the 'personal digital assistant.'"},{"id":"UX-0001","year":1993,"title":"Reconocimiento de escritura (Apple Newton)","title_en":"Handwriting recognition (Apple Newton)","desc":"El Newton apuesta por el reconocimiento de escritura a mano como entrada principal, un intento ambicioso —pero poco confiable al inicio— de eliminar el teclado de la computación móvil.","desc_en":"The Newton bets on handwriting recognition as its primary input — an ambitious but initially unreliable attempt to remove the keyboard from mobile computing.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Un patrón adelantado a su tiempo: la tecnología de reconocimiento no estaba lista para la ambición del diseño.","note_en":"A pattern ahead of its time: recognition technology wasn't ready for the design's ambition."},{"id":"TEC-0067","year":1993,"title":"Navegador Mosaic","title_en":"Mosaic browser","desc":"Marc Andreessen lanza Mosaic, el primer navegador web gráfico ampliamente popular, haciendo la web accesible al público general.","desc_en":"Marc Andreessen releases Mosaic, the first widely popular graphical web browser, making the web accessible to the general public.","cats":["UX/UI","Web/Internet"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Live Science / GeeksforGeeks"},{"id":"TEC-0068","year":1993,"title":"DOOM","title_en":"DOOM","desc":"id Software lanza DOOM, revolucionando el género de disparos en primera persona y la cultura del multijugador en red.","desc_en":"id Software launches DOOM, revolutionizing the first-person shooter genre and networked multiplayer culture.","cats":["Gaming"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia - History of Video Games"},{"id":"PAT-0005","year":1994,"title":"Design Patterns (Gang of Four)","title_en":"Design Patterns (Gang of Four)","desc":"Se publica Design Patterns: Elements of Reusable Object-Oriented Software, con 23 patrones (Singleton, Observer, Factory, entre otros) que se convierten en vocabulario común de la ingeniería de software.","desc_en":"Design Patterns: Elements of Reusable Object-Oriented Software is published, with 23 patterns (Singleton, Observer, Factory and more) that become shared vocabulary across software engineering.","cats":["Patrones","Software"],"importance":3,"region":"Global","region_en":"Global","note":"Nota de investigación: la infografía original lo ubica en 1995 (año de copyright), pero el libro salió a la venta en octubre de 1994; se ajustó el año.","note_en":"Research note: the original infographic places it in 1995 (copyright year), but the book went on sale in October 1994; the year was adjusted."},{"id":"DEV-0002","year":1994,"title":"IBM Simon","title_en":"IBM Simon","desc":"El IBM Simon Personal Communicator combina teléfono, buscapersonas, fax y PDA con pantalla táctil, y es considerado ampliamente el primer smartphone de la historia.","desc_en":"The IBM Simon Personal Communicator combines phone, pager, fax, and PDA with a touchscreen, and is widely regarded as the first smartphone in history.","cats":["Mobile","Hardware"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"Trece años antes del iPhone, ya existía la idea de 'un dispositivo para todo'.","note_en":"Thirteen years before the iPhone, the idea of 'one device for everything' already existed."},{"id":"TEC-0069","year":1994,"title":"Netscape Navigator","title_en":"Netscape Navigator","desc":"Netscape lanza su navegador, dominando el mercado web temprano y desatando la primera 'guerra de navegadores'.","desc_en":"Netscape launches its browser, dominating the early web market and sparking the first 'browser war'.","cats":["Web/Internet"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Comentum - Internet History"},{"id":"TEC-0070","year":1994,"title":"Primer banner publicitario en la web","title_en":"First banner ad on the web","desc":"AT&T lanza el primer banner publicitario online en HotWired.com, marcando el inicio de la publicidad digital.","desc_en":"AT&T runs the first online banner ad on HotWired.com, marking the start of digital advertising.","cats":["Web/Internet"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Comentum - Internet History"},{"id":"TEC-0071","year":1995,"title":"Amazon y eBay","title_en":"Amazon and eBay","desc":"Se lanzan Amazon y eBay, pioneros del comercio electrónico que transformarían el retail global.","desc_en":"Amazon and eBay launch, e-commerce pioneers that would transform global retail.","cats":["Web/Internet"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Comentum - Internet History"},{"id":"TEC-0072","year":1995,"title":"Windows 95","title_en":"Windows 95","desc":"Microsoft lanza Windows 95, que introduce el menú 'Inicio' y populariza masivamente la GUI en hogares y oficinas.","desc_en":"Microsoft launches Windows 95, introducing the 'Start' menu and massively popularizing the GUI in homes and offices.","cats":["Software","UX/UI"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia - Timeline of Computing"},{"id":"PAT-0006","year":1996,"title":"Christopher Alexander, keynote en OOPSLA","title_en":"Christopher Alexander keynotes OOPSLA","desc":"Christopher Alexander da la conferencia principal de OOPSLA (conferencia de programación orientada a objetos), reconociendo y cuestionando cómo la comunidad de software adoptó sus ideas.","desc_en":"Christopher Alexander gives the keynote at OOPSLA (the object-oriented programming conference), acknowledging and challenging how the software community adopted his ideas.","cats":["Patrones","Software"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"El arquitecto le pide al software algo más que eficiencia: que sus patrones mejoren la vida de las personas.","note_en":"The architect asks software for more than efficiency: patterns that improve people's lives."},{"id":"DEV-0003","year":1996,"title":"Nokia 9000 Communicator","title_en":"Nokia 9000 Communicator","desc":"Nokia lanza el Communicator, que combina teléfono con teclado QWERTY completo en un cuerpo tipo almeja, orientado al email y la navegación temprana para uso corporativo.","desc_en":"Nokia launches the Communicator, combining a phone with a full QWERTY keyboard in a clamshell body, aimed at email and early browsing for business use.","cats":["Mobile","Hardware"],"importance":1,"region":"Finlandia","region_en":"Finland","note":"El teclado físico completo como respuesta al problema de escribir texto largo en un celular.","note_en":"The full physical keyboard as an answer to the problem of typing long text on a phone."},{"id":"PAT-0007","year":1997,"title":"Jenifer Tidwell presenta una biblioteca de patrones de interacción en CHI","title_en":"Jenifer Tidwell presents an interaction pattern library at CHI","desc":"Jenifer Tidwell presenta en la conferencia CHI una biblioteca de patrones de interacción, trasladando el enfoque de Alexander al diseño de interfaces de usuario.","desc_en":"Jenifer Tidwell presents an interaction pattern library at the CHI conference, bringing Alexander's approach to user interface design.","cats":["Patrones","UX/UI"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Inicio de la era 'Patrones en Diseño de Experiencia de Usuario'.","note_en":"Start of the 'Patterns in User Experience Design' era."},{"id":"TEC-0073","year":1997,"title":"Acuñación informal de 'smartphone' (Ericsson)","title_en":"Informal coining of 'smartphone' (Ericsson)","desc":"Ericsson usa el término 'smartphone' para describir su prototipo GS88, una década antes del iPhone.","desc_en":"Ericsson uses the term 'smartphone' to describe its GS88 prototype, a decade before the iPhone.","cats":["Mobile"],"importance":1,"region":"Suecia","region_en":"Sweden","note":"","note_en":"","source":"Textedly - Smartphone History"},{"id":"TEC-0074","year":1997,"title":"SixDegrees.com","title_en":"SixDegrees.com","desc":"Lanza SixDegrees, ampliamente considerada la primera red social moderna de la historia, con perfiles y listas de amigos.","desc_en":"SixDegrees launches, widely considered the first modern social network in history, with profiles and friend lists.","cats":["Social"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia / Telefónica / BroadbandSearch"},{"id":"TEC-0075","year":1997,"title":"Snake en Nokia 6110","title_en":"Snake on the Nokia 6110","desc":"Nokia integra el juego Snake en el 6110, dando inicio masivo al gaming móvil casual.","desc_en":"Nokia builds the game Snake into the 6110, kicking off mass-market casual mobile gaming.","cats":["Mobile","Gaming"],"importance":2,"region":"Finlandia","region_en":"Finland","note":"","note_en":"","source":"Textline - Smartphone History"},{"id":"UX-0002","year":1998,"title":"Menús jerárquicos de Nokia","title_en":"Nokia's hierarchical menus","desc":"Nokia estandariza un sistema de menús jerárquicos navegados con D-pad, convirtiéndose en la plantilla de navegación de los feature phones durante toda la década siguiente.","desc_en":"Nokia standardizes a hierarchical menu system navigated with a D-pad, becoming the navigation template for feature phones throughout the following decade.","cats":["UX/UI","Mobile"],"importance":1,"region":"Finlandia","region_en":"Finland","note":"El ancestro directo de cualquier menú de configuraciones anidado que usamos hoy.","note_en":"The direct ancestor of every nested settings menu we still use today."},{"id":"TEC-0076","year":1998,"title":"Fundación de Google","title_en":"Google is founded","desc":"Larry Page y Sergey Brin fundan Google, transformando un proyecto universitario de búsqueda en el motor de búsqueda dominante del mundo.","desc_en":"Larry Page and Sergey Brin found Google, turning a university search project into the world's dominant search engine.","cats":["Web/Internet"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"FindCheapBroadband"},{"id":"TEC-0077","year":1999,"title":"Napster y BlackBerry 850","title_en":"Napster and BlackBerry 850","desc":"Napster revoluciona (y disrumpe) la industria musical con el compartir P2P; RIM lanza el BlackBerry 850, popularizando el email móvil corporativo.","desc_en":"Napster revolutionizes (and disrupts) the music industry with P2P sharing; RIM launches the BlackBerry 850, popularizing corporate mobile email.","cats":["Web/Internet","Mobile"],"importance":2,"region":"Estados Unidos / Canadá","region_en":"United States / Canada","note":"","note_en":"","source":"Mint Mobile"},{"id":"TEC-0078","year":1999,"title":"Fundación de Mercado Libre (Argentina)","title_en":"Mercado Libre is founded (Argentina)","desc":"Marcos Galperin funda Mercado Libre el 2 de agosto de 1999 en Buenos Aires, creando la primera gran plataforma de e-commerce latinoamericana. En 2007 se convierte en la primera empresa tecnológica latinoamericana en cotizar en el NASDAQ.","desc_en":"Marcos Galperin founds Mercado Libre on August 2, 1999 in Buenos Aires, creating Latin America's first major e-commerce platform. In 2007 it becomes the first Latin American tech company listed on NASDAQ.","cats":["Software","Web/Internet"],"importance":3,"region":"Argentina","region_en":"Argentina","note":"","note_en":"","source":"Wikipedia \"Mercado Libre\"; Mercadolibre.com/history"},{"id":"PAT-0008","year":2000,"title":"Martijn van Welie publica su biblioteca de patrones en la web","title_en":"Martijn van Welie publishes his pattern library online","desc":"Martijn van Welie publica en la web una de las primeras bibliotecas públicas de patrones de interacción para diseño web, GUI y móvil.","desc_en":"Martijn van Welie publishes online one of the first public interaction pattern libraries for web, GUI and mobile design.","cats":["Patrones","UX/UI","Web/Internet"],"importance":2,"region":"Países Bajos","region_en":"Netherlands","note":"Los patrones salen de los libros y los papers: ahora cualquiera puede consultarlos gratis.","note_en":"Patterns leave books and papers behind: now anyone can browse them for free."},{"id":"DEV-0004","year":2000,"title":"Primer teléfono con cámara","title_en":"First camera phone","desc":"El Sharp J-SH04, lanzado en Japón junto a J-Phone, es el primer teléfono con cámara integrada de venta masiva, sembrando la base de la cultura de fotografía y compartir imágenes desde el móvil.","desc_en":"The Sharp J-SH04, launched in Japan alongside J-Phone, is the first mass-market phone with a built-in camera, planting the seed of mobile photo culture and image-sharing.","cats":["Mobile","Hardware"],"importance":2,"region":"Japón","region_en":"Japan","note":"El origen técnico de cada selfie, historia e Instagram post que existiría después.","note_en":"The technical origin of every selfie, story, and Instagram post that would ever exist."},{"id":"DEV-0005","year":2000,"title":"Nokia 3310","title_en":"Nokia 3310","desc":"Nokia lanza el 3310, uno de los teléfonos más vendidos de la historia, célebre por su durabilidad, carcasas intercambiables y el juego Snake preinstalado.","desc_en":"Nokia launches the 3310, one of the best-selling phones in history, famous for its durability, interchangeable covers, and the pre-installed game Snake.","cats":["Mobile","Hardware"],"importance":1,"region":"Finlandia","region_en":"Finland","note":"Ícono cultural del diseño 'indestructible' de la era feature phone.","note_en":"A cultural icon of the 'indestructible' design ethos of the feature-phone era."},{"id":"UX-0003","year":2000,"title":"Teclas contextuales (soft keys)","title_en":"Contextual soft keys","desc":"Los teléfonos adoptan dos teclas físicas bajo la pantalla cuya función cambia según el contexto, indicada por etiquetas en pantalla, reduciendo la cantidad de botones dedicados necesarios.","desc_en":"Phones adopt two physical keys below the screen whose function changes with context, indicated by on-screen labels, reducing the number of dedicated buttons needed.","cats":["UX/UI","Mobile"],"importance":1,"region":"Global","region_en":"Global","note":"Primer ejemplo masivo de un control físico cuyo significado lo define el software.","note_en":"The first mass example of a physical control whose meaning is defined entirely by software."},{"id":"MOB-0007","year":2001,"title":"Despliegue comercial de redes 3G","title_en":"Commercial rollout of 3G networks","desc":"NTT DoCoMo lanza en Japón la primera red 3G comercial del mundo, habilitando internet móvil, videollamadas y velocidades de datos que harían viables las apps intensivas en contenido.","desc_en":"NTT DoCoMo launches the world's first commercial 3G network in Japan, enabling mobile internet, video calls, and data speeds that would make content-heavy apps viable.","cats":["Mobile"],"importance":2,"region":"Japón","region_en":"Japan","note":"Sin 3G, un ícono de App Store hubiera sido solo una promesa técnica.","note_en":"Without 3G, an App Store icon would have been nothing more than a technical promise."},{"id":"TEC-0079","year":2001,"title":"Wikipedia y iPod","title_en":"Wikipedia and iPod","desc":"Se lanza Wikipedia, la enciclopedia colaborativa más grande del mundo; Apple lanza el iPod, transformando el consumo de música digital.","desc_en":"Wikipedia launches, the world's largest collaborative encyclopedia; Apple launches the iPod, transforming digital music consumption.","cats":["Hardware","Web/Internet"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Comentum - Internet History"},{"id":"PAT-0009","year":2002,"title":"The Design of Sites","title_en":"The Design of Sites","desc":"Douglas van Duyne, James Landay y Jason Hong publican The Design of Sites, que presenta muchas ideas de diseño web en forma de patrones.","desc_en":"Douglas van Duyne, James Landay and Jason Hong publish The Design of Sites, presenting many web design ideas in pattern form.","cats":["Patrones","UX/UI","Web/Internet"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Uno de los primeros libros que aplica el formato de patrones al sitio web completo.","note_en":"One of the first books to apply the pattern format to the entire website."},{"id":"DEV-0006","year":2002,"title":"BlackBerry 5810","title_en":"BlackBerry 5810","desc":"RIM lanza el primer BlackBerry con función de llamadas (requería auricular), enfocado en email corporativo instantáneo con teclado QWERTY físico compacto.","desc_en":"RIM launches the first BlackBerry with calling capability (it required a headset), focused on instant corporate email with a compact physical QWERTY keyboard.","cats":["Mobile","Hardware"],"importance":1,"region":"Canadá","region_en":"Canada","note":"El teclado de pulgares (thumb-typing) que definiría la escritura móvil corporativa por años.","note_en":"The thumb-typing keyboard that would define corporate mobile writing for years."},{"id":"TEC-0080","year":2002,"title":"Friendster","title_en":"Friendster","desc":"Se lanza Friendster, una de las primeras redes sociales en escalar masivamente, popularizando el concepto de 'amigos en común'.","desc_en":"Friendster launches, one of the first social networks to scale massively, popularizing the concept of 'mutual friends'.","cats":["Social"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Telefónica / History Cooperative"},{"id":"TEC-0081","year":2002,"title":"Se acuña el término 'Gamification'","title_en":"The term 'Gamification' is coined","desc":"Nick Pelling acuña el término 'gamification' mientras diseñaba interfaces tipo videojuego para cajeros automáticos y máquinas expendedoras.","desc_en":"Nick Pelling coins the term 'gamification' while designing game-like interfaces for ATMs and vending machines.","cats":["Gaming"],"importance":3,"region":"Reino Unido","region_en":"United Kingdom","note":"","note_en":"","source":"Growth Engineering / Smartico - History of Gamification"},{"id":"TEC-0082","year":2003,"title":"MySpace y LinkedIn","title_en":"MySpace and LinkedIn","desc":"Se lanzan MySpace (perfiles personalizables, música) y LinkedIn (networking profesional), expandiendo masivamente el ecosistema social.","desc_en":"MySpace (customizable profiles, music) and LinkedIn (professional networking) launch, massively expanding the social ecosystem.","cats":["Social"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Telefónica / History Cooperative"},{"id":"TEC-0083","year":2003,"title":"Garmin Forerunner","title_en":"Garmin Forerunner","desc":"Garmin lanza el Forerunner, uno de los primeros relojes deportivos con GPS integrado, antecesor directo de los wearables fitness.","desc_en":"Garmin launches the Forerunner, one of the first sports watches with built-in GPS, a direct ancestor of fitness wearables.","cats":["Wearables"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"eLearners - History of Wearable Tech"},{"id":"PAT-0010","year":2004,"title":"Nace la Yahoo! Pattern Library","title_en":"The Yahoo! Pattern Library is born","desc":"Erin Malone se une a Yahoo! e inicia la Yahoo! Pattern Library, con Matt Leacock como primer curador. Boxes and Arrows publica un artículo sobre cómo desarrollar una biblioteca de patrones y los sistemas que la rodean.","desc_en":"Erin Malone joins Yahoo! and starts the Yahoo! Pattern Library, with Matt Leacock as its first curator. Boxes and Arrows publishes an article about developing a pattern library and the systems around it.","cats":["Patrones","UX/UI"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Primera gran biblioteca corporativa de patrones: el antecedente directo de los design systems.","note_en":"The first major corporate pattern library: the direct precursor of design systems."},{"id":"UX-0004","year":2004,"title":"Click Wheel del iPod","title_en":"iPod Click Wheel","desc":"La rueda del iPod combina desplazamiento físico con sensado capacitivo, permitiendo navegar listas largas con un solo pulgar; un antecedente directo del pensamiento gestual del iPhone.","desc_en":"The iPod's wheel combines physical scrolling with capacitive sensing, letting users navigate long lists with a single thumb — a direct precursor to the iPhone's gestural thinking.","cats":["UX/UI","Hardware"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"La velocidad de giro determina la velocidad de scroll: física traducida en interacción digital.","note_en":"Spin speed determines scroll speed: physics translated directly into digital interaction."},{"id":"TEC-0084","year":2004,"title":"Facebook","title_en":"Facebook","desc":"Mark Zuckerberg lanza 'TheFacebook' en Harvard; se convertiría en la red social más grande e influyente del mundo.","desc_en":"Mark Zuckerberg launches 'TheFacebook' at Harvard; it would become the largest and most influential social network in the world.","cats":["Social"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"History Cooperative / Telefónica"},{"id":"TEC-0085","year":2004,"title":"Motorola RAZR","title_en":"Motorola RAZR","desc":"Motorola lanza el RAZR, el teléfono flip más icónico de su era, fusionando diseño y tecnología como símbolo de estatus.","desc_en":"Motorola launches the RAZR, the most iconic flip phone of its era, fusing design and technology as a status symbol.","cats":["Hardware","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Consumer Cellular - History of Cell Phones"},{"id":"TEC-0086","year":2004,"title":"World of Warcraft","title_en":"World of Warcraft","desc":"Blizzard lanza World of Warcraft, definiendo el género MMORPG y la economía de suscripción en videojuegos.","desc_en":"Blizzard launches World of Warcraft, defining the MMORPG genre and the subscription economy in video games.","cats":["Gaming"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia - History of Video Games"},{"id":"PAT-0011","year":2005,"title":"Designing Interfaces (Jenifer Tidwell)","title_en":"Designing Interfaces (Jenifer Tidwell)","desc":"Jenifer Tidwell evoluciona su biblioteca de patrones y publica Designing Interfaces (O'Reilly), referencia clásica de patrones de interacción.","desc_en":"Jenifer Tidwell evolves her pattern library and publishes Designing Interfaces (O'Reilly), a classic reference on interaction patterns.","cats":["Patrones","UX/UI"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"Durante años, el libro de cabecera para diseñadores de interfaces.","note_en":"For years, the go-to book for interface designers."},{"id":"TEC-0087","year":2005,"title":"YouTube","title_en":"YouTube","desc":"Se funda YouTube, transformando el video online y sentando las bases del modelo de creador de contenido moderno.","desc_en":"YouTube is founded, transforming online video and laying the groundwork for the modern content-creator model.","cats":["Social","Web/Internet"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Telefónica - Social Networks"},{"id":"TEC-0088","year":2005,"title":"Xbox Live Achievements","title_en":"Xbox Live Achievements","desc":"Microsoft introduce los 'Achievements' en Xbox Live, un sistema de logros que influiría enormemente en el diseño de gamificación posterior.","desc_en":"Microsoft introduces Achievements on Xbox Live, a reward system that would hugely influence later gamification design.","cats":["Gaming"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Smartico - History of Gamification"},{"id":"PAT-0012","year":2006,"title":"Yahoo! Pattern Library + YUI en open source","title_en":"Yahoo! Pattern Library + YUI go open source","desc":"La Yahoo! Pattern Library se une a la biblioteca de código YUI (Yahoo! User Interface) y libera patrones y componentes como open source. Bill Scott se convierte en curador y lidera la evangelización de estos esfuerzos.","desc_en":"The Yahoo! Pattern Library teams up with the YUI (Yahoo! User Interface) code library and releases patterns and components as open source. Bill Scott becomes curator and leads the evangelization of these efforts.","cats":["Patrones","UX/UI","Web/Internet"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Patrón de diseño + componente de código juntos: la fórmula que hoy define a un design system.","note_en":"Design pattern + code component together: the formula that defines a design system today."},{"id":"TEC-0089","year":2006,"title":"Twitter","title_en":"Twitter","desc":"Jack Dorsey y equipo lanzan Twitter (originalmente 'twttr'), creando el microblogging y el formato de 'tweet' de 140 caracteres.","desc_en":"Jack Dorsey and team launch Twitter (originally 'twttr'), creating microblogging and the 140-character 'tweet' format.","cats":["Social"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Marketing4eCommerce - History of Social Networks"},{"id":"TEC-0090","year":2006,"title":"Google adquiere YouTube","title_en":"Google acquires YouTube","desc":"Google compra YouTube por 1.65 mil millones de dólares, consolidando su dominio en el video online.","desc_en":"Google buys YouTube for 1.65 billion dollars, consolidating its dominance in online video.","cats":["Web/Internet"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Marketing4eCommerce"},{"id":"DEV-0007","year":2007,"title":"Primer iPhone","title_en":"First iPhone","desc":"Apple lanza el primer iPhone, eliminando el teclado físico en favor de una pantalla táctil capacitiva multitouch, redefiniendo de raíz el hardware y la interacción móvil.","desc_en":"Apple launches the first iPhone, dropping the physical keyboard in favor of a capacitive multitouch touchscreen, redefining mobile hardware and interaction from the ground up.","cats":["Mobile","Hardware","UX/UI"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"El punto de quiebre que separa 'antes' y 'después' en el diseño de interacción móvil.","note_en":"The turning point that splits mobile interaction design into a clear 'before' and 'after.'"},{"id":"UX-0005","year":2007,"title":"Tap","title_en":"Tap","desc":"El iPhone establece el 'tap' como la unidad fundamental de interacción táctil, reemplazando el clic de botón físico como gesto base de toda interfaz móvil.","desc_en":"The iPhone establishes the tap as the fundamental unit of touch interaction, replacing the physical button click as the base gesture of every mobile interface.","cats":["UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"El gesto más simple y más usado en la historia del diseño de interfaces.","note_en":"The simplest, most-used gesture in the entire history of interface design."},{"id":"UX-0006","year":2007,"title":"Multitouch","title_en":"Multitouch","desc":"La pantalla capacitiva multitouch del iPhone (basada en tecnología de FingerWorks adquirida por Apple) permite múltiples puntos de contacto simultáneos, habilitando gestos que ningún teléfono soportaba antes.","desc_en":"The iPhone's capacitive multitouch screen (built on FingerWorks technology Apple acquired) allows multiple simultaneous touch points, enabling gestures no phone had supported before.","cats":["UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"Multitouch es la infraestructura técnica detrás de casi todos los gestos posteriores de esta lista.","note_en":"Multitouch is the technical infrastructure behind almost every gesture that follows on this list."},{"id":"UX-0007","year":2007,"title":"Swipe (deslizar)","title_en":"Swipe","desc":"El gesto de deslizar debuta como patrón de navegación central en el iPhone, usado para desbloquear, pasar entre pantallas de inicio y descartar elementos.","desc_en":"The swipe gesture debuts as a core navigation pattern on the iPhone, used to unlock the phone, move between home screens, and dismiss elements.","cats":["UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"Un gesto direccional que hoy dispara desde 'siguiente historia' hasta 'match' en apps de citas.","note_en":"A directional gesture that today triggers everything from 'next story' to a 'match' on dating apps."},{"id":"UX-0008","year":2007,"title":"Pinch-to-zoom","title_en":"Pinch-to-zoom","desc":"El iPhone introduce el pellizco con dos dedos para escalar contenido directamente, reemplazando los botones de zoom con una metáfora de manipulación directa.","desc_en":"The iPhone introduces the two-finger pinch to scale content directly, replacing zoom buttons with a direct-manipulation metaphor.","cats":["UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"El gesto que hizo obsoletos los botones '+' y '−' de zoom de una sola vez.","note_en":"The gesture that made '+' and '−' zoom buttons obsolete overnight."},{"id":"UX-0009","year":2007,"title":"Scroll con inercia (momentum)","title_en":"Momentum scrolling","desc":"El desplazamiento del iPhone incorpora física de inercia: las listas siguen moviéndose y desaceleran naturalmente tras un 'flick', haciendo que las listas digitales se sientan tangibles.","desc_en":"iPhone scrolling incorporates inertia physics: lists keep moving and decelerate naturally after a flick, making digital lists feel tangible.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Bas Ording programó este efecto; se dice que fue una de las demos que convenció internamente del proyecto iPhone.","note_en":"Bas Ording programmed this effect; it's said to be one of the demos that won internal support for the iPhone project."},{"id":"UX-0010","year":2007,"title":"Rebote elástico (rubber-banding)","title_en":"Rubber-band scrolling","desc":"Apple patenta el efecto de 'rebote elástico' al hacer scroll más allá del límite de una lista, dando retroalimentación visual instantánea de que se llegó al final del contenido.","desc_en":"Apple patents the 'rubber-band' bounce-back effect when scrolling past a list's edge, giving instant visual feedback that the end of the content has been reached.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Feedback visual sin texto: el propio movimiento le explica al usuario dónde está el límite.","note_en":"Feedback with no text at all: the motion itself tells the user where the limit is."},{"id":"UX-0011","year":2007,"title":"Slide to unlock","title_en":"Slide to unlock","desc":"El deslizador para desbloquear del iPhone se convierte en uno de los patrones de interfaz más reconocidos de la década, usando una metáfora física de deslizamiento para prevenir desbloqueos accidentales.","desc_en":"The iPhone's slide-to-unlock becomes one of the most recognized interface patterns of the decade, using a physical sliding metaphor to prevent accidental unlocks.","cats":["UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"Tan icónico que Apple lo patentó y litigó activamente para protegerlo.","note_en":"So iconic that Apple patented it and actively litigated to protect it."},{"id":"UX-0012","year":2007,"title":"Autocorrección moderna","title_en":"Modern autocorrect","desc":"El iPhone se lanza con autocorrección en tiempo real sobre un teclado por software sin teclas físicas, una compensación necesaria del diseño de pantalla completa.","desc_en":"The iPhone ships with real-time autocorrect running on a software keyboard with no physical keys — a necessary trade-off of the full-screen design.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"El primer gran ejemplo de un sistema que 'adivina' la intención del usuario en tiempo real.","note_en":"The first major example of a system that 'guesses' user intent in real time."},{"id":"TEC-0091","year":2007,"title":"Amazon Kindle","title_en":"Amazon Kindle","desc":"Amazon lanza el Kindle, popularizando los libros electrónicos y la tinta electrónica como nuevo formato de lectura.","desc_en":"Amazon launches the Kindle, popularizing e-books and electronic ink as a new reading format.","cats":["Hardware"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Comentum - Internet History"},{"id":"PAT-0013","year":2008,"title":"Designing Gestural Interfaces (Dan Saffer)","title_en":"Designing Gestural Interfaces (Dan Saffer)","desc":"Dan Saffer publica Designing Gestural Interfaces, que documenta patrones para interfaces táctiles y gestuales justo después de la llegada del iPhone.","desc_en":"Dan Saffer publishes Designing Gestural Interfaces, documenting patterns for touch and gesture interfaces right after the iPhone's arrival.","cats":["Patrones","UX/UI"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Los gestos táctiles empiezan a tener su propio catálogo de patrones.","note_en":"Touch gestures start getting their own pattern catalogue."},{"id":"DEV-0008","year":2008,"title":"HTC Dream","title_en":"HTC Dream","desc":"El HTC Dream (T-Mobile G1) se lanza como el primer teléfono comercial con Android, abriendo un segundo gran ecosistema móvil junto a iOS.","desc_en":"The HTC Dream (T-Mobile G1) launches as the first commercial Android phone, opening a second major mobile ecosystem alongside iOS.","cats":["Mobile","Hardware"],"importance":2,"region":"Estados Unidos / Taiwán","region_en":"United States / Taiwan","note":"El inicio de la fragmentación (y la riqueza) del diseño multiplataforma Android vs. iOS.","note_en":"The start of the fragmentation — and the richness — of Android vs. iOS multi-platform design."},{"id":"UX-0013","year":2008,"title":"Doble tap para zoom","title_en":"Double-tap to zoom","desc":"Con la apertura de la App Store, las apps estandarizan el doble tap como atajo rápido de zoom en imágenes y contenido web, complementando los gestos de pellizco.","desc_en":"With the App Store's launch, apps standardize double-tap as a quick zoom shortcut on images and web content, complementing pinch gestures.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Un atajo de 'segunda velocidad' que complementa, sin reemplazar, el gesto de pellizco.","note_en":"A 'second gear' shortcut that complements, rather than replaces, the pinch gesture."},{"id":"UX-0014","year":2008,"title":"Gesto de rotar","title_en":"Rotate gesture","desc":"Se formaliza el gesto de rotar con dos dedos para girar fotos y mapas, ampliando el vocabulario multitouch más allá del pellizco y el tap.","desc_en":"The two-finger rotate gesture is formalized for turning photos and maps, expanding the multitouch vocabulary beyond pinch and tap.","cats":["UX/UI","Mobile"],"importance":1,"region":"Global","region_en":"Global","note":"Un gesto poco usado pero conceptualmente clave: demuestra que multitouch puede leer ángulo, no solo distancia.","note_en":"A rarely used but conceptually key gesture: proof that multitouch can read angle, not just distance."},{"id":"UX-0015","year":2008,"title":"Gestos de dos dedos","title_en":"Two-finger gestures","desc":"Patrones como el tap con dos dedos para alejar zoom o el scroll con dos dedos en mapas se expanden a medida que más apps se diseñan pensando exclusivamente en pantallas táctiles.","desc_en":"Patterns like two-finger tap to zoom out or two-finger scroll on maps expand as more apps are designed exclusively for touchscreens.","cats":["UX/UI","Mobile"],"importance":1,"region":"Global","region_en":"Global","note":"Cada dedo adicional multiplica el vocabulario gestual disponible para el diseñador.","note_en":"Every extra finger multiplies the gestural vocabulary available to the designer."},{"id":"UX-0016","year":2008,"title":"UX con acelerómetro","title_en":"Accelerometer UX","desc":"Las apps comienzan a usar el acelerómetro integrado para detectar orientación y movimiento del dispositivo, habilitando auto-rotación y juegos o herramientas controladas al inclinar el teléfono.","desc_en":"Apps begin using the built-in accelerometer to detect device orientation and motion, enabling auto-rotate and games or tools controlled by tilting the phone.","cats":["UX/UI","Mobile"],"importance":2,"region":"Global","region_en":"Global","note":"La primera vez que el propio cuerpo del teléfono —no solo su pantalla— se vuelve un input.","note_en":"The first time the phone's own body — not just its screen — becomes an input."},{"id":"TEC-0092","year":2008,"title":"App Store","title_en":"App Store","desc":"Apple lanza la App Store, dando origen —junto con la llegada de Android ese mismo año— al ecosistema moderno de apps móviles.","desc_en":"Apple launches the App Store, giving rise—together with the arrival of Android that same year—to the modern mobile app ecosystem.","cats":["Software","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Uswitch / Cellular Sales"},{"id":"PAT-0014","year":2009,"title":"Designing Web Interfaces (Bill Scott y Theresa Neil)","title_en":"Designing Web Interfaces (Bill Scott and Theresa Neil)","desc":"Bill Scott y Theresa Neil publican Designing Web Interfaces, con principios y patrones para aplicaciones web ricas e interactivas.","desc_en":"Bill Scott and Theresa Neil publish Designing Web Interfaces, with principles and patterns for rich, interactive web applications.","cats":["Patrones","UX/UI","Web/Internet"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Nota de investigación: la infografía original lo ubica en 2008, pero el libro se publicó a inicios de 2009; se ajustó el año.","note_en":"Research note: the original infographic places it in 2008, but the book was published in early 2009; the year was adjusted."},{"id":"PAT-0015","year":2009,"title":"Designing Social Interfaces (Malone y Crumlish)","title_en":"Designing Social Interfaces (Malone and Crumlish)","desc":"Erin Malone y Christian Crumlish publican Designing Social Interfaces, ampliando los patrones sociales publicados previamente en la biblioteca de Yahoo!.","desc_en":"Erin Malone and Christian Crumlish publish Designing Social Interfaces, expanding the social patterns previously published in the Yahoo! library.","cats":["Patrones","UX/UI","Social"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Perfiles, reputación, compartir: lo social también se vuelve un sistema de patrones.","note_en":"Profiles, reputation, sharing: social features become a pattern system too."},{"id":"PAT-0016","year":2009,"title":"Modular Web Design (Nathan Curtis)","title_en":"Modular Web Design (Nathan Curtis)","desc":"Nathan Curtis promueve la idea de una biblioteca modular y componentizada de piezas para diseñar la web en su libro Modular Web Design.","desc_en":"Nathan Curtis promotes the idea of a modular, componentized library of parts for designing the web in his book Modular Web Design.","cats":["Patrones","UX/UI","Web/Internet"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Nota de investigación: la infografía original lo ubica cerca de 2010, pero el libro se publicó en 2009; se ajustó el año.","note_en":"Research note: the original infographic places it around 2010, but the book was published in 2009; the year was adjusted."},{"id":"MOB-0008","year":2009,"title":"Expansión global de 4G LTE","title_en":"Global expansion of 4G LTE","desc":"TeliaSonera lanza las primeras redes LTE (4G) comerciales en Estocolmo y Oslo, con velocidades que habilitarían streaming de video fluido, apps pesadas y una UX centrada en la nube.","desc_en":"TeliaSonera launches the first commercial LTE (4G) networks in Stockholm and Oslo, with speeds that would enable smooth video streaming, heavy apps, and cloud-centric UX.","cats":["Mobile"],"importance":2,"region":"Suecia / Noruega","region_en":"Sweden / Norway","note":"El salto de velocidad que permitió pensar el celular como una computadora de bolsillo real.","note_en":"The speed leap that let people start thinking of the phone as a real pocket computer."},{"id":"UX-0017","year":2009,"title":"Pull-to-refresh","title_en":"Pull-to-refresh","desc":"Loren Brichter diseña el gesto de 'tirar para refrescar' para la app Tweetie, convirtiendo un deslizamiento hacia abajo y soltar en el estándar de la industria para actualizar contenido manualmente.","desc_en":"Loren Brichter designs the 'pull to refresh' gesture for the Tweetie app, turning a swipe-down-and-release into the industry standard for manually updating content.","cats":["UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"Un solo diseñador independiente creó un patrón que hoy usan miles de millones de personas al día.","note_en":"A single independent designer created a pattern billions of people now use every day."},{"id":"UX-0018","year":2009,"title":"Notificaciones push","title_en":"Push notifications","desc":"Apple introduce las notificaciones push en iOS, permitiendo que las apps alerten a los usuarios fuera de la propia app, cambiando fundamentalmente cómo funciona el reenganche (re-engagement) móvil.","desc_en":"Apple introduces push notifications on iOS, letting apps alert users outside the app itself — fundamentally changing how mobile re-engagement works.","cats":["UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"La base técnica de toda la economía de la atención móvil que vendría después.","note_en":"The technical foundation for the entire mobile attention economy that would follow."},{"id":"UX-0019","year":2009,"title":"Feedback háptico moderno","title_en":"Modern haptic feedback","desc":"Teléfonos como el Palm Pre y otros smartphones de la época comienzan a usar motores de vibración precisos para dar confirmación táctil de toques y eventos, sumando una capa física al UI táctil.","desc_en":"Phones like the Palm Pre and other contemporaries begin using precise vibration motors to give tactile confirmation of taps and events, adding a physical layer to touch UI.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Sentir un 'clic' que en realidad no existe físicamente: el placebo táctil bien diseñado.","note_en":"Feeling a 'click' that doesn't physically exist: the well-designed tactile placebo."},{"id":"TEC-0093","year":2009,"title":"Fitbit","title_en":"Fitbit","desc":"Se lanza el Fitbit Classic, marcando el inicio de la tendencia masiva de rastreadores de actividad física (fitness trackers) en el consumidor.","desc_en":"The Fitbit Classic launches, marking the start of the mass consumer trend of fitness trackers.","cats":["Wearables"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Timetoast - History of Wearable Tech"},{"id":"TEC-0094","year":2009,"title":"Foursquare y WhatsApp","title_en":"Foursquare and WhatsApp","desc":"Foursquare populariza la gamificación con check-ins, insignias y 'alcaldías'; se lanza WhatsApp, transformando la mensajería móvil.","desc_en":"Foursquare popularizes gamification with check-ins, badges and 'mayorships'; WhatsApp launches, transforming mobile messaging.","cats":["Social","Mobile","Gaming"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Smartico - History of Gamification"},{"id":"TEC-0095","year":2009,"title":"Bitcoin","title_en":"Bitcoin","desc":"Satoshi Nakamoto lanza Bitcoin, la primera criptomoneda descentralizada, inaugurando la era blockchain.","desc_en":"Satoshi Nakamoto launches Bitcoin, the first decentralized cryptocurrency, ushering in the blockchain era.","cats":["Software"],"importance":2,"region":"Desconocido (pseudónimo)","region_en":"Unknown (pseudonym)","note":"","note_en":"","source":"Conocimiento general verificado"},{"id":"PAT-0017","year":2010,"title":"Search Patterns (Morville y Callender)","title_en":"Search Patterns (Morville and Callender)","desc":"Peter Morville y Jeffery Callender recopilan y publican Search Patterns, un catálogo de patrones para diseñar experiencias de búsqueda y descubrimiento.","desc_en":"Peter Morville and Jeffery Callender collect and publish Search Patterns, a catalogue of patterns for designing search and discovery experiences.","cats":["Patrones","UX/UI"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"La búsqueda deja de ser una caja de texto y se entiende como un sistema de patrones.","note_en":"Search stops being just a text box and becomes a system of patterns."},{"id":"PAT-0018","year":2010,"title":"Dark Patterns (Harry Brignull)","title_en":"Dark Patterns (Harry Brignull)","desc":"Harry Brignull acuña el término 'dark patterns' y lanza un sitio que documenta trucos de interfaz diseñados para engañar a los usuarios: suscripciones difíciles de cancelar, casillas premarcadas, costos ocultos.","desc_en":"Harry Brignull coins the term 'dark patterns' and launches a site documenting interface tricks designed to deceive users: hard-to-cancel subscriptions, pre-ticked boxes, hidden costs.","cats":["Patrones","UX/UI"],"importance":2,"region":"Reino Unido","region_en":"United Kingdom","note":"El lado ético de los patrones: la misma estructura puede ayudar o manipular.","note_en":"The ethical side of patterns: the same structure can help or manipulate."},{"id":"DEV-0009","year":2010,"title":"Primer iPad","title_en":"First iPad","desc":"Apple lanza el iPad original, creando la categoría masiva de tablets y obligando al diseño de interfaz a pensar en lienzos táctiles mucho más grandes que un teléfono.","desc_en":"Apple launches the original iPad, creating the mass tablet category and forcing interface design to think in touch canvases far bigger than a phone.","cats":["Mobile","Hardware"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"El nacimiento del diseño 'responsive' pensado en tres tamaños: móvil, tablet y desktop.","note_en":"The birth of 'responsive' design thought out across three sizes: phone, tablet, and desktop."},{"id":"UX-0020","year":2010,"title":"Long press (mantener presionado)","title_en":"Long press","desc":"El long press se estandariza como gesto para menús contextuales y acciones secundarias, ampliando el set de gestos táctiles más allá del tap y el swipe.","desc_en":"Long press (press-and-hold) becomes standardized as a gesture for contextual menus and secondary actions, expanding the touch gesture set beyond tap and swipe.","cats":["UX/UI","Mobile"],"importance":2,"region":"Global","region_en":"Global","note":"El equivalente táctil del clic derecho de mouse: acciones 'ocultas' descubribles con tiempo, no con un botón extra.","note_en":"The touch equivalent of a mouse right-click: 'hidden' actions discoverable with time, not an extra button."},{"id":"UX-0021","year":2010,"title":"Scroll infinito","title_en":"Infinite scroll","desc":"Apps y feeds (primeros clientes móviles de Twitter/Facebook) adoptan el scroll infinito, cargando automáticamente más contenido al acercarse al final en lugar de paginar.","desc_en":"Apps and feeds (early mobile Twitter/Facebook clients) adopt infinite scroll, automatically loading more content near the bottom instead of paginating.","cats":["UX/UI","Mobile"],"importance":2,"region":"Global","region_en":"Global","note":"Uno de los patrones más debatidos de la UX moderna por su relación con el diseño adictivo.","note_en":"One of modern UX's most debated patterns, given its ties to addictive design."},{"id":"UX-0022","year":2010,"title":"Swipe-to-delete","title_en":"Swipe-to-delete","desc":"Apps de mail y listas popularizan un deslizamiento horizontal que revela una acción de eliminar, convirtiendo una tarea destructiva común en un gesto liviano y descubrible.","desc_en":"Mail and list apps popularize a horizontal swipe that reveals a delete action, turning a common destructive task into a light, discoverable gesture.","cats":["UX/UI","Mobile"],"importance":2,"region":"Global","region_en":"Global","note":"Ocultar una acción destructiva detrás de un gesto reduce el ruido visual sin perder funcionalidad.","note_en":"Hiding a destructive action behind a gesture reduces visual clutter without losing functionality."},{"id":"UX-0023","year":2010,"title":"Shake-to-undo","title_en":"Shake-to-undo","desc":"iOS introduce 'agitar para deshacer', usando el acelerómetro para disparar un cuadro de confirmación de deshacer, un ejemplo temprano de gestos de movimiento mapeados a acciones del sistema.","desc_en":"iOS introduces shake-to-undo, using the accelerometer to trigger an undo confirmation box — an early example of motion gestures mapped to system-level actions.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Un gesto físico poco descubrible: gran ejemplo de por qué el 'easter egg' no siempre es buena UX.","note_en":"A physical gesture with poor discoverability: a great example of why 'Easter eggs' aren't always good UX."},{"id":"TEC-0096","year":2010,"title":"Instagram","title_en":"Instagram","desc":"Kevin Systrom y Mike Krieger lanzan Instagram, popularizando el contenido visual y los filtros de fotos en redes sociales.","desc_en":"Kevin Systrom and Mike Krieger launch Instagram, popularizing visual content and photo filters on social media.","cats":["Social","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Telefónica - Social Networks"},{"id":"TEC-0097","year":2010,"title":"Gamificación entra al mainstream empresarial","title_en":"Gamification goes mainstream in business","desc":"Foursquare populariza badges y leaderboards en negocios; Gartner identifica la gamificación como tecnología emergente clave.","desc_en":"Foursquare popularizes badges and leaderboards in business; Gartner identifies gamification as a key emerging technology.","cats":["Gaming"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Spinify / Gamify.com - History of Gamification"},{"id":"UX-0027","year":2011,"title":"Interfaces basadas en tarjetas","title_en":"Card-based interfaces","desc":"Google (con Google+ y luego Android) populariza la 'tarjeta' como unidad de contenido autocontenida, un patrón que definiría más adelante el lenguaje visual de Material Design.","desc_en":"Google (with Google+ and later Android) popularizes the 'card' as a self-contained content unit, a pattern that would later define Material Design's visual language.","cats":["UX/UI","Patrones","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Las tarjetas resolvieron el problema de mostrar contenido heterogéneo de forma consistente en un solo feed.","note_en":"Cards solved the problem of showing heterogeneous content consistently within a single feed."},{"id":"PAT-0019","year":2011,"title":"Explosión de bibliotecas de patrones en la web","title_en":"Pattern libraries explode across the web","desc":"Las bibliotecas de patrones se multiplican en la web: algunas generales (UI Patterns), otras específicas por dispositivo (Android Patterns) y otras por tema (Dark Patterns), junto a galerías de inspiración de interfaces.","desc_en":"Pattern libraries multiply across the web: some general (UI Patterns), some device-specific (Android Patterns) and some topic-specific (Dark Patterns), alongside UI inspiration galleries.","cats":["Patrones","UX/UI","Web/Internet"],"importance":2,"region":"Global","region_en":"Global","note":"Cuando hay demasiados patrones, el nuevo reto pasa a ser curarlos.","note_en":"When there are too many patterns, the new challenge becomes curating them."},{"id":"UX-0024","year":2011,"title":"Swipe-to-archive","title_en":"Swipe-to-archive","desc":"Gmail y otras apps de correo extienden los gestos de deslizar agregando 'archivar' como alternativa a eliminar, reflejando un patrón de swipe contextual cada vez más maduro en interfaces de lista.","desc_en":"Gmail and other mail apps extend swipe gestures by adding 'archive' as an alternative to delete, reflecting an increasingly mature pattern of contextual swipe actions in list interfaces.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Un mismo gesto (swipe) puede significar cosas distintas según la app: la consistencia se vuelve un reto de diseño.","note_en":"The same gesture (swipe) can mean different things depending on the app: consistency becomes a design challenge."},{"id":"UX-0026","year":2011,"title":"Siri","title_en":"Siri","desc":"Apple lanza Siri como asistente de voz integrado en el iPhone 4S, masificando la interacción conversacional y por voz como una forma legítima de uso móvil cotidiano.","desc_en":"Apple launches Siri as a built-in voice assistant on the iPhone 4S, mainstreaming conversational, voice-first interaction as a legitimate everyday way to use a phone.","cats":["UX/UI","IA","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"El primer asistente de voz que millones de personas usaron simplemente por curiosidad, no por necesidad.","note_en":"The first voice assistant millions of people used purely out of curiosity, not necessity."},{"id":"TEC-0098","year":2011,"title":"Snapchat y primer Gamification Summit","title_en":"Snapchat and the first Gamification Summit","desc":"Se lanza Snapchat (contenido efímero); se celebra el primer Gamification Summit (GSummit) en San Francisco, consolidando la disciplina.","desc_en":"Snapchat launches (ephemeral content); the first Gamification Summit (GSummit) is held in San Francisco, consolidating the discipline.","cats":["Social","Gaming"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"EdTech Insiders / Growth Engineering"},{"id":"PAT-0020","year":2012,"title":"Mobile Design Pattern Gallery (Theresa Neil)","title_en":"Mobile Design Pattern Gallery (Theresa Neil)","desc":"Theresa Neil recopila y categoriza patrones móviles de iOS, Android y otras plataformas en Mobile Design Pattern Gallery.","desc_en":"Theresa Neil collects and categorizes mobile patterns from iOS, Android and other platforms in Mobile Design Pattern Gallery.","cats":["Patrones","UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Navegación, formularios, tablas, búsqueda: el primer gran catálogo visual de patrones móviles.","note_en":"Navigation, forms, tables, search: the first big visual catalogue of mobile patterns."},{"id":"UX-0028","year":2012,"title":"Google Now","title_en":"Google Now","desc":"Google Now introduce información predictiva basada en tarjetas, mostrada proactivamente antes de que el usuario busque, un ejemplo temprano y masivo de UX anticipatoria y contextual.","desc_en":"Google Now introduces predictive, card-based information surfaced proactively before the user searches — an early, mainstream example of anticipatory, contextual UX.","cats":["UX/UI","IA","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"El primer intento serio de una interfaz que 'sabe lo que necesitas antes de que lo pidas'.","note_en":"The first serious attempt at an interface that 'knows what you need before you ask for it.'"},{"id":"UX-0029","year":2012,"title":"Navegación por swipe desde el borde","title_en":"Edge-swipe navigation","desc":"Apps y gestos del sistema comienzan a usar deslizamientos desde el borde de la pantalla (por ejemplo, 'atrás') como forma de agregar navegación sin ocupar espacio visible en pantalla.","desc_en":"Apps and system gestures begin using swipes from the screen's edge (for example, 'back') as a way to add navigation without taking up visible screen space.","cats":["UX/UI","Mobile"],"importance":1,"region":"Global","region_en":"Global","note":"Navegación invisible hasta que se necesita: el borde de la pantalla se vuelve territorio funcional.","note_en":"Invisible navigation until you need it: the screen's edge becomes functional territory."},{"id":"UX-0030","year":2012,"title":"Diseño mobile responsive","title_en":"Responsive mobile design","desc":"Los principios de diseño web responsive de Ethan Marcotte alcanzan adopción masiva a medida que crece el tráfico móvil, imponiendo 'mobile-first', grillas fluidas y breakpoints como práctica estándar.","desc_en":"Ethan Marcotte's responsive web design principles reach mass adoption as mobile traffic grows, cementing 'mobile-first' thinking, fluid grids, and breakpoints as standard practice.","cats":["UX/UI","Web/Internet","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"El momento en que diseñar 'para una pantalla' dejó de tener sentido como enfoque de trabajo.","note_en":"The moment designing 'for one screen' stopped making sense as a way of working."},{"id":"TEC-0099","year":2012,"title":"Oculus Rift (Kickstarter) y Duolingo","title_en":"Oculus Rift (Kickstarter) and Duolingo","desc":"Oculus lanza su campaña de Kickstarter revitalizando la realidad virtual moderna; Duolingo lanza su beta, demostrando el poder de la gamificación en educación con rachas, XP y leaderboards.","desc_en":"Oculus launches its Kickstarter campaign, reviving modern virtual reality; Duolingo launches its beta, showing the power of gamification in education with streaks, XP and leaderboards.","cats":["VR/AR","Gaming"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"AllVirtualReality / Smartico"},{"id":"TEC-0100","year":2012,"title":"Pebble Smartwatch","title_en":"Pebble Smartwatch","desc":"Pebble lanza su smartwatch vía Kickstarter, recaudando más de 10 millones de dólares y marcando el inicio de la era moderna de los relojes inteligentes.","desc_en":"Pebble launches its smartwatch via Kickstarter, raising over 10 million dollars and marking the start of the modern smartwatch era.","cats":["Wearables"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"SPLITFIT - Wearable Technology History"},{"id":"PAT-0021","year":2013,"title":"Android Design Patterns (Greg Nudelman)","title_en":"Android Design Patterns (Greg Nudelman)","desc":"Greg Nudelman publica Android Design Patterns, enfocado en patrones de interacción específicos para la plataforma Android.","desc_en":"Greg Nudelman publishes Android Design Patterns, focused on interaction patterns specific to the Android platform.","cats":["Patrones","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Cada plataforma empieza a exigir su propio vocabulario de patrones.","note_en":"Each platform starts demanding its own pattern vocabulary."},{"id":"PAT-0022","year":2013,"title":"Atomic Design: conceptos y Pattern Lab","title_en":"Atomic Design: concepts and Pattern Lab","desc":"Brad Frost presenta en conferencias los conceptos y la filosofía de Atomic Design (átomos, moléculas, organismos, plantillas, páginas), y la herramienta Pattern Lab empieza a ser adoptada por equipos internos de organizaciones.","desc_en":"Brad Frost presents the concepts and philosophy of Atomic Design (atoms, molecules, organisms, templates, pages) at conferences, and the Pattern Lab tool starts being adopted by in-house teams.","cats":["Patrones","UX/UI"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Una metáfora química que le dio a los equipos un lenguaje común para hablar de componentes.","note_en":"A chemistry metaphor that gave teams a shared language for talking about components."},{"id":"UX-0031","year":2013,"title":"Touch ID","title_en":"Touch ID","desc":"Apple introduce el sensor de huella Touch ID en el iPhone 5S, reemplazando la entrada de PIN por autenticación biométrica integrada directamente en el botón de inicio.","desc_en":"Apple introduces the Touch ID fingerprint sensor on the iPhone 5S, replacing PIN entry with biometric authentication built directly into the home button.","cats":["UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"La biometría deja de ser ciencia ficción y se vuelve un gesto cotidiano: apoyar el pulgar.","note_en":"Biometrics stop being science fiction and become an everyday gesture: resting your thumb."},{"id":"UX-0032","year":2013,"title":"Interfaces con parallax","title_en":"Parallax interfaces","desc":"El rediseño de iOS 7 introduce un efecto parallax donde íconos y fondo se desplazan según la inclinación del dispositivo, agregando una sensación sutil de profundidad a un lenguaje visual recién 'aplanado'.","desc_en":"iOS 7's redesign introduces a parallax effect where icons and wallpaper shift relative to the device's tilt, adding a subtle sense of depth to a newly 'flattened' visual language.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Profundidad simulada con movimiento, justo cuando el diseño visual abandonaba las sombras y texturas skeuomórficas.","note_en":"Simulated depth through motion, right as visual design was abandoning skeuomorphic shadows and textures."},{"id":"TEC-0101","year":2013,"title":"Google Glass y Samsung Galaxy Gear","title_en":"Google Glass and Samsung Galaxy Gear","desc":"Google presenta Google Glass (gafas inteligentes con realidad aumentada) y Samsung lanza el Galaxy Gear, uno de los primeros smartwatches masivos.","desc_en":"Google unveils Google Glass (smart glasses with augmented reality) and Samsung launches the Galaxy Gear, one of the first mass-market smartwatches.","cats":["Wearables","VR/AR"],"importance":2,"region":"Estados Unidos / Corea del Sur","region_en":"United States / South Korea","note":"","note_en":"","source":"Timetoast / Wikipedia - Wearable Technology"},{"id":"UX-0034","year":2014,"title":"Floating Action Button (FAB)","title_en":"Floating Action Button (FAB)","desc":"Material Design de Google introduce el FAB, un botón circular elevado reservado para la acción más importante de una pantalla, con posición y jerarquía visual estandarizadas.","desc_en":"Google's Material Design introduces the FAB, an elevated circular button reserved for a screen's single most important action, with standardized position and visual hierarchy.","cats":["UX/UI","Patrones","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Un solo botón, una sola acción: el FAB fuerza a priorizar en el diseño de cada pantalla.","note_en":"One button, one action: the FAB forces every screen's design to prioritize."},{"id":"PAT-0023","year":2014,"title":"Google lanza Material Design","title_en":"Google launches Material Design","desc":"Google lanza el sitio de Material Design con patrones, principios y una filosofía de componentes para usar en web, móvil y otros dispositivos.","desc_en":"Google launches the Material Design site with patterns, principles and a component philosophy for use across web, mobile and other devices.","cats":["Patrones","UX/UI","Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"Un design system público de una gran empresa, pensado para que otros lo adopten.","note_en":"A big company's public design system, designed for others to adopt."},{"id":"UX-0035","year":2014,"title":"Material Motion","title_en":"Material Motion","desc":"Material Design formaliza principios de movimiento (transiciones con significado, efecto ripple) que explican cómo los objetos se mueven y transforman entre estados de la interfaz.","desc_en":"Material Design formalizes motion principles (meaningful transitions, the ripple effect) that explain how objects move and transform between interface states.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"El movimiento deja de ser decoración y pasa a comunicar relaciones jerárquicas entre elementos.","note_en":"Motion stops being decoration and starts communicating hierarchical relationships between elements."},{"id":"UX-0036","year":2014,"title":"Microinteracciones","title_en":"Microinteractions","desc":"El concepto de 'microinteracciones' (popularizado por el libro de Dan Saffer) impulsa a pensar pequeños momentos de feedback —switches, pull-to-refresh, likes— como oportunidades reales de diseño.","desc_en":"The concept of 'microinteractions' (popularized by Dan Saffer's book) pushes designers to treat small feedback moments — switches, pull-to-refresh, likes — as real design opportunities.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Los detalles pequeños —un ícono de corazón que 'rebota'— se vuelven disciplina de diseño propia.","note_en":"Small details — a heart icon that 'bounces' — become their own design discipline."},{"id":"UX-0037","year":2014,"title":"Búsqueda por voz","title_en":"Voice search","desc":"La búsqueda por voz se convierte en una entrada móvil de primera clase a medida que Google y otros mejoran el reconocimiento de voz en el dispositivo más allá de comandos simples.","desc_en":"Voice search becomes a first-class mobile input as Google and others improve on-device voice recognition beyond simple commands.","cats":["UX/UI","Mobile"],"importance":1,"region":"Global","region_en":"Global","note":"Hablarle al teléfono deja de sentirse raro y empieza a sentirse simplemente más rápido.","note_en":"Talking to your phone stops feeling strange and starts feeling simply faster."},{"id":"TEC-0102","year":2014,"title":"Facebook adquiere Oculus VR","title_en":"Facebook acquires Oculus VR","desc":"Facebook compra Oculus VR por 2 mil millones de dólares, validando la realidad virtual como apuesta estratégica de las grandes tecnológicas.","desc_en":"Facebook buys Oculus VR for 2 billion dollars, validating virtual reality as a strategic bet for big tech.","cats":["VR/AR"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"AllVirtualReality - VR History"},{"id":"TEC-0103","year":2014,"title":"Apple Watch (anuncio)","title_en":"Apple Watch (announcement)","desc":"Apple presenta el Apple Watch, su primer dispositivo wearable, integrando salud, notificaciones y pagos en la muñeca.","desc_en":"Apple unveils the Apple Watch, its first wearable device, integrating health, notifications and payments on the wrist.","cats":["Wearables"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"RFID Union / SPLITFIT"},{"id":"PAT-0024","year":2015,"title":"Calm Technology (Amber Case)","title_en":"Calm Technology (Amber Case)","desc":"Amber Case desarrolla principios y patrones para un diseño no intrusivo, especialmente en el contexto del Internet de las Cosas y los dispositivos conectados.","desc_en":"Amber Case develops principles and patterns for non-intrusive design, especially in the context of the Internet of Things and connected devices.","cats":["Patrones","UX/UI"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Diseñar para la periferia de la atención, no para robarla.","note_en":"Designing for the periphery of attention, not to steal it."},{"id":"PAT-0025","year":2015,"title":"Designing Social Interfaces, 2.ª edición","title_en":"Designing Social Interfaces, 2nd edition","desc":"Erin Malone y Christian Crumlish reescriben su libro de patrones sociales para actualizarlo a contextos móviles y empresariales.","desc_en":"Erin Malone and Christian Crumlish rewrite their social patterns book to update it for mobile and enterprise contexts.","cats":["Patrones","UX/UI","Social"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Los patrones también caducan: hay que revisarlos cuando cambian los dispositivos.","note_en":"Patterns expire too: they need revisiting when devices change."},{"id":"PAT-0026","year":2015,"title":"Responsive Design: Patterns & Principles (Ethan Marcotte)","title_en":"Responsive Design: Patterns & Principles (Ethan Marcotte)","desc":"Ethan Marcotte publica patrones y principios para diseño responsive, enfocados en construir sistemas de componentes flexibles en lugar de páginas fijas.","desc_en":"Ethan Marcotte publishes patterns and principles for responsive design, focused on building flexible component systems rather than fixed pages.","cats":["Patrones","UX/UI","Web/Internet"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Nota de investigación: la infografía original lo ubica en 2016, pero el libro (A Book Apart) se publicó en 2015; se ajustó el año.","note_en":"Research note: the original infographic places it in 2016, but the book (A Book Apart) was published in 2015; the year was adjusted."},{"id":"DEV-0010","year":2015,"title":"Apple Watch","title_en":"Apple Watch","desc":"Apple lanza su primer wearable, el Apple Watch, llevando pantalla táctil, Digital Crown y feedback háptico a la muñeca y expandiendo el diseño UX hacia pantallas diminutas.","desc_en":"Apple launches its first wearable, the Apple Watch, bringing a touchscreen, Digital Crown, and haptic feedback to the wrist and extending UX design onto tiny screens.","cats":["Wearables","Hardware"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Diseñar para una pantalla de 4cm exige repensar cada patrón táctil desde cero.","note_en":"Designing for a 4cm screen forces every touch pattern to be rethought from scratch."},{"id":"UX-0033","year":2015,"title":"Peek & Pop","title_en":"Peek & Pop","desc":"Con 3D Touch en el iPhone 6s, Apple introduce Peek & Pop: presionar con fuerza sobre un elemento muestra una vista previa ('peek') y presionar más fuerte la abre por completo ('pop').","desc_en":"With 3D Touch on the iPhone 6s, Apple introduces Peek & Pop: pressing firmly on an item shows a preview ('peek'), and pressing harder opens it fully ('pop').","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Nota de investigación: el archivo original ubicaba este hito en 2013, pero Peek & Pop se lanzó junto con 3D Touch en 2015; se corrigió el año para mantener precisión histórica.","note_en":"Research note: the original source file placed this milestone in 2013, but Peek & Pop actually launched with 3D Touch in 2015; the year was corrected here for historical accuracy."},{"id":"UX-0038","year":2015,"title":"Digital Crown","title_en":"Digital Crown","desc":"La corona digital del Apple Watch, un dial físico giratorio, se diseña para hacer scroll y zoom en una pantalla diminuta sin que el dedo tape la vista, uniendo la herencia analógica del reloj con la UX digital.","desc_en":"The Apple Watch's Digital Crown, a physical rotating dial, is designed to scroll and zoom on a tiny screen without a finger blocking the view, merging the watch's analog heritage with digital UX.","cats":["UX/UI","Wearables"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Resolver 'dedo gordo, pantalla chica' recurriendo a un control mecánico, no solo táctil.","note_en":"Solving 'big finger, small screen' by reaching for a mechanical control, not just a touch one."},{"id":"UX-0039","year":2015,"title":"Force Touch","title_en":"Force Touch","desc":"Apple Watch y los trackpads de MacBook introducen Force Touch, una capa sensible a la presión que agrega una dimensión de entrada de 'clic más fuerte' más allá de la ubicación del toque.","desc_en":"The Apple Watch and MacBook trackpads introduce Force Touch, a pressure-sensitive layer that adds a 'press harder' input dimension beyond just touch location.","cats":["UX/UI","Mobile"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"Presión como nueva variable de entrada: no solo dónde tocás, sino con cuánta fuerza.","note_en":"Pressure as a new input variable: not just where you touch, but how hard."},{"id":"UX-0040","year":2015,"title":"3D Tou
