<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Historia del diseño digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#ECECEC; --surface:#FBFBFB; --panel:#FFFFFF; --soft:#F1F1F1; --soft-2:#E9E9E9;
  --line:rgba(0,0,0,0.06); --text:#141414; --text-dim:#6E6E73; --text-faint:#9A9AA0;
  --ink:#111111; --ink-text:#FFFFFF; --mark:#FFF0A6;
  --shadow:0 1px 2px rgba(0,0,0,0.03), 0 14px 34px -12px rgba(0,0,0,0.12);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,0.25);
  --c-ux:#6D5BD0; --c-pat:#D9454B; --c-mobile:#2F74C8; --c-hardware:#5B6475; --c-software:#4F46E5;
  --c-web:#0D857A; --c-social:#C9650C; --c-wearables:#C93A83; --c-vrar:#8E44C9; --c-gaming:#A86C14; --c-ia:#0E86A6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0E0E10; --surface:#18181B; --panel:#212125; --soft:#2A2A2F; --soft-2:#33333A;
    --line:rgba(255,255,255,0.06); --text:#F4F4F5; --text-dim:#A1A1AA; --text-faint:#75757D;
    --ink:#F4F4F5; --ink-text:#111111; --mark:#6B5A12;
    --shadow:0 1px 0 rgba(255,255,255,0.03) inset, 0 14px 34px -12px rgba(0,0,0,0.6);
    --shadow-lg:0 30px 80px -20px rgba(0,0,0,0.8);
    --c-ux:#A99BFF; --c-pat:#FF8A8E; --c-mobile:#6FA8F0; --c-hardware:#A3ACBD; --c-software:#8E88FF;
    --c-web:#3CCFC0; --c-social:#FFA552; --c-wearables:#FF7EBF; --c-vrar:#C38BF2; --c-gaming:#F2C04D; --c-ia:#4FC9E8;
  }
}
:root[data-theme="dark"]{
  --page:#0E0E10; --surface:#18181B; --panel:#212125; --soft:#2A2A2F; --soft-2:#33333A;
  --line:rgba(255,255,255,0.06); --text:#F4F4F5; --text-dim:#A1A1AA; --text-faint:#75757D;
  --ink:#F4F4F5; --ink-text:#111111; --mark:#6B5A12;
  --shadow:0 1px 0 rgba(255,255,255,0.03) inset, 0 14px 34px -12px rgba(0,0,0,0.6);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,0.8);
  --c-ux:#A99BFF; --c-pat:#FF8A8E; --c-mobile:#6FA8F0; --c-hardware:#A3ACBD; --c-software:#8E88FF;
  --c-web:#3CCFC0; --c-social:#FFA552; --c-wearables:#FF7EBF; --c-vrar:#C38BF2; --c-gaming:#F2C04D; --c-ia:#4FC9E8;
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
body{
  background:radial-gradient(120% 80% at 50% 0%, var(--surface) 0%, var(--page) 70%);
  background-color:var(--page);
  color:var(--text);
  font-family:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-feature-settings:'tnum' 1;
  overflow:hidden; padding:20px;
  -webkit-font-smoothing:antialiased;
}
button,select,input{font-family:inherit; color:inherit;}

/* ===== APP SURFACE ===== */
.app{
  height:100%; display:flex; flex-direction:column;
  background:var(--surface); border-radius:40px;
  box-shadow:var(--shadow-lg);
  overflow:hidden; position:relative;
}

/* ===== HEADER ===== */
header{
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:24px 36px 4px;
}
.brand{display:flex; flex-direction:column; gap:4px; min-width:0;}
.header-meta{font-size:15px; color:var(--text-dim);}
.brand h1{font-size:32px; font-weight:500; letter-spacing:-0.01em; margin:0; line-height:1.15;}
.header-right,.settings-group{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.icon-btn{
  width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
  background:var(--panel); box-shadow:var(--shadow); color:var(--text);
  display:flex; align-items:center; justify-content:center;
  transition:transform .15s ease;
}
.icon-btn:hover{transform:translateY(-1px);}
.icon-btn svg{width:22px; height:22px;}
.lang-pill{
  display:flex; align-items:center; gap:2px; height:56px; padding:6px;
  background:var(--panel); box-shadow:var(--shadow); border-radius:999px;
}
.lang-pill button{
  border:none; background:transparent; height:100%; padding:0 16px; border-radius:999px;
  font-size:14px; font-weight:500; color:var(--text-faint); cursor:pointer;
}
.lang-pill button.active{background:var(--soft); color:var(--text);}

/* ===== CONTROLS ===== */
.controls{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:14px 36px 4px;
}
.search-box{
  display:flex; align-items:center; gap:10px; height:52px; padding:0 20px;
  background:var(--soft); border-radius:999px; flex:1 1 200px; min-width:180px; max-width:300px;
  color:var(--text-faint);
}
.search-box input{border:none; outline:none; background:transparent; width:100%; height:100%; font-size:16px; color:var(--text);}
.search-box input::placeholder{color:var(--text-faint);}

.toggle-group{
  display:flex; gap:4px; padding:6px; height:62px; align-items:center;
  background:var(--panel); border-radius:999px; box-shadow:var(--shadow);
}
.toggle-btn{
  display:flex; align-items:center; gap:9px; height:50px; padding:0 20px;
  border:none; border-radius:999px; background:transparent; cursor:pointer;
  font-size:16px; font-weight:500; color:var(--text-faint); white-space:nowrap;
  transition:background .15s ease, color .15s ease;
}
.toggle-btn .dot{width:10px; height:10px; border-radius:50%; background:var(--btn-color); opacity:.45; transition:opacity .15s ease;}
.toggle-btn:hover{color:var(--text-dim);}
.toggle-btn.active{background:var(--soft); color:var(--text);}
.toggle-btn.active .dot{opacity:1;}

.more-wrap{position:relative;}
.more-btn, .region-select-wrap{
  display:flex; align-items:center; gap:9px; height:62px; padding:0 22px;
  background:var(--panel); border:none; border-radius:999px; box-shadow:var(--shadow);
  font-size:16px; font-weight:500; color:var(--text-dim); cursor:pointer; white-space:nowrap;
}
.more-btn:hover{color:var(--text);}
.more-btn.has-active{color:var(--text);}
.more-count{
  background:var(--ink); color:var(--ink-text); font-size:12px; font-weight:600;
  border-radius:999px; min-width:20px; height:20px; padding:0 6px;
  display:flex; align-items:center; justify-content:center;
}
.chev{transition:transform .15s ease;}
.more-wrap.open .chev{transform:rotate(180deg);}
.more-dropdown{
  position:absolute; top:calc(100% + 10px); left:0; z-index:50; width:270px;
  background:var(--panel); border-radius:24px; padding:10px; box-shadow:var(--shadow-lg);
  display:none; flex-direction:column; gap:2px;
}
.more-wrap.open .more-dropdown{display:flex;}
.check-row{
  display:flex; align-items:center; gap:12px; width:100%; padding:11px 12px;
  border:none; background:transparent; border-radius:14px; cursor:pointer; text-align:left;
  font-size:15px; color:var(--text-dim);
}
.check-row:hover{background:var(--soft);}
.check-row .box{
  width:20px; height:20px; border-radius:7px; flex-shrink:0;
  background:var(--soft-2); display:flex; align-items:center; justify-content:center;
}
.check-row .box svg{display:none; width:12px; height:12px;}
.check-row.checked{color:var(--text);}
.check-row.checked .box{background:var(--chk-color);}
.check-row.checked .box svg{display:block;}
.check-row .cnt{margin-left:auto; font-size:13px; color:var(--text-faint);}

.region-select-wrap{cursor:default; color:var(--text-faint);}
.region-select-wrap select{
  border:none; outline:none; background:transparent; cursor:pointer;
  font-size:16px; font-weight:500; color:var(--text-dim); max-width:170px;
}
.region-select-wrap select option{background:var(--panel); color:var(--text);}

.clear-btn{
  height:52px; padding:0 18px; border:none; background:transparent; border-radius:999px;
  font-size:15px; font-weight:500; color:var(--text-faint); cursor:pointer;
}
.clear-btn:hover{color:var(--text); background:var(--soft);}

/* ===== SECTION HEAD ===== */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:16px 36px 0;
}
.section-head h2{margin:0; font-size:20px; font-weight:500;}
.result-count{font-size:17px; color:var(--text-faint);}

/* ===== TIMELINE ===== */
.timeline-wrap{position:relative; flex:1; min-height:0; display:flex; flex-direction:column; padding-top:14px;}
.scroll-progress-wrap{position:absolute; top:8px; left:36px; right:36px; height:4px; background:var(--soft); border-radius:999px;}
.scroll-progress-bar{height:100%; width:0; background:var(--ink); border-radius:999px; transition:width .08s linear;}
.scroll-position-label{
  position:absolute; top:0px; left:50%; transform:translateX(-50%);
  font-size:12px; font-weight:500; color:var(--text-dim);
  background:var(--surface); padding:2px 10px; border-radius:999px;
}
.timeline-scroll{
  flex:1; overflow-x:auto; overflow-y:hidden; padding:0 36px;
  scrollbar-width:none;
}
.timeline-scroll::-webkit-scrollbar{display:none;}
.timeline-track{position:relative; display:flex; align-items:stretch; height:var(--track-h,480px); width:max-content;}
.spine{position:absolute; left:0; right:0; top:50%; height:2px; background:var(--soft-2); border-radius:2px;}

.event-col{position:relative; display:flex; flex-direction:column; width:280px; flex-shrink:0; height:100%; z-index:1;}
.col-half{height:50%; display:flex; flex-direction:column; align-items:center; position:relative;}
.col-half.half-top{justify-content:flex-end;}
.col-half.half-bottom{justify-content:flex-start;}
.event-col.top .half-top .card-slot{margin-bottom:calc(var(--conn-h,26px) + 10px);}
.event-col.bottom .half-bottom .card-slot{margin-top:calc(var(--conn-h,26px) + 10px);}
.connector{position:absolute; left:50%; width:2px; transform:translateX(-50%); background:var(--soft-2);}
.half-top .connector{bottom:0; height:calc(var(--conn-h,26px) + 10px);}
.half-bottom .connector{top:0; height:calc(var(--conn-h,26px) + 10px);}

.node{
  position:absolute; left:50%; width:16px; height:16px; border-radius:50%;
  background:var(--node-color); box-shadow:0 0 0 5px var(--panel), 0 4px 14px rgba(0,0,0,0.15);
  z-index:3; cursor:pointer;
}
.half-top .node{bottom:0; transform:translate(-50%,50%);}
.half-bottom .node{top:0; transform:translate(-50%,-50%);}
.node.imp-3{width:22px; height:22px;}

.card-slot{width:100%; display:flex; justify-content:center;}
.card{
  position:relative; width:266px; padding:14px 16px 14px 14px;
  background:var(--panel); border-radius:28px; box-shadow:var(--shadow);
  display:flex; gap:12px; align-items:flex-start; cursor:pointer;
  transition:transform .16s ease;
}
.card:hover{transform:translateY(-3px);}
.card-icon{
  width:44px; height:44px; border-radius:15px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--c) 14%, var(--panel)); color:var(--c);
}
.card-icon svg{width:22px; height:22px;}
.card-body{min-width:0; flex:1;}
.card-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:4px;}
.card-cat{font-size:15px; font-weight:500; color:var(--c); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card-cat .more{color:var(--text-faint); font-weight:400;}
.card .title{font-size:15px; line-height:1.3; color:var(--text-dim); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
.card-year{font-size:17px; font-weight:500; color:var(--text); flex-shrink:0;}
.card-imp{display:flex; gap:3px; margin-top:7px;}
.card-imp i{width:6px; height:6px; border-radius:50%; background:var(--soft-2);}
.card-imp i.on{background:var(--c);}

.era-marker{
  position:relative; flex-shrink:0; width:150px; z-index:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.era-marker .year-big{
  font-size:40px; font-weight:500; line-height:1; letter-spacing:-0.02em;
  background:var(--surface); padding:4px 10px;
}
.era-marker .era-label{
  font-size:13px; color:var(--text-faint); text-align:center; max-width:136px;
  line-height:1.3; margin-top:6px; background:var(--surface);
}
.empty-state{position:relative; z-index:1; padding:24px 32px; text-align:center; color:var(--text-dim); font-size:17px; align-self:center; background:var(--surface); border-radius:24px;}

mark{background:var(--mark); color:inherit; border-radius:4px; padding:0 2px;}

/* ===== YEAR RANGE ===== */
.year-range{padding:8px 36px 14px;}
.year-range-labels{display:flex; justify-content:space-between; align-items:flex-end;}
.year-range-side{display:flex; flex-direction:column; gap:2px;}
.year-range-side.to{align-items:flex-end;}
.year-range-eyebrow{font-size:14px; color:var(--text-faint);}
.year-range-value{font-size:26px; font-weight:500; line-height:1;}
.range-slider{position:relative; height:40px; margin:6px 0 2px;}
.range-track-bg{position:absolute; top:50%; left:0; right:0; height:6px; transform:translateY(-50%); background:var(--soft-2); border-radius:999px;}
.range-track-fill{position:absolute; top:50%; height:6px; transform:translateY(-50%); background:var(--ink); border-radius:999px;}
.range-era-tick{
  position:absolute; top:50%; width:8px; height:8px; border-radius:50%;
  transform:translate(-50%,-50%); background:var(--surface); box-shadow:0 0 0 2px var(--text-faint);
  z-index:2; cursor:pointer;
}
.range-era-labels{position:relative; height:16px; margin-top:4px;}
.range-era-label{
  position:absolute; transform:translateX(-50%); font-size:12px; color:var(--text-faint);
  white-space:nowrap; cursor:pointer;
}
.range-era-label:hover{color:var(--text);}
.range-slider input[type="range"]{
  position:absolute; inset:0; width:100%; height:40px; margin:0; background:transparent;
  -webkit-appearance:none; appearance:none; pointer-events:none;
}
.range-slider input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
  background:var(--ink); border:5px solid var(--panel); box-shadow:0 4px 14px rgba(0,0,0,0.25);
  cursor:pointer; pointer-events:auto; position:relative; z-index:3;
}
.range-slider input[type="range"]::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%; background:var(--ink); border:5px solid var(--panel);
  box-shadow:0 4px 14px rgba(0,0,0,0.25); cursor:pointer; pointer-events:auto;
}
.range-slider input[type="range"]::-webkit-slider-runnable-track{background:transparent;}
.range-slider input[type="range"]::-moz-range-track{background:transparent;}
footer{font-size:12px; color:var(--text-faint); text-align:center; margin-top:4px;}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
  padding:24px; background:rgba(20,20,24,0.35); backdrop-filter:blur(6px);
}
.modal-overlay.open{display:flex;}
.modal-card{
  position:relative; width:100%; max-width:540px; max-height:85vh; overflow-y:auto;
  background:var(--surface); border-radius:40px; padding:32px; box-shadow:var(--shadow-lg);
  animation:modalIn .18s ease;
}
@keyframes modalIn{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;}}
.modal-close{
  position:absolute; top:24px; right:24px; width:48px; height:48px; border-radius:50%;
  border:none; background:var(--panel); box-shadow:var(--shadow); color:var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.modal-head{display:flex; align-items:center; gap:16px; margin-bottom:22px; padding-right:56px;}
.modal-icon{
  width:64px; height:64px; border-radius:22px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--c) 14%, var(--panel)); color:var(--c);
}
.modal-icon svg{width:30px; height:30px;}
.modal-date{font-size:15px; color:var(--text-dim);}
.modal-year{font-size:28px; font-weight:500; line-height:1.1;}
.modal-title{font-size:26px; font-weight:500; line-height:1.2; margin:0 0 14px; letter-spacing:-0.01em;}
.modal-tags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.modal-tags .tag{
  font-size:14px; font-weight:500; padding:6px 14px; border-radius:999px;
  color:var(--c); background:color-mix(in srgb, var(--c) 12%, var(--panel));
}
.modal-desc{font-size:17px; line-height:1.6; margin:0 0 18px; color:var(--text);}
.modal-note{
  background:var(--panel); box-shadow:var(--shadow); border-radius:24px;
  padding:16px 18px; margin:0 0 20px; font-size:15px; line-height:1.55; color:var(--text-dim);
}
.modal-note b{display:block; color:var(--text); font-weight:500; margin-bottom:4px;}
.modal-meta{display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--text-faint);}
.modal-meta b{color:var(--text-dim); font-weight:500;}

/* ===== FOCUS / RESPONSIVE ===== */
.card:focus-visible,.toggle-btn:focus-visible,.more-btn:focus-visible,.check-row:focus-visible,
.clear-btn:focus-visible,.icon-btn:focus-visible,.lang-pill button:focus-visible,.modal-close:focus-visible,
.range-era-label:focus-visible,.search-box:focus-within,.region-select-wrap:focus-within{outline:2px solid var(--text); outline-offset:3px;}

@media (max-width: 760px){
  body{padding:0;}
  .app{border-radius:0;}
  header{padding:18px 18px 4px; align-items:flex-start;}
  .brand h1{font-size:24px;}
  .header-meta{font-size:13px;}
  .icon-btn,.lang-pill{height:46px;}
  .icon-btn{width:46px;}
  .lang-pill button{padding:0 12px;}
  .controls{padding:12px 18px 4px; gap:8px;}
  .search-box{flex:1 1 0; min-width:0; height:46px; order:0;}
  .clear-btn{order:1; height:46px; padding:0 12px;}
  .toggle-group{order:2; flex:1 1 100%; overflow-x:auto; scrollbar-width:none; height:56px;}
  .toggle-group::-webkit-scrollbar{display:none;}
  .toggle-btn{height:44px; padding:0 16px; flex-shrink:0; font-size:15px;}
  .more-wrap{order:3;}
  .more-btn,.region-select-wrap{height:50px; padding:0 16px; font-size:15px;}
  .region-select-wrap{order:4; flex:1 1 0; min-width:0;}
  .region-select-wrap select{width:100%; max-width:100%; font-size:15px;}
  .section-head{padding:14px 18px 0;}
  .section-head h2{font-size:18px;}
  .result-count{font-size:15px;}
  .timeline-scroll{padding:0 18px;}
  .scroll-progress-wrap{left:18px; right:18px;}
  .year-range{padding:10px 18px 12px;}
  .range-era-labels{display:none;}
  .year-range-value{font-size:22px;}
  .modal-card{padding:24px; border-radius:32px;}
  .modal-close{top:18px; right:18px;}
}
@media (max-height: 760px) and (min-width: 761px){
  header{padding-top:22px;}
  .section-head{padding-top:14px;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

/* ===== VIEW SWITCH (Explorar / Jugar) ===== */
.view-switch{
  display:flex; gap:4px; padding:6px; height:56px; align-items:center;
  background:var(--panel); border-radius:999px; box-shadow:var(--shadow);
}
.view-switch button{
  display:flex; align-items:center; gap:8px; height:44px; padding:0 18px;
  border:none; border-radius:999px; background:transparent; cursor:pointer;
  font-size:15px; font-weight:500; color:var(--text-faint);
}
.view-switch button svg{width:20px; height:20px;}
.view-switch button.active{background:var(--soft); color:var(--text);}
.view-switch button:disabled{opacity:.4; cursor:not-allowed;}
.view{display:flex; flex-direction:column; flex:1; min-height:0;}
.view[hidden]{display:none;}

/* ===== GAME VIEW ===== */
.game-view{overflow-y:auto; padding:14px 36px 28px;}
.gscreen{display:none; flex-direction:column; gap:20px; flex:1; width:100%; max-width:1280px; margin:0 auto;}
.gscreen.active{display:flex;}
.g-h2{font-size:24px; font-weight:500; margin:0; letter-spacing:-0.01em;}
.g-label{font-size:15px; color:var(--text-dim); margin:18px 0 10px;}
.g-sub{font-size:15px; color:var(--text-faint); margin:4px 0 0;}

.setup-grid{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:24px; align-items:start;}
.setup-grid.solo{grid-template-columns:minmax(0,1fr); width:100%; max-width:760px; margin:0 auto;}
.setup-grid.solo + .setup-foot{width:100%; max-width:760px; margin:4px auto 0;}
.panel{background:var(--panel); border-radius:32px; box-shadow:var(--shadow); padding:24px;}

.choice-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.choice{
  display:flex; gap:14px; align-items:flex-start; text-align:left; padding:16px;
  background:var(--surface); border:2px solid transparent; border-radius:24px; cursor:pointer;
  transition:border-color .15s ease, background .15s ease;
}
.choice:hover{background:var(--soft);}
.choice.selected{border-color:var(--text); background:var(--panel);}
.choice .ic{
  width:44px; height:44px; border-radius:15px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--c) 14%, var(--panel)); color:var(--c);
}
.choice .ic svg{width:22px; height:22px;}
.choice b{display:block; font-size:16px; font-weight:500; margin-bottom:2px;}
.choice small{display:block; font-size:14px; line-height:1.35; color:var(--text-dim);}

.seg{display:flex; gap:4px; padding:6px; background:var(--surface); border-radius:22px; flex-wrap:wrap;}
.seg button{
  flex:1 1 0; min-width:90px; border:none; background:transparent; border-radius:16px; padding:10px 12px;
  cursor:pointer; color:var(--text-dim); font-size:15px; font-weight:500; text-align:center;
}
.seg button small{display:block; font-size:12.5px; font-weight:400; color:var(--text-faint); margin-top:2px;}
.seg button.selected{background:var(--panel); color:var(--text); box-shadow:var(--shadow);}

/* players */
.players-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
.players-head .cnt{font-size:15px; color:var(--text-faint);}
.add-row{display:flex; gap:8px; margin-top:16px;}
.g-input{
  flex:1; min-width:0; height:50px; padding:0 18px; border:none; border-radius:999px;
  background:var(--soft); font-size:16px; color:var(--text); outline:none;
}
.g-input::placeholder{color:var(--text-faint);}
.g-input:focus{box-shadow:0 0 0 2px var(--text) inset;}
.btn-ink{
  height:50px; padding:0 22px; border:none; border-radius:999px; cursor:pointer;
  background:var(--ink); color:var(--ink-text); font-size:16px; font-weight:500; white-space:nowrap;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.btn-ink:disabled{opacity:.35; cursor:not-allowed;}
.btn-soft{
  height:46px; padding:0 18px; border:none; border-radius:999px; cursor:pointer;
  background:var(--soft); color:var(--text); font-size:15px; font-weight:500; white-space:nowrap;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.btn-soft:hover{background:var(--soft-2);}
.btn-soft:disabled{opacity:.4; cursor:not-allowed;}
.btn-ghost{height:42px; padding:0 14px; border:none; border-radius:999px; background:transparent; color:var(--text-dim); font-size:14.5px; cursor:pointer;}
.btn-ghost:hover{background:var(--soft); color:var(--text);}
.g-error{min-height:20px; font-size:14px; color:var(--c-pat); margin:8px 4px 0;}
#groupMsg.ok{color:var(--text-dim);}

.player-list{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:6px;}
.player-item{display:flex; align-items:center; gap:10px; padding:6px 6px 6px 8px; border-radius:20px; background:var(--surface);}
.avatar{
  width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:600; color:var(--c); background:color-mix(in srgb, var(--c) 16%, var(--panel));
}
.player-item .pos{width:18px; text-align:center; font-size:13px; color:var(--text-faint);}
.player-item .nm{flex:1; min-width:0; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.player-item input.g-input{height:38px; font-size:15px;}
.mini{width:36px; height:36px; border:none; border-radius:50%; background:transparent; color:var(--text-faint); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.mini:hover{background:var(--soft); color:var(--text);}
.mini:disabled{opacity:.25; cursor:default; background:transparent;}
.mini svg{width:17px; height:17px;}
.empty-players{padding:18px; text-align:center; color:var(--text-faint); font-size:15px; background:var(--surface); border-radius:20px;}
.list-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;}
.groups-box{margin-top:18px; padding-top:16px; border-top:1px solid var(--line);}
.groups-box .row{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.groups-box select{
  flex:1; min-width:140px; height:46px; padding:0 14px; border:none; border-radius:999px; background:var(--soft);
  font-size:15px; color:var(--text);
}

.setup-foot{display:flex; align-items:center; justify-content:flex-end; gap:16px; flex-wrap:wrap; margin-top:4px;}
.setup-foot p{margin:0; color:var(--text-faint); font-size:15px;}
.setup-foot .btn-ink{height:58px; padding:0 34px; font-size:17px;}

/* ===== PLAY ===== */
.play-head{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.turn-box{display:flex; align-items:center; gap:14px; min-width:0;}
.turn-box .avatar{width:56px; height:56px; font-size:22px;}
.turn-box .k{font-size:15px; color:var(--text-dim);}
.turn-box .v{font-size:28px; font-weight:500; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.turn-box.bump{animation:bump .5s ease;}
@keyframes bump{0%{transform:scale(.96); opacity:.4;} 100%{transform:none; opacity:1;}}
.hud{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.chip{display:flex; flex-direction:column; padding:8px 16px; background:var(--panel); border-radius:20px; box-shadow:var(--shadow); min-width:84px;}
.chip .k{font-size:12.5px; color:var(--text-faint);}
.chip .v{font-size:19px; font-weight:500;}
.lives{display:flex; gap:4px; color:var(--c-pat); font-size:18px;}
.lives .lost{opacity:.2;}
.play-actions{display:flex; gap:6px; align-items:center;}
.quit-confirm{display:none; align-items:center; gap:6px; font-size:14.5px; color:var(--text-dim);}
.quit-confirm.show{display:flex;}

.play-body{display:grid; grid-template-columns:minmax(0,1fr); gap:20px; align-items:start;}
.play-body.with-board{grid-template-columns:minmax(0,1fr) 300px;}
.play-main{display:flex; flex-direction:column; gap:18px; min-width:0;}

.g-card{
  position:relative; background:var(--panel); border-radius:28px; box-shadow:var(--shadow);
  padding:20px; display:flex; gap:14px; align-items:flex-start; text-align:left; border:2px solid transparent;
}
.g-card .card-icon{width:52px; height:52px; border-radius:18px;}
.g-card .card-icon svg{width:26px; height:26px;}
.g-card .g-body{flex:1; min-width:0;}
.g-card .g-cat{font-size:15px; font-weight:500; color:var(--c);}
.g-card .g-title{font-size:21px; font-weight:500; line-height:1.25; margin:4px 0 8px;}
.g-card .g-desc{font-size:15.5px; line-height:1.5; color:var(--text-dim); margin:0;}
.g-card .g-year{
  position:absolute; top:16px; right:18px; font-size:26px; font-weight:500;
  padding:4px 14px; border-radius:999px; background:var(--soft); color:var(--text-faint);
}
.g-card .g-year.shown{color:var(--text);}
.g-card .g-hint{margin-top:10px; font-size:14px; color:var(--text-dim); background:var(--soft); display:inline-block; padding:5px 12px; border-radius:999px;}
.draw-wrap{display:flex; flex-direction:column; align-items:center; gap:8px;}
.draw-wrap .g-card{width:100%; max-width:640px; cursor:grab; touch-action:none; user-select:none;}
.draw-wrap .g-card.locked{cursor:default;}
.draw-wrap .g-card.dragging{opacity:.35;}
.draw-tip{font-size:14px; color:var(--text-faint); margin:0;}
.drag-ghost{position:fixed; z-index:150; pointer-events:none; transform:rotate(-2deg); box-shadow:var(--shadow-lg); max-width:420px;}
.drag-ghost .g-desc{display:none;}

.g-line-scroll{overflow-x:auto; padding:14px 4px 18px; scrollbar-width:thin;}
.g-line{display:flex; align-items:center; gap:0; width:max-content; position:relative; padding:0 6px; margin:0 auto;}
.g-line::before{content:''; position:absolute; left:0; right:0; top:50%; height:2px; background:var(--soft-2);}
.tl-slot{position:relative; z-index:1; width:56px; height:96px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
.tl-slot .plus{
  width:38px; height:38px; border-radius:50%; background:var(--panel); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--text-dim);
  transition:transform .12s ease, background .12s ease;
}
.tl-slot:hover .plus,.tl-slot.drag-hover .plus{transform:scale(1.18); background:var(--ink); color:var(--ink-text);}
.tl-slot.disabled{cursor:default;}
.tl-slot.disabled .plus{opacity:0;}
.tl-placed{
  position:relative; z-index:1; width:170px; flex-shrink:0; padding:12px 14px; background:var(--panel);
  border-radius:22px; box-shadow:var(--shadow); border:2px solid transparent;
}
.tl-placed .yr{font-size:20px; font-weight:500;}
.tl-placed .ti{font-size:13.5px; line-height:1.3; color:var(--text-dim); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.tl-placed .dot{position:absolute; top:14px; right:14px; width:10px; height:10px; border-radius:50%; background:var(--c);}
.tl-placed.new-ok{border-color:#2FA36B;}
.tl-placed.new-bad{border-color:var(--c-pat);}
.tl-placed.missed{opacity:.8;}
.tl-placed.missed::after{content:'✕'; position:absolute; bottom:10px; right:14px; font-size:12px; color:var(--c-pat);}

.pair{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:stretch;}
.pair .vs{align-self:center; width:48px; height:48px; border-radius:50%; background:var(--ink); color:var(--ink-text); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:500;}
.pair .g-card{cursor:pointer; transition:transform .15s ease, border-color .15s ease;}
.pair .g-card:hover{transform:translateY(-2px);}
.pair .g-card.done{cursor:default; transform:none;}
.g-card.right{border-color:#2FA36B;}
.g-card.wrong{border-color:var(--c-pat);}
.g-card .g-title{padding-right:96px;}

.next-row{display:flex; justify-content:center; min-height:58px;}
.next-row .btn-ink{height:58px; padding:0 32px; font-size:17px;}

.feedback{
  position:fixed; left:50%; bottom:36px; transform:translate(-50%, 30px); z-index:120;
  padding:14px 24px; border-radius:999px; background:var(--panel); box-shadow:var(--shadow-lg);
  font-size:17px; font-weight:500; opacity:0; pointer-events:none; transition:all .25s ease; max-width:min(92vw,640px); text-align:center;
}
.feedback.show{opacity:1; transform:translate(-50%,0);}
.feedback.good{color:#1F8A55;}
.feedback.bad{color:var(--c-pat);}
.feedback small{display:block; font-size:14px; font-weight:400; color:var(--text-dim);}

/* scoreboard */
.scoreboard{padding:18px; position:sticky; top:0;}
.scoreboard .sb-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.scoreboard h3{margin:0; font-size:18px; font-weight:500;}
.sb-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
.sb-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:18px; background:var(--surface); transition:background .2s ease;}
.sb-row.current{background:var(--soft); box-shadow:0 0 0 2px var(--text) inset;}
.sb-row .rk{width:18px; font-size:13px; color:var(--text-faint); text-align:center;}
.sb-row .avatar{width:32px; height:32px; font-size:13px;}
.sb-row .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px;}
.sb-row .streak{font-size:12.5px; color:var(--c-social);}
.sb-row .pts{font-size:19px; font-weight:500; min-width:28px; text-align:right;}
.sb-row .mini{width:30px; height:30px;}
.sb-edit{display:none; gap:2px;}
.scoreboard.editing .sb-edit{display:flex;}
.sb-add{display:none; gap:6px; margin-top:10px;}
.scoreboard.editing .sb-add{display:flex;}
.sb-add .g-input{height:42px; font-size:15px;}
.sb-add .btn-ink{height:42px; padding:0 14px; font-size:14.5px;}
.sb-rules{margin:12px 2px 0; font-size:13px; line-height:1.45; color:var(--text-faint);}

/* ===== END ===== */
.end-wrap{display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; padding-top:8px;}
.end-eyebrow{font-size:17px; color:var(--text-dim);}
.end-score{font-size:84px; font-weight:500; line-height:1; letter-spacing:-0.03em;}
.end-label{font-size:16px; color:var(--text-faint);}
.end-best{font-size:15px; color:var(--text-dim);}
.end-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.podium{display:flex; align-items:flex-end; justify-content:center; gap:14px; margin-top:6px;}
.pod{display:flex; flex-direction:column; align-items:center; gap:8px; width:150px;}
.pod .avatar{width:64px; height:64px; font-size:24px;}
.pod .nm{font-size:17px; font-weight:500; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pod .block{width:100%; border-radius:24px 24px 12px 12px; background:var(--panel); box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:12px;}
.pod .block .pl{font-size:30px; font-weight:500;}
.pod .block .pt{font-size:14px; color:var(--text-dim);}
.pod.p1 .block{height:150px; background:var(--ink); color:var(--ink-text);}
.pod.p1 .block .pt{color:inherit; opacity:.7;}
.pod.p2 .block{height:112px;}
.pod.p3 .block{height:86px;}
.crown{font-size:26px; line-height:1; margin-bottom:-4px;}
.results-table{width:100%; max-width:560px; border-collapse:separate; border-spacing:0 6px; font-size:15px;}
.results-table th{font-weight:400; color:var(--text-faint); font-size:13px; text-align:left; padding:0 12px;}
.results-table td{background:var(--panel); padding:10px 12px;}
.results-table td:first-child{border-radius:16px 0 0 16px;}
.results-table td:last-child{border-radius:0 16px 16px 0; text-align:right; font-weight:500;}
.results-table th:last-child{text-align:right;}
.review{width:100%; max-width:900px;}
.review h3{font-size:18px; font-weight:500; margin:6px 0 10px;}
.review-list{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
.review-item{
  display:flex; align-items:center; gap:8px; padding:8px 14px; border:none; border-radius:999px;
  background:var(--panel); box-shadow:var(--shadow); cursor:pointer; font-size:14px; color:var(--text);
}
.review-item .d{width:8px; height:8px; border-radius:50%;}
.review-item .d.ok{background:#2FA36B;} .review-item .d.bad{background:var(--c-pat);}
.review-item b{font-weight:500;}

#confettiCanvas{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:300;}

/* proyector: más grande en modo grupo */
.app.group-play .g-card .g-title{font-size:25px;}
.app.group-play .g-card .g-desc{font-size:17px;}
.app.group-play .turn-box .v{font-size:34px;}

.choice:focus-visible,.seg button:focus-visible,.btn-ink:focus-visible,.btn-soft:focus-visible,.btn-ghost:focus-visible,
.mini:focus-visible,.view-switch button:focus-visible,.tl-slot:focus-visible .plus,.pair .g-card:focus-visible,.review-item:focus-visible{outline:2px solid var(--text); outline-offset:3px;}

@media (max-width: 980px){
  .setup-grid{grid-template-columns:minmax(0,1fr);}
  .play-body.with-board{grid-template-columns:minmax(0,1fr);}
  .scoreboard{position:static;}
}
@media (max-width: 760px){
  header{flex-wrap:wrap;}
  .header-right{width:100%; justify-content:space-between;}
  .view-switch{height:46px; padding:4px;}
  .view-switch button{height:38px; padding:0 14px; font-size:14.5px;}
  .view-switch button svg{display:none;}
  .header-right{gap:6px;}
  .settings-group{gap:6px;}
  .game-view{padding:10px 18px 24px;}
  .choice-row{grid-template-columns:1fr;}
  .panel{padding:18px; border-radius:26px;}
  .pair{grid-template-columns:1fr;}
  .pair .vs{justify-self:center;}
  .g-card{padding:16px;}
  .g-card .g-title{font-size:18px;}
  .g-card .g-year{font-size:20px; top:12px; right:12px;}
  .end-score{font-size:64px;}
  .pod{width:104px;}
  .pod .avatar{width:50px; height:50px; font-size:19px;}
  .setup-foot .btn-ink{width:100%;}
  .feedback{bottom:20px;}
}

</style>
</head>
<body>
<div class="app">

<header>
  <div class="brand">
    <div class="header-meta" id="headerMeta"></div>
    <h1 id="titleText">Historia del diseño digital</h1>
  </div>
  <div class="header-right">
    <nav class="view-switch" id="viewSwitch" aria-label="Secciones"></nav>
    <div class="settings-group">
    <div class="lang-pill">
      <button id="langEs" class="active">ES</button>
      <button id="langEn">EN</button>
    </div>
    <button class="icon-btn" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema"></button>
  </div>
  </div>
</header>

<div class="view" id="viewExplore">
<div class="controls">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Buscar evento..." aria-label="Buscar evento">
  </div>

  <div class="toggle-group" id="mainToggles"></div>

  <div class="more-wrap" id="moreWrap">
    <button class="more-btn" id="moreBtn" aria-haspopup="true" aria-expanded="false">
      <span id="moreLabel">Más categorías</span>
      <span class="more-count" id="moreCount" style="display:none;">0</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="more-dropdown" id="moreDropdown"></div>
  </div>

  <div class="region-select-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
    <select id="regionSelect" aria-label="Región"></select>
  </div>

  <button class="clear-btn" id="clearBtn">Limpiar filtros</button>

</div>

<div class="section-head"><h2 id="sectionTitle">Eventos</h2><span class="result-count" id="resultCount"></span></div>

<div class="timeline-wrap">
  <div class="scroll-progress-wrap"><div class="scroll-progress-bar" id="scrollProgressBar"></div></div>
  <div class="timeline-scroll" id="timelineScroll">
    <div class="timeline-track" id="timelineTrack"><div class="spine"></div></div>
  </div>
  <div class="scroll-position-label" id="scrollPositionLabel"></div>
</div>

<div class="year-range">
  <div class="year-range-labels">
    <div class="year-range-side from">
      <span class="year-range-eyebrow" id="fromEyebrow">Desde</span>
      <span class="year-range-value" id="yearFromLabel"></span>
    </div>
    <div class="year-range-side to">
      <span class="year-range-eyebrow" id="toEyebrow">Hasta</span>
      <span class="year-range-value" id="yearToLabel"></span>
    </div>
  </div>
  <div class="range-slider">
    <div class="range-track-bg"></div>
    <div class="range-track-fill" id="rangeFill"></div>
    <div id="eraTicks"></div>
    <input type="range" id="rangeFrom" step="1" aria-label="Desde">
    <input type="range" id="rangeTo" step="1" aria-label="Hasta">
  </div>
  <div class="range-era-labels" id="eraLabels"></div>
  <footer id="footerText"></footer>
</div>
</div>
<div class="view game-view" id="viewGame" hidden>

  <!-- ===== CONFIGURACIÓN ===== -->
  <section class="gscreen active" id="gSetup">
    <div class="setup-grid" id="setupGrid">
      <div class="panel">
        <h2 class="g-h2" data-g="setupTitle"></h2>
        <p class="g-sub" data-g="setupSub"></p>

        <div class="g-label" data-g="lblWho"></div>
        <div class="choice-row" id="modeChoices">
          <button class="choice" data-mode="solo" style="--c:var(--c-mobile)">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg></span>
            <span><b data-g="soloTitle"></b><small data-g="soloDesc"></small></span>
          </button>
          <button class="choice" data-mode="group" style="--c:var(--c-ux)">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8.5" r="3"/><circle cx="17" cy="9.5" r="2.4"/><path d="M3.5 19.5c.9-3 3-4.6 5.5-4.6s4.6 1.6 5.5 4.6"/><path d="M15 15.2c2.6-.4 4.6 1 5.5 3.8"/></svg></span>

<script id="events-data" type="application/json">[{"id":"TEC-0001","year":1837,"title":"Máquina Analítica de Babbage","title_en":"Babbage's Analytical Engine","desc":"Charles Babbage concibe la Analytical Engine, considerada la primera computadora mecánica de propósito general (nunca construida en su totalidad).","desc_en":"Charles Babbage conceives the Analytical Engine, considered the first general-purpose mechanical computer (never fully built).","cats":["Hardware"],"importance":3,"region":"Reino Unido","region_en":"United Kingdom","note":"","note_en":"","source":"Wikipedia / Medium - Comprehensive Timeline of Computing"},{"id":"TEC-0002","year":1843,"title":"Primer algoritmo (Ada Lovelace)","title_en":"First algorithm (Ada Lovelace)","desc":"Ada Lovelace escribe el primer algoritmo destinado a ser ejecutado por una máquina (la Analytical Engine), por lo que se le considera la primera programadora de la historia.","desc_en":"Ada Lovelace writes the first algorithm intended to be executed by a machine (the Analytical Engine), which is why she is considered the first programmer in history.","cats":["Software"],"importance":3,"region":"Reino Unido","region_en":"United Kingdom","note":"","note_en":"","source":"Medium - Comprehensive Timeline of Computing"},{"id":"TEC-0003","year":1890,"title":"Máquina tabuladora de Hollerith","title_en":"Hollerith's tabulating machine","desc":"Herman Hollerith desarrolla un sistema de tarjetas perforadas para procesar el censo de EE.UU.; su empresa luego forma parte de IBM.","desc_en":"Herman Hollerith develops a punched-card system to process the US census; his company later becomes part of IBM.","cats":["Hardware"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"HP Tech Takes"},{"id":"TEC-0004","year":1931,"title":"Differential Analyzer (Vannevar Bush)","title_en":"Differential Analyzer (Vannevar Bush)","desc":"Vannevar Bush construye en el MIT el primer computador analógico mecánico de propósito general a gran escala.","desc_en":"Vannevar Bush builds at MIT the first large-scale general-purpose mechanical analog computer.","cats":["Hardware"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Live Science"},{"id":"TEC-0005","year":1936,"title":"Máquina de Turing","title_en":"Turing machine","desc":"Alan Turing propone el concepto de la 'máquina universal' (Turing machine) en su paper 'On Computable Numbers', sentando las bases teóricas de la computación moderna.","desc_en":"Alan Turing proposes the concept of the 'universal machine' in his paper 'On Computable Numbers', laying the theoretical foundations of modern computing.","cats":["Software"],"importance":3,"region":"Reino Unido","region_en":"United Kingdom","note":"","note_en":"","source":"Live Science / Rutherford Journal"},{"id":"TEC-0006","year":1941,"title":"Zuse Z3","title_en":"Zuse Z3","desc":"Konrad Zuse construye el Z3, considerado el primer computador digital programable funcional.","desc_en":"Konrad Zuse builds the Z3, considered the first working programmable digital computer.","cats":["Hardware"],"importance":2,"region":"Alemania","region_en":"Germany","note":"","note_en":"","source":"Medium - History of Computer"},{"id":"TEC-0007","year":1943,"title":"Colossus","title_en":"Colossus","desc":"Se construye en Bletchley Park el Colossus, primer computador digital programable electrónico, usado para descifrar códigos nazis.","desc_en":"Colossus, the first programmable electronic digital computer, is built at Bletchley Park and used to break Nazi codes.","cats":["Hardware"],"importance":2,"region":"Reino Unido","region_en":"United Kingdom","note":"","note_en":"","source":"Medium - History of Computer"},{"id":"TEC-0008","year":1945,"title":"Arquitectura von Neumann","title_en":"Von Neumann architecture","desc":"John von Neumann introduce el concepto de programa almacenado en el diseño del EDVAC, definiendo la arquitectura base de las computadoras modernas.","desc_en":"John von Neumann introduces the stored-program concept in the EDVAC design, defining the base architecture of modern computers.","cats":["Hardware","Software"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"arXiv - Milestones in Supercomputing"},{"id":"TEC-0009","year":1945,"title":"ENIAC","title_en":"ENIAC","desc":"Se completa el ENIAC, el primer computador electrónico digital de propósito general, programado manualmente mediante cables y switches.","desc_en":"ENIAC is completed: the first general-purpose electronic digital computer, programmed by hand with cables and switches.","cats":["Hardware"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Live Science"},{"id":"TEC-0010","year":1946,"title":"UNIVAC","title_en":"UNIVAC","desc":"Mauchly y Eckert reciben financiamiento para construir la UNIVAC, la primera computadora comercial para gobierno y negocios.","desc_en":"Mauchly and Eckert receive funding to build UNIVAC, the first commercial computer for government and business.","cats":["Hardware"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Live Science"},{"id":"MOB-0001","year":1947,"title":"Concepto de red celular","title_en":"Cellular network concept","desc":"Ingenieros de Bell Labs (liderados por D.H. Ring) proponen la idea de dividir el territorio en celdas hexagonales con reutilización de frecuencias, la base teórica que haría posible la telefonía móvil masiva décadas después.","desc_en":"Bell Labs engineers (led by D.H. Ring, building on W. Rae Young's idea) propose dividing territory into hexagonal cells with frequency reuse — the theoretical basis that would make mass mobile telephony possible decades later.","cats":["Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Sin este modelo de celdas no existiría ningún ícono de señal en ninguna pantalla.","note_en":"Without this cell model, no signal-bars icon would exist on any screen."},{"id":"TEC-0011","year":1947,"title":"Invención del transistor","title_en":"Invention of the transistor","desc":"Shockley, Bardeen y Brattain de Bell Labs inventan el transistor, sustituyendo a las válvulas de vacío y permitiendo computadoras más pequeñas y eficientes.","desc_en":"Shockley, Bardeen and Brattain at Bell Labs invent the transistor, replacing vacuum tubes and enabling smaller, more efficient computers.","cats":["Hardware"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Live Science / arXiv"},{"id":"TEC-0012","year":1947,"title":"Lenguaje ensamblador","title_en":"Assembly language","desc":"Kathleen Booth inventa el lenguaje ensamblador, que traduce instrucciones legibles por humanos a lenguaje máquina.","desc_en":"Kathleen Booth invents assembly language, which translates human-readable instructions into machine code.","cats":["Software"],"importance":2,"region":"Reino Unido","region_en":"United Kingdom","note":"","note_en":"","source":"G2 - History of Computers"},{"id":"TEC-0013","year":1948,"title":"Teoría de la Información (Shannon)","title_en":"Information theory (Shannon)","desc":"Claude Shannon publica 'A Mathematical Theory of Communication', base matemática de toda la era digital.","desc_en":"Claude Shannon publishes 'A Mathematical Theory of Communication', the mathematical basis of the entire digital era.","cats":["Software"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"arXiv - Milestones in Supercomputing"},{"id":"TEC-0014","year":1950,"title":"Bertie the Brain / juegos por computadora","title_en":"Bertie the Brain / computer games","desc":"Se crea Bertie the Brain en Toronto, uno de los primeros juegos jugables contra una computadora.","desc_en":"Bertie the Brain is created in Toronto, one of the first games playable against a computer.","cats":["Software","Gaming"],"importance":1,"region":"Canadá","region_en":"Canada","note":"","note_en":"","source":"GameDesignSkills - History of Video Games"},{"id":"TEC-0015","year":1950,"title":"Test de Turing","title_en":"Turing test","desc":"Alan Turing propone el 'Test de Turing' para evaluar si una máquina puede exhibir comportamiento inteligente indistinguible del humano.","desc_en":"Alan Turing proposes the 'Turing test' to evaluate whether a machine can exhibit intelligent behavior indistinguishable from a human's.","cats":["Software","IA"],"importance":3,"region":"Reino Unido","region_en":"United Kingdom","note":"","note_en":"","source":"MadeAi - AI Timeline"},{"id":"TEC-0016","year":1951,"title":"UNIVAC I comercial","title_en":"Commercial UNIVAC I","desc":"Se lanza la UNIVAC I, la primera computadora comercial de propósito general vendida en EE.UU.","desc_en":"UNIVAC I launches, the first general-purpose commercial computer sold in the US.","cats":["Hardware"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"arXiv - Milestones in Supercomputing"},{"id":"TEC-0017","year":1953,"title":"COBOL","title_en":"COBOL","desc":"Grace Hopper impulsa la creación de COBOL, uno de los primeros lenguajes de programación legibles por humanos y portables entre máquinas.","desc_en":"Grace Hopper drives the creation of COBOL, one of the first human-readable programming languages portable across machines.","cats":["Software"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"HP Tech Takes"},{"id":"TEC-0018","year":1956,"title":"Sensorama","title_en":"Sensorama","desc":"Morton Heilig desarrolla el Sensorama, un simulador multisensorial considerado la primera máquina de realidad virtual de la historia.","desc_en":"Morton Heilig develops the Sensorama, a multisensory simulator considered the first virtual reality machine in history.","cats":["VR/AR"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"VRS.org.uk - History of VR"},{"id":"TEC-0019","year":1958,"title":"Tennis for Two","title_en":"Tennis for Two","desc":"Se crea en el Brookhaven National Laboratory 'Tennis for Two', considerado el primer videojuego gráfico en tiempo real hecho puramente para entretenimiento.","desc_en":"'Tennis for Two' is created at Brookhaven National Laboratory, considered the first real-time graphical video game made purely for entertainment.","cats":["Gaming"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"GameDesignSkills"},{"id":"TEC-0020","year":1958,"title":"Invención del circuito integrado","title_en":"Invention of the integrated circuit","desc":"Jack Kilby y Robert Noyce desarrollan el circuito integrado, miniaturizando los componentes electrónicos y habilitando la futura microelectrónica.","desc_en":"Jack Kilby and Robert Noyce develop the integrated circuit, miniaturizing electronic components and enabling future microelectronics.","cats":["Hardware"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"HP Tech Takes"},{"id":"TEC-0021","year":1958,"title":"Telesphere Mask","title_en":"Telesphere Mask","desc":"Morton Heilig patenta el primer casco de visualización (HMD) de la historia, con imágenes estereoscópicas 3D y sonido envolvente.","desc_en":"Morton Heilig patents the first head-mounted display (HMD) in history, with stereoscopic 3D images and surround sound.","cats":["VR/AR"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"VRX by VR Expert"},{"id":"TEC-0022","year":1958,"title":"IBM 650 en la UNAM — primera computadora de Latinoamérica","title_en":"IBM 650 at UNAM — Latin America's first computer","desc":"La UNAM adquiere una IBM 650, marcando el inicio de la informática en Latinoamérica. La misma máquina fue adoptada ese año por la Universidad Autónoma de Nuevo León, y en Colombia por Coltejer y empresas públicas.","desc_en":"UNAM acquires an IBM 650, marking the beginning of computing in Latin America. The same machine was adopted that year by the Universidad Autónoma de Nuevo León, and in Colombia by Coltejer and public companies.","cats":["Hardware"],"importance":2,"region":"México / Colombia","region_en":"Mexico / Colombia","note":"","note_en":"","source":"Revista Digital Universitaria UNAM; Xataka México (2021)"},{"id":"TEC-0023","year":1960,"title":"Concepto de 'Hombre-Computadora Simbiosis'","title_en":"'Man-Computer Symbiosis' concept","desc":"J.C.R. Licklider publica ideas pioneras sobre la interacción humano-computadora que anticipan la interfaz moderna.","desc_en":"J.C.R. Licklider publishes pioneering ideas on human-computer interaction that anticipate the modern interface.","cats":["UX/UI"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"IxDF - Design History"},{"id":"TEC-0024","year":1961,"title":"Acuñación del término 'Computer Science'","title_en":"The term 'Computer Science' is coined","desc":"George Forsythe populariza el término 'computer science' para describir el estudio formal de la programación y el diseño de sistemas.","desc_en":"George Forsythe popularizes the term 'computer science' to describe the formal study of programming and systems design.","cats":["Software"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"HP Tech Takes"},{"id":"TEC-0025","year":1961,"title":"Primer concepto de red (Kleinrock)","title_en":"First network concept (Kleinrock)","desc":"Leonard Kleinrock escribe el primer paper teórico sobre redes de conmutación de paquetes, precursoras de ARPANET.","desc_en":"Leonard Kleinrock writes the first theoretical paper on packet-switching networks, precursors of ARPANET.","cats":["Web/Internet"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Live Science - Internet History"},{"id":"TEC-0026","year":1961,"title":"Primer wearable (cómputo para ruleta)","title_en":"First wearable (roulette computer)","desc":"Edward Thorp y Claude Shannon crean el primer dispositivo wearable de la historia: una computadora oculta en un zapato para predecir resultados de ruleta.","desc_en":"Edward Thorp and Claude Shannon create the first wearable device in history: a computer hidden in a shoe to predict roulette outcomes.","cats":["Wearables"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Brewer Science - History of Wearable Electronics"},{"id":"TEC-0027","year":1962,"title":"Spacewar!","title_en":"Spacewar!","desc":"Estudiantes del MIT desarrollan Spacewar!, uno de los primeros videojuegos en pantalla gráfica de la historia, ejecutado en una minicomputadora.","desc_en":"MIT students develop Spacewar!, one of the first video games on a graphical display, running on a minicomputer.","cats":["Gaming"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia - History of Video Games"},{"id":"TEC-0028","year":1963,"title":"Sketchpad (Ivan Sutherland)","title_en":"Sketchpad (Ivan Sutherland)","desc":"Ivan Sutherland crea Sketchpad, el primer programa con interfaz gráfica interactiva y antecesor del diseño asistido por computadora (CAD).","desc_en":"Ivan Sutherland creates Sketchpad, the first program with an interactive graphical interface and the ancestor of computer-aided design (CAD).","cats":["Software","UX/UI"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"IxDF - Design History"},{"id":"TEC-0029","year":1965,"title":"Acuñación del término 'Hipertexto'","title_en":"The term 'Hypertext' is coined","desc":"Ted Nelson acuña el término 'hypertext', concepto fundacional para lo que después sería la World Wide Web.","desc_en":"Ted Nelson coins the term 'hypertext', a foundational concept for what would later become the World Wide Web.","cats":["Web/Internet"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia - Timeline of Computing"},{"id":"TEC-0030","year":1967,"title":"Brown Box (Ralph Baer)","title_en":"Brown Box (Ralph Baer)","desc":"Ralph Baer construye el prototipo 'Brown Box', precursor de las consolas domésticas de videojuegos.","desc_en":"Ralph Baer builds the 'Brown Box' prototype, precursor of home video game consoles.","cats":["Hardware","Gaming"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Udonis - Complete History of Video Games"},{"id":"TEC-0031","year":1968,"title":"Demo de Douglas Engelbart ('La madre de todas las demos')","title_en":"Douglas Engelbart's demo ('The Mother of All Demos')","desc":"Engelbart presenta el mouse, hipertexto, video-conferencia y edición colaborativa de texto en una sola demostración histórica.","desc_en":"Engelbart presents the mouse, hypertext, video conferencing and collaborative text editing in a single historic demonstration.","cats":["Hardware","UX/UI"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"IxDF - Design History"},{"id":"TEC-0032","year":1968,"title":"Sword of Damocles","title_en":"Sword of Damocles","desc":"Ivan Sutherland y Bob Sproull crean el primer visor de realidad aumentada/virtual de la historia, un HMD suspendido del techo.","desc_en":"Ivan Sutherland and Bob Sproull create the first augmented/virtual reality headset in history, an HMD suspended from the ceiling.","cats":["VR/AR"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia - The Sword of Damocles (VR)"},{"id":"TEC-0033","year":1969,"title":"Nace ARPANET","title_en":"ARPANET is born","desc":"Se establece la primera conexión de ARPANET entre UCLA y Stanford Research Institute, naciendo la red precursora de Internet.","desc_en":"The first ARPANET link is established between UCLA and the Stanford Research Institute, giving birth to the network that preceded the Internet.","cats":["Web/Internet"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Internet Society / Live Science"},{"id":"TEC-0034","year":1969,"title":"Videoplace / 'Realidad artificial' (Myron Krueger)","title_en":"Videoplace / 'Artificial reality' (Myron Krueger)","desc":"Myron Krueger comienza a desarrollar entornos generados por computadora que responden a las personas, precursores de la realidad aumentada interactiva.","desc_en":"Myron Krueger begins developing computer-generated environments that respond to people, precursors of interactive augmented reality.","cats":["VR/AR"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"BCC Research - History of VR"},{"id":"TEC-0035","year":1971,"title":"Microprocesador Intel 4004","title_en":"Intel 4004 microprocessor","desc":"Intel lanza el 4004, el primer microprocesador comercial del mundo, miniaturizando el cerebro de la computadora en un solo chip.","desc_en":"Intel launches the 4004, the world's first commercial microprocessor, shrinking the computer's brain onto a single chip.","cats":["Hardware"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia - History of Personal Computers"},{"id":"TEC-0036","year":1971,"title":"Primer email (Ray Tomlinson)","title_en":"First email (Ray Tomlinson)","desc":"Ray Tomlinson envía el primer correo electrónico de la historia en ARPANET y populariza el uso del símbolo '@'.","desc_en":"Ray Tomlinson sends the first email in history over ARPANET and popularizes the '@' symbol.","cats":["Social","Web/Internet"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"GeeksforGeeks - History of Internet"},{"id":"TEC-0037","year":1972,"title":"Pong y nace Atari","title_en":"Pong and the birth of Atari","desc":"Atari lanza Pong, el primer videojuego arcade comercialmente exitoso, marcando el nacimiento de la industria de los videojuegos.","desc_en":"Atari launches Pong, the first commercially successful arcade video game, marking the birth of the video game industry.","cats":["Hardware","Gaming"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Smithsonian / Britannica"},{"id":"TEC-0038","year":1972,"title":"Magnavox Odyssey","title_en":"Magnavox Odyssey","desc":"Se lanza la Magnavox Odyssey, la primera consola doméstica de videojuegos de la historia.","desc_en":"The Magnavox Odyssey launches, the first home video game console in history.","cats":["Hardware","Gaming"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia - History of Video Games"},{"id":"MOB-0002","year":1973,"title":"Primera llamada desde un celular portátil","title_en":"First call from a portable mobile phone","desc":"Martin Cooper, de Motorola, realiza la primera llamada desde un teléfono celular portátil de mano en una calle de Nueva York, llamando irónicamente a su rival de Bell Labs.","desc_en":"Motorola's Martin Cooper makes the first call from a handheld portable cellular phone on a New York City street — fittingly, to his rival at Bell Labs.","cats":["Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"La llamada más citada en la historia del diseño de producto móvil.","note_en":"The most-cited phone call in the history of mobile product design."},{"id":"TEC-0039","year":1973,"title":"Xerox Alto","title_en":"Xerox Alto","desc":"Xerox PARC desarrolla el Alto, la primera computadora diseñada desde cero para soportar una interfaz gráfica de usuario (GUI) con ventanas, íconos y mouse.","desc_en":"Xerox PARC develops the Alto, the first computer designed from scratch to support a graphical user interface (GUI) with windows, icons and a mouse.","cats":["Hardware","UX/UI"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia / Uxcel - UX History"},{"id":"TEC-0040","year":1974,"title":"Intel 8080 y TCP","title_en":"Intel 8080 and TCP","desc":"Intel lanza el 8080 (base de los primeros PCs) y Vint Cerf/Bob Kahn publican el diseño del protocolo TCP, sentando las bases de Internet.","desc_en":"Intel launches the 8080 (the basis of the first PCs) and Vint Cerf/Bob Kahn publish the design of the TCP protocol, laying the foundations of the Internet.","cats":["Hardware","Web/Internet"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Wikipedia - History of PCs / Live Science"},{"id":"TEC-0041","year":1975,"title":"Altair 8800","title_en":"Altair 8800","desc":"MITS lanza el Altair 8800, ampliamente considerado el primer computador personal vendido como kit, dando origen a Microsoft (Gates y Allen escriben BASIC para él).","desc_en":"MITS launches the Altair 8800, widely considered the first personal computer sold as a kit, giving rise to Microsoft (Gates and Allen write BASIC for it).","cats":["Hardware","Software"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Low End Mac"},{"id":"TEC-0042","year":1976,"title":"Apple I","title_en":"Apple I","desc":"Steve Jobs y Steve Wozniak diseñan el Apple I, el primer producto de Apple Computer.","desc_en":"Steve Jobs and Steve Wozniak design the Apple I, Apple Computer's first product.","cats":["Hardware"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Low End Mac"},{"id":"PAT-0001","year":1977,"title":"A Pattern Language (Christopher Alexander)","title_en":"A Pattern Language (Christopher Alexander)","desc":"El arquitecto Christopher Alexander, junto a Sara Ishikawa y Murray Silverstein, identifica y documenta 253 patrones de arquitectura y urbanismo en el libro seminal A Pattern Language: cada patrón describe un problema recurrente y el núcleo de su solución.","desc_en":"Architect Christopher Alexander, with Sara Ishikawa and Murray Silverstein, identifies and documents 253 architecture and urban-planning patterns in the seminal book A Pattern Language: each pattern describes a recurring problem and the core of its solution.","cats":["Patrones"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"El origen de todo: la estructura 'problema → contexto → solución' que hoy usa cualquier biblioteca de componentes.","note_en":"Where it all starts: the 'problem → context → solution' structure every component library still uses today."},{"id":"TEC-0043","year":1977,"title":"Apple II, Commodore PET y TRS-80","title_en":"Apple II, Commodore PET and TRS-80","desc":"Se lanzan simultáneamente Apple II, Commodore PET y Tandy TRS-80, dando inicio a la industria masiva de las computadoras personales.","desc_en":"The Apple II, Commodore PET and Tandy TRS-80 launch the same year, kicking off the mass personal computer industry.","cats":["Hardware"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Britannica - Personal Computer"},{"id":"TEC-0044","year":1978,"title":"VisiCalc","title_en":"VisiCalc","desc":"Se introduce VisiCalc, la primera hoja de cálculo electrónica, que impulsó masivamente la adopción de las computadoras personales en oficinas.","desc_en":"VisiCalc is introduced, the first electronic spreadsheet, which massively drove PC adoption in offices.","cats":["Software"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Live Science"},{"id":"TEC-0045","year":1978,"title":"Space Invaders","title_en":"Space Invaders","desc":"Taito lanza Space Invaders, uno de los arcades más influyentes de la historia, que causó escasez de monedas en Japón por su popularidad.","desc_en":"Taito launches Space Invaders, one of the most influential arcade games ever, which caused a coin shortage in Japan due to its popularity.","cats":["Gaming"],"importance":2,"region":"Japón","region_en":"Japan","note":"","note_en":"","source":"History.com - Video Game Timeline"},{"id":"PAT-0002","year":1979,"title":"The Timeless Way of Building","title_en":"The Timeless Way of Building","desc":"Alexander publica The Timeless Way of Building, donde plantea construir de forma 'humana', considerando el contexto de uso de cada solución como parte integral de la forma final.","desc_en":"Alexander publishes The Timeless Way of Building, arguing for building in a 'human' way and treating the context of use of each solution as integral to the final form.","cats":["Patrones"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"La base filosófica de los patrones: la calidad nace del contexto, no del objeto aislado.","note_en":"The philosophical basis of patterns: quality comes from context, not from the isolated object."},{"id":"TEC-0046","year":1979,"title":"Primer ISP comercial (Telenet) y Sony Walkman","title_en":"First commercial ISP (Telenet) and Sony Walkman","desc":"Surge Telenet, el primer proveedor comercial de servicios de internet; Sony lanza el Walkman, redefiniendo el consumo de música portátil.","desc_en":"Telenet emerges as the first commercial internet service provider; Sony launches the Walkman, redefining portable music consumption.","cats":["Hardware","Web/Internet"],"importance":1,"region":"Estados Unidos / Japón","region_en":"United States / Japan","note":"","note_en":"","source":"Live Science"},{"id":"TEC-0047","year":1979,"title":"WordStar","title_en":"WordStar","desc":"MicroPro lanza WordStar, el primer procesador de texto comercialmente exitoso.","desc_en":"MicroPro launches WordStar, the first commercially successful word processor.","cats":["Software"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Live Science"},{"id":"TEC-0048","year":1980,"title":"Pac-Man","title_en":"Pac-Man","desc":"Namco lanza Pac-Man, que transforma el videojuego arcade en un fenómeno cultural masivo más allá de la audiencia gamer tradicional.","desc_en":"Namco launches Pac-Man, turning the arcade video game into a mass cultural phenomenon beyond the traditional gamer audience.","cats":["Gaming"],"importance":2,"region":"Japón","region_en":"Japan","note":"","note_en":"","source":"Telefónica - History of Video Games"},{"id":"UX-0025","year":1981,"title":"Menú hamburguesa","title_en":"Hamburger menu","desc":"Norm Cox diseña el ícono de tres líneas para el Xerox Star, el primer computador comercial con interfaz gráfica. Tres décadas más tarde, en la era del smartphone (hacia 2011), se populariza como el símbolo estándar para menús de navegación ocultos en pantallas pequeñas, con la app móvil de Facebook entre sus primeras adoptantes.","desc_en":"Norm Cox designs the three-line icon for the Xerox Star, the first commercial computer with a graphical interface. Three decades later, in the smartphone era (around 2011), it's popularized as the standard symbol for hidden navigation menus on small screens, with Facebook's mobile app among its early adopters.","cats":["UX/UI","Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Uno de los íconos más criticados —y más usados— de toda la historia del diseño de interfaces: nació en un escritorio de oficina y no en un teléfono.","note_en":"One of the most criticized — and most used — icons in the whole history of interface design: it was born on an office desktop, not on a phone."},{"id":"TEC-0049","year":1981,"title":"IBM PC","title_en":"IBM PC","desc":"IBM lanza el IBM Personal Computer con MS-DOS de Microsoft, legitimando la categoría de PC y estandarizando la arquitectura x86.","desc_en":"IBM launches the IBM Personal Computer with Microsoft's MS-DOS, legitimizing the PC category and standardizing the x86 architecture.","cats":["Hardware","Software"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Britannica / Live Science"},{"id":"TEC-0050","year":1981,"title":"Osborne 1: primera laptop portátil","title_en":"Osborne 1: first portable computer","desc":"Adam Osborne lanza el Osborne 1, ampliamente considerado el primer computador portátil comercial exitoso.","desc_en":"Adam Osborne launches the Osborne 1, widely considered the first commercially successful portable computer.","cats":["Hardware"],"importance":1,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Low End Mac"},{"id":"TEC-0051","year":1982,"title":"EyePhone y DataGlove (VPL Research)","title_en":"EyePhone and DataGlove (VPL Research)","desc":"Jaron Lanier funda VPL Research y crea el EyePhone con DataGlove, popularizando el término 'realidad virtual'.","desc_en":"Jaron Lanier founds VPL Research and creates the EyePhone and DataGlove, popularizing the term 'virtual reality'.","cats":["VR/AR"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"VRX by VR Expert"},{"id":"MOB-0003","year":1983,"title":"Motorola DynaTAC sale a la venta","title_en":"Motorola DynaTAC goes on sale","desc":"El DynaTAC 8000X se convierte en el primer teléfono móvil comercial disponible al público: pesaba 790g, ofrecía 30 minutos de batería y costaba cerca de 3,995 USD.","desc_en":"The DynaTAC 8000X becomes the first commercially available handheld mobile phone: it weighed 790g, offered 30 minutes of talk time, and cost around $3,995.","cats":["Mobile"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"El 'ladrillo' que definió la silueta del teléfono móvil por una década.","note_en":"The 'brick' that defined the mobile phone's silhouette for a decade."},{"id":"TEC-0052","year":1983,"title":"ARPANET adopta TCP/IP","title_en":"ARPANET adopts TCP/IP","desc":"ARPANET migra completamente a TCP/IP el 1 de enero, fecha considerada el 'nacimiento' técnico de Internet moderno.","desc_en":"ARPANET fully migrates to TCP/IP on January 1, a date considered the technical 'birth' of the modern Internet.","cats":["Web/Internet"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"GeeksforGeeks / TechEngage"},{"id":"TEC-0053","year":1983,"title":"Apple Lisa","title_en":"Apple Lisa","desc":"Apple lanza Lisa, la primera computadora personal comercial con interfaz gráfica de usuario (GUI) y mouse integrados.","desc_en":"Apple launches Lisa, the first commercial personal computer with an integrated graphical user interface (GUI) and mouse.","cats":["Hardware","UX/UI"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Computer History Museum"},{"id":"TEC-0054","year":1983,"title":"Crisis de los videojuegos de 1983","title_en":"The video game crash of 1983","desc":"La sobresaturación del mercado (con títulos como E.T. de Atari) provoca el colapso comercial de la industria de videojuegos en Norteamérica.","desc_en":"Market oversaturation (with titles like Atari's E.T.) triggers the commercial collapse of the video game industry in North America.","cats":["Gaming"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"History.com"},{"id":"TEC-0055","year":1984,"title":"Apple Macintosh","title_en":"Apple Macintosh","desc":"Apple lanza la Macintosh con su icónico comercial de Super Bowl; es la primera computadora con mouse exitosa comercialmente y populariza la GUI.","desc_en":"Apple launches the Macintosh with its iconic Super Bowl ad; it is the first commercially successful mouse-driven computer and popularizes the GUI.","cats":["Hardware","UX/UI"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Computer History Museum / Live Science"},{"id":"TEC-0056","year":1985,"title":"Microsoft Windows 1.0","title_en":"Microsoft Windows 1.0","desc":"Microsoft lanza la primera versión de Windows como respuesta a la GUI de Apple, sentando las bases del sistema operativo más usado en PCs.","desc_en":"Microsoft launches the first version of Windows in response to Apple's GUI, laying the foundations of the most widely used PC operating system.","cats":["Software"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"Live Science"},{"id":"TEC-0057","year":1985,"title":"Domain Name System (DNS)","title_en":"Domain Name System (DNS)","desc":"Paul Mockapetris desarrolla el DNS, permitiendo nombres de dominio legibles como '.com' en lugar de direcciones numéricas.","desc_en":"Paul Mockapetris develops DNS, enabling readable domain names like '.com' instead of numeric addresses.","cats":["Web/Internet"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"GeeksforGeeks"},{"id":"TEC-0058","year":1985,"title":"Nintendo Entertainment System / Super Mario Bros.","title_en":"Nintendo Entertainment System / Super Mario Bros.","desc":"Nintendo lanza la NES en Norteamérica junto a Super Mario Bros., revitalizando la industria tras la crisis de 1983.","desc_en":"Nintendo launches the NES in North America alongside Super Mario Bros., revitalizing the industry after the 1983 crash.","cats":["Hardware","Gaming"],"importance":3,"region":"Japón","region_en":"Japan","note":"","note_en":"","source":"Telefónica - History of Video Games"},{"id":"PAT-0003","year":1987,"title":"Kent Beck y Ward Cunningham: patrones para Smalltalk","title_en":"Kent Beck and Ward Cunningham: patterns for Smalltalk","desc":"Kent Beck y Ward Cunningham toman a Christopher Alexander como modelo para desarrollar un lenguaje de patrones para diseñar interfaces en Smalltalk, y lo presentan en la conferencia OOPSLA '87.","desc_en":"Kent Beck and Ward Cunningham use Christopher Alexander as a model to develop a pattern language for designing Smalltalk interfaces, presenting it at the OOPSLA '87 conference.","cats":["Patrones","Software"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"El momento en que los patrones saltan de la arquitectura al software.","note_en":"The moment patterns jump from architecture to software."},{"id":"TEC-0059","year":1988,"title":"The Design of Everyday Things (Don Norman)","title_en":"The Design of Everyday Things (Don Norman)","desc":"Don Norman publica este libro fundacional que formaliza conceptos de affordances, feedback y modelos mentales, sentando las bases de la disciplina UX moderna.","desc_en":"Don Norman publishes this foundational book that formalizes affordances, feedback and mental models, laying the groundwork for the modern UX discipline.","cats":["UX/UI"],"importance":3,"region":"Estados Unidos","region_en":"United States","note":"","note_en":"","source":"IxDF / Uxcel - UX History"},{"id":"MOB-0004","year":1989,"title":"Motorola MicroTAC y el teléfono plegable","title_en":"Motorola MicroTAC introduces the flip phone","desc":"El MicroTAC introduce el formato 'flip', que protege el teclado al cerrarse y reduce el tamaño del dispositivo, sentando la plantilla estética que dominaría los años 90 y 2000.","desc_en":"The MicroTAC introduces the 'flip' form factor, protecting the keypad when closed and shrinking the device, setting the aesthetic template that would dominate the '90s and 2000s.","cats":["Mobile"],"importance":2,"region":"Estados Unidos","region_en":"United States","note":"Primer caso donde una bisagra mecánica se convierte en gesto de apertura/cierre de interfaz.","note_en":"The first case of a mechanical hinge becoming an open/close interface gesture."},{"id":"TEC-0060","year":1989,"title":"Propuest
