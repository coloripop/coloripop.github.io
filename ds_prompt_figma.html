        let currentTabIndex = 0;

        function toggleLanguage() {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            document.documentElement.lang = currentLang;
            updateUIStrings();
            renderContents();
            switchTab(currentTabIndex);
        }

        function updateUIStrings() {
            const strings = i18n[currentLang];
            document.getElementById('subtitleText').textContent = strings.subtitle;
            document.getElementById('searchInput').placeholder = strings.searchPlaceholder;
            document.getElementById('globalCopyText').textContent = strings.copyActive;
            document.getElementById('langToggleBtnText').textContent = strings.langBtn;
            document.getElementById('footerText').textContent = strings.footer;

            // Update Tab Labels
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach((btn, idx) => {
                const icon = btn.querySelector('i');
                btn.childNodes[btn.childNodes.length - 1].textContent = ` ${strings.tabs[idx]}`;
            });
        }

        function switchTab(index) {
            currentTabIndex = index;
            const buttons = document.querySelectorAll('.tab-btn');
            const panes = document.querySelectorAll('.tab-pane');

            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('tab-active');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('tab-active');
                    btn.classList.add('text-gray-400');
                }
            });

            panes.forEach((pane, i) => {
                if (i === index) {
                    pane.classList.remove('hidden');
                } else {
                    pane.classList.add('hidden');
                }
            });
        }

        function copyCurrentPrompt() {
            copyPromptText(currentTabIndex);
        }

        function copyPromptText(index) {
            const data = promptsData[currentLang][index];
            const promptContent = data.promptText;

            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = promptContent;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            const btnText = document.getElementById(`btnText-${index}`);
            const globalCopyText = document.getElementById(`globalCopyText`);

            const copiedMsg = i18n[currentLang].copied;
            if (btnText) btnText.textContent = copiedMsg;
            if (globalCopyText) globalCopyText.textContent = copiedMsg;

            const titleClean = data.title.split('.')[1] || data.title;
            showToast(`${titleClean} ${i18n[currentLang].toastSuffix}`);

            setTimeout(() => {
                if (btnText) btnText.textContent = i18n[currentLang].copyPrompt;
                if (globalCopyText) globalCopyText.textContent = i18n[currentLang].copyActive;
            }, 2500);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            if (!toast || !toastMsg) return;

            toastMsg.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderContents() {
            const container = document.getElementById('tabContents');
            if (!container) return;
            container.innerHTML = '';

            const currentPrompts = promptsData[currentLang];
            const strings = i18n[currentLang];

            currentPrompts.forEach((item, index) => {
                const isHidden = index !== currentTabIndex ? 'hidden' : '';

                                    <span class="ml-2 font-sans font-medium text-gray-300">Prompt_Figma_Agent_${item.id}.txt</span>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderContents();
            switchTab(0);

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    const query = e.target.value.toLowerCase();
                    if (!query) {
                        switchTab(currentTabIndex);
                        return;
                    }

                    const currentPrompts = promptsData[currentLang];
                    currentPrompts.forEach((item, idx) => {
                        const text = (item.title + " " + item.description + " " + item.promptText).toLowerCase();
                        const pane = document.getElementById(`content-${idx}`);
                        if (pane) {
                            if (text.includes(query)) {
                                pane.classList.remove('hidden');
