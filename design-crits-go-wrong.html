<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>13 ways design crits go wrong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F7; --ink:#141414; --muted:#6B7476; --soft:#9A9FA3; --line:#E3E5EA;
  --ctl-bg:rgba(255,255,255,.75); --ctl-on:#FFFFFF; --ctl-shadow:0 1px 3px rgba(20,20,20,.08);
  --blob-a:rgba(127,224,196,.35); --blob-b:rgba(126,192,245,.30); --blob-c:rgba(123,120,232,.20);
  --scrim:rgba(243,244,247,.72); --dim:.74;
  /* la carta es un objeto físico: mismos colores en claro y oscuro */
  --card-bg:#FFFFFF; --card-ink:#141414; --card-muted:#6B7476; --card-soft:#9A9FA3; --card-line:#E7E9EE;
  --yel:#FFD27A; --blu:#7EC0F5; --min:#7FE0C4; --pnk:#E8789E; --gry:#6B7476; --pur:#7B78E8;
  --t-blu:#EEF6FE; --t-yel:#FFF8EA; --t-pnk:#FDEEF3; --t-min:#ECFAF5;
  --grad:linear-gradient(135deg,#A86BF0 0%,#7B78E8 50%,#7EC0F5 100%);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101215; --ink:#ECEDEF; --muted:#A3A9AD; --soft:#7D8388; --line:#2A2D33;
    --ctl-bg:rgba(255,255,255,.06); --ctl-on:rgba(255,255,255,.14); --ctl-shadow:none;
    --blob-a:rgba(127,224,196,.12); --blob-b:rgba(126,192,245,.12); --blob-c:rgba(123,120,232,.16);
    --scrim:rgba(16,18,21,.72); --dim:.45; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101215; --ink:#ECEDEF; --muted:#A3A9AD; --soft:#7D8388; --line:#2A2D33;
  --ctl-bg:rgba(255,255,255,.06); --ctl-on:rgba(255,255,255,.14); --ctl-shadow:none;
  --blob-a:rgba(127,224,196,.12); --blob-b:rgba(126,192,245,.12); --blob-c:rgba(123,120,232,.16);
  --scrim:rgba(16,18,21,.72); --dim:.45; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased;
  min-height:100vh; overflow-x:hidden;
}
body::after{ /* manchas difusas de fondo */
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(40vmax 40vmax at 88% 6%, var(--blob-a), transparent 70%),
    radial-gradient(35vmax 35vmax at 70% 30%, var(--blob-b), transparent 70%),
    radial-gradient(45vmax 45vmax at 6% 100%, var(--blob-c), transparent 70%);
}
.page{max-width:1280px; margin:0 auto; padding:clamp(20px,4vw,48px) clamp(16px,4vw,48px) 32px}
header{display:flex; flex-wrap:wrap; gap:20px 32px; align-items:flex-end; justify-content:space-between}
h1{font-weight:300; font-size:clamp(34px,5.6vw,68px); line-height:1.02; letter-spacing:-.035em; margin:0; max-width:14ch}
.lede{margin:14px 0 0; color:var(--muted); font-size:clamp(14px,1.4vw,16px); line-height:1.5; max-width:46ch; white-space:pre-line}
.controls{display:flex; gap:10px; flex-wrap:wrap}
.seg{display:inline-flex; padding:4px; border-radius:999px; background:var(--ctl-bg); border:1px solid var(--line); backdrop-filter:blur(10px)}
.seg button{
  font:inherit; font-size:14px; font-weight:500; color:var(--muted);
  border:0; background:transparent; padding:8px 16px; border-radius:999px; cursor:pointer;
  transition:background .2s,color .2s;
}
.seg button[aria-pressed="true"]{background:var(--ctl-on); color:var(--ink); box-shadow:var(--ctl-shadow)}
.seg button:focus-visible,.card:focus-visible,.close:focus-visible{outline:2px solid var(--pur); outline-offset:3px}

.stage{position:relative; margin-top:clamp(24px,4vw,48px); transition:height .6s cubic-bezier(.2,.8,.2,1)}
.card{
  position:absolute; left:0; top:0; width:240px; height:320px;
  transform-origin:50% 50%; border:0; padding:0; background:none; cursor:pointer;
  transition:transform .6s cubic-bezier(.2,.8,.2,1), opacity .3s, filter .3s;
  will-change:transform; transform-style:preserve-3d;
}
.stage.hovering .card:not(.is-hover){filter:brightness(var(--dim)) saturate(.55)}
.card .face{backface-visibility:hidden; -webkit-backface-visibility:hidden}
.stage:not(.tarot) .card .cover{display:none}
.stage.tarot{margin-top:20px}
.stage.tarot .card{transition-duration:1.1s; transition-timing-function:cubic-bezier(.45,.05,.2,1)}
.stage.tarot.shuffling .card{transition-duration:.28s}
.face.cover{
  transform:rotateY(180deg); border-color:rgba(255,255,255,.35);
  background:
    radial-gradient(60% 45% at 88% 8%, rgba(127,224,196,.6), transparent 70%),
    radial-gradient(60% 45% at 8% 96%, rgba(232,120,158,.4), transparent 70%),
    var(--grad);
}
.cover::before{content:""; position:absolute; inset:5cqw; border:1px solid rgba(255,255,255,.5); border-radius:10px}
.cover .glyph{position:absolute; left:50%; top:50%; width:48cqw; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; border:1px solid rgba(255,255,255,.6); display:grid; place-items:center}
.cover .glyph::before{content:""; width:66%; aspect-ratio:1; border-radius:50%; border:1px solid rgba(255,255,255,.4)}
.cover .glyph svg{position:absolute; width:46%; height:46%; color:#fff}
.tarot-ui{text-align:center; margin-top:clamp(24px,4vw,40px)}
.tarot-ui h2{font-weight:300; font-size:clamp(22px,3vw,34px); line-height:1.2; letter-spacing:-.02em; margin:0 auto 16px; max-width:22ch}
.draw{font:inherit; font-weight:500; font-size:15px; color:#fff; border:0; border-radius:999px; padding:12px 24px; background:var(--grad); cursor:pointer; box-shadow:0 10px 24px -10px rgba(123,120,232,.7)}
.draw:focus-visible{outline:2px solid var(--pur); outline-offset:3px}
.card .face{box-shadow:0 1px 2px rgba(20,20,20,.06), 0 12px 32px -12px rgba(20,20,20,.18)}
.card.is-hover .face{box-shadow:0 2px 4px rgba(20,20,20,.08), 0 24px 48px -16px rgba(60,50,140,.35)}

/* ===== cara de la carta (escala con su contenedor) ===== */
.face{
  position:absolute; inset:0; border-radius:15px; overflow:hidden; container-type:size;
  background:var(--card-bg); color:var(--card-ink); text-align:left;
  border:1px solid var(--card-line);
}
.front{
  background:
    radial-gradient(70% 50% at 100% 0%, var(--ffar,transparent), transparent 70%),
    radial-gradient(80% 55% at 4% 100%, var(--fnear,transparent), transparent 70%),
    var(--fbg,var(--card-bg));
  color:var(--fink,var(--card-ink)); border-color:transparent;
}
.front .num{position:absolute; left:6.5cqw; top:5cqw; font-weight:300; font-size:26cqw; letter-spacing:-.04em; line-height:1}
.front .txt{position:absolute; left:7.8cqw; right:7.8cqw; bottom:8cqw}
.front .tt{font-weight:500; font-size:7.8cqw; line-height:1.2; letter-spacing:-.015em}
.front .st{margin-top:2.4cqw; font-size:3.8cqw; line-height:1.4; color:inherit}

.back{
  transform:rotateY(180deg); display:flex; flex-direction:column;
  background:radial-gradient(45% 28% at 100% 0%, var(--braw,rgba(127,224,196,.45)), transparent 70%), var(--card-bg);
}
.back .bh{display:flex; align-items:center; gap:12px; padding:clamp(14px,4.4cqw,24px) clamp(14px,4.4cqw,24px) clamp(10px,2.6cqw,14px)}
.back .bt{flex:1; font-weight:500; font-size:clamp(16px,4.4cqw,22px); letter-spacing:-.01em; line-height:1.2}
.back .bn{flex:none; width:clamp(34px,9cqw,44px); aspect-ratio:1; border-radius:50%; background:var(--grad); color:#fff; font-weight:600; font-size:clamp(13px,3.2cqw,15px); display:grid; place-items:center}
.back .secs{flex:1; display:flex; flex-direction:column; gap:clamp(6px,1.6cqw,9px); padding:0 clamp(10px,3.4cqw,18px) clamp(10px,3.4cqw,18px); overflow-y:auto; overscroll-behavior:contain}
.sec{flex:1 0 auto; border-radius:clamp(12px,3.6cqw,18px); padding:clamp(10px,2.8cqw,15px) clamp(12px,3.4cqw,18px)}
.sec .lab{display:flex; align-items:center; gap:8px; font-weight:500; font-size:clamp(11.5px,2.5cqw,13px); color:var(--card-muted)}
.sec .lab i{width:10px; height:10px; border-radius:3px; flex:none}
.sec p{margin:6px 0 0; font-size:clamp(13px,2.85cqw,15.5px); line-height:1.5}
.sec.que{background:var(--t-blu)} .sec.que i{background:var(--blu)}
.sec.por{background:var(--t-yel)} .sec.por i{background:var(--yel)}
.sec.con{background:var(--t-pnk)} .sec.con i{background:var(--pnk)}
.sec.como{background:var(--t-min)} .sec.como i{background:var(--min)}
.art{margin:0; flex:none; border-radius:clamp(12px,3.6cqw,18px); overflow:hidden; background:#fff; border:1px solid var(--card-line)}
.art img{display:block; width:100%; height:auto}
.back .src{padding:0 clamp(14px,4.4cqw,24px) clamp(12px,3.4cqw,18px); font-size:clamp(10.5px,2.2cqw,12px); color:var(--card-soft)}
.back .src a,footer a{color:inherit; text-decoration:underline; text-decoration-color:currentColor; text-underline-offset:2px}
.back .src a:hover,footer a:hover{color:var(--pur)}
.back .src a:focus-visible,footer a:focus-visible{outline:2px solid var(--pur); outline-offset:2px; border-radius:2px}

/* ===== modal ===== */
.scrim{position:fixed; inset:0; background:var(--scrim); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); opacity:0; transition:opacity .45s; z-index:50}
.scrim.on{opacity:1}
.modal{position:fixed; left:50%; top:50%; z-index:60; perspective:1800px; pointer-events:none}
.flip{position:absolute; inset:0; transform-style:preserve-3d; pointer-events:auto}
.flip .face{border-radius:clamp(20px,5vmin,30px); backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 30px 80px -20px rgba(40,30,110,.35)}
.close{
  flex:none; width:36px; height:36px; border-radius:50%; border:0; cursor:pointer;
  background:rgba(20,20,20,.06); color:var(--card-ink); font-size:20px; line-height:1; display:none;
}
.back.has-close .close{display:grid; place-items:center}
.hint{margin-top:18px; text-align:center; color:var(--soft); font-size:13px}
@media (max-width:1023px){ [data-view=fan]{display:none} }
footer{margin-top:28px; font-size:12px; color:var(--soft); text-align:center}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){
  .card,.stage,.scrim{transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" id="viewSeg">
        <button data-view="fan" aria-pressed="true"></button>
        <button data-view="list" aria-pressed="false"></button>
        <button data-view="tarot" aria-pressed="false"></button>
      </div>
      <div class="seg" role="group" aria-label="Idioma / Language">
        <button data-lang="es" aria-pressed="true">ES</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <section class="tarot-ui" id="tarotUi" hidden>
    <h2 id="tQ"></h2>
    <button class="draw" id="drawBtn"></button>
  </section>
  <div class="stage" id="stage"></div>
  <footer id="foot"></footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="flip" id="flip">
    <div class="face front" id="mFront"></div>
    <div class="face back has-close" id="mBack"></div>
  </div>
</div>

<script>
const DATA = [{"es": {"t": "El vacío de contexto", "s": "The Context Vacuum", "q": "Se muestra una pantalla y se pregunta “¿qué opinan?” sin explicar quién es el usuario, cuál es el problema, los objetivos de negocio ni las restricciones técnicas.", "p": "La maldición del conocimiento: tras semanas inmerso en el problema, el diseñador asume sin darse cuenta que todos en la sala conocen el trasfondo tanto como él.", "c": "Los comentarios son dispersos e irrelevantes porque parten de supuestos falsos. La sesión se convierte en una ronda de preguntas solo para aclarar lo básico y se pierde tiempo valioso.", "h": "Estandarizar la apertura de cada crítica con 3–5 minutos de encuadre: ¿Quién es el usuario? ¿Qué quiere lograr? ¿Qué restricciones tenemos? ¿Qué tipo de feedback necesito hoy?"}, "en": {"t": "The Context Vacuum", "s": "Presenting Without Framing", "q": "A screen gets shown with a bare “Thoughts?”, with no word on who the user is, the problem at hand, the business goals, or the technical limits.", "p": "The curse of knowledge. After weeks deep in the problem, the designer unconsciously assumes everyone in the room knows the background just as well.", "c": "Scattered, off-target comments built on wrong assumptions. The session turns into a round of questions just to establish the basics, burning valuable time.", "h": "Make framing the standard opener: 3–5 minutes on who the user is, what they want to achieve, which constraints apply, and what kind of feedback you need today."}}, {"es": {"t": "Solucionitis", "s": "Solutionizing", "q": "Los revisores dictan cómo cambiar la interfaz (“ponlo en rojo y muévelo arriba a la derecha”) en lugar de explicar por qué el diseño actual no funciona.", "p": "Soltar un arreglo rápido cuesta menos esfuerzo que articular la fricción de fondo. Los stakeholders senior están acostumbrados a decidir soluciones, y proponerlas resulta satisfactorio.", "c": "Reduce al diseñador a ejecutor de píxeles. Surgen soluciones superficiales que rompen restricciones del sistema o crean nuevos problemas; a veces dos propuestas chocan y ninguna ataca la dificultad real.", "h": "Dar feedback sobre problemas, no soluciones. Si alguien prescribe un cambio, el facilitador pregunta: “¿Qué problema del usuario resuelve eso?”. Se anota el problema y el diseñador explora soluciones después."}, "en": {"t": "Solutionizing", "s": "Designing in the Room", "q": "Reviewers dictate how to change the UI (“make it red and move it to the top right”) instead of explaining why the current design isn’t working.", "p": "Blurting out a quick fix takes less effort than articulating the underlying friction. Senior stakeholders are used to deciding on solutions, and proposing them feels good.", "c": "The designer is reduced to a pixel executor. Shallow fixes break system constraints or create new problems; sometimes two proposals clash and neither tackles the real difficulty.", "h": "Give feedback on problems, not solutions. When someone prescribes a change, the facilitator asks: “Which user problem does that solve?” Capture the problem; the designer explores fixes later."}}, {"es": {"t": "Bikeshedding", "s": "Bikeshedding", "q": "Pasar 20 minutos debatiendo radios de esquina o textos sobre un wireframe de baja fidelidad o, al revés, pedir cambios estructurales de flujo en una revisión de pulido visual final.", "p": "Ley de la trivialidad de Parkinson: los detalles visuales son fáciles de ver y opinar, mientras que la arquitectura de UX exige mucha carga cognitiva. La atención se va a la superficie.", "c": "Se pierde tiempo en trivialidades mientras las fallas estructurales graves pasan inadvertidas. Pedir cambios de estructura en la etapa final dispara plazos y presupuesto.", "h": "Delimitar el feedback de forma explícita: “Es un wireframe estructural; hoy ignoren color y textos y enfóquense en la lógica de navegación”. Presentar en escala de grises cuando sea posible."}, "en": {"t": "Bikeshedding", "s": "Critiquing the Wrong Fidelity", "q": "Spending 20 minutes on corner radii or microcopy in a low-fidelity wireframe, or the reverse: requesting structural flow changes during a final visual polish review.", "p": "Parkinson’s Law of Triviality: visual details are easy to see and comment on, while UX architecture demands heavy cognitive effort. Attention drifts to the surface.", "c": "Time goes to trivia while serious structural flaws slip by unnoticed. Demanding structural changes at the final stage blows up timelines and budgets.", "h": "Scope the feedback explicitly: “This is a structural wireframe; skip color and copy today and focus on the navigation logic.” Present in grayscale whenever possible."}}, {"es": {"t": "“Me gusta / no me gusta”", "s": "Subjective “I Like / I Don’t Like” Feedback", "q": "Comentarios como “no me gusta”, “algo no cuadra” o “lo haría más limpio”, sin referencia a usuarios, tareas, accesibilidad, contenido, negocio ni evidencia.", "p": "Sin vocabulario de UX ni criterios objetivos, se recurre a la reacción emocional y al gusto personal. Lo visual invita a reaccionar como consumidor y no a razonar como profesional.", "c": "Debate irresoluble de gustos: gana quien habla más fuerte y el usuario queda fuera. Se hacen cambios cosméticos que se revierten en la siguiente reunión; mucho movimiento, poco progreso.", "h": "Prohibir “me gusta” y “no me gusta”. Anclar cada comentario a la persona, los objetivos, la usabilidad o los datos. Usar frases como “Esto puede causar problemas porque…” o “Para este usuario y esta tarea, el riesgo es…”."}, "en": {"t": "“I Like / I Don’t Like”", "s": "Subjective Feedback", "q": "Comments like “I don’t like it,” “something’s off,” or “I’d make it cleaner,” with no link to users, tasks, accessibility, content, business, or evidence.", "p": "Without UX vocabulary or objective criteria, people fall back on gut reactions and personal taste. Visual work invites reacting as a consumer rather than reasoning as a professional.", "c": "An unwinnable debate over taste: the loudest voice wins and the user drops out. Cosmetic changes get reversed at the next meeting; lots of motion, little progress.", "h": "Ban “I like” and “I don’t like.” Tie every comment to the persona, goals, usability, or data. Use openers like “This could cause trouble because…” or “For this user and this task, the risk is…”."}}, {"es": {"t": "Defender en vez de escuchar", "s": "The Designer Spends the Session Defending Rather Than Listening", "q": "El presentador justifica cada decisión por adelantado, rebate objeciones antes de que surjan o responde a cada comentario como si fuera un interrogatorio.", "p": "La crítica se siente personal cuando el trabajo es reciente. Además, el diseñador conoce detalles que otros no y siente la tentación de volcar contexto para demostrar que todo es racional.", "c": "La reunión se vuelve tensa y agotadora. Los revisores presionan más o se rinden y ofrecen comentarios “seguros”. Se pierden señales valiosas por proteger la solución actual.", "h": "Presentar brevemente problema, restricciones e hipótesis, y callar. Durante el feedback, solo preguntar para aclarar y tomar notas. La crítica no es un juicio: no se trata de ganar el caso, sino de mejorar el diseño."}, "en": {"t": "Defending Instead of Listening", "s": "The Designer on the Stand", "q": "The presenter justifies every decision up front, rebuts objections before they’re raised, or answers each comment as if under interrogation.", "p": "Critique feels personal when the work is fresh. The designer also knows details others don’t, and is tempted to pour out context to prove everything is rational.", "c": "The meeting becomes tense and draining. Reviewers either push harder or give up and offer “safe” comments. Valuable signals are lost to protecting the current solution.", "h": "Briefly present the problem, constraints, and hypothesis, then stop. During feedback, only ask clarifying questions and take notes. A crit isn’t a trial: the goal is a better design, not winning the case."}}, {"es": {"t": "La crítica como ritual de estatus", "s": "The Critique Becomes a Status Ritual", "q": "La reunión sirve más para mostrar alineación, autoridad o quién tiene la última palabra que para mejorar el diseño. Las opiniones senior pesan por el cargo, no por su relevancia.", "p": "Los proyectos de UX cruzan producto, ingeniería, marketing y dirección. En ese entorno, incluso una crítica bienintencionada se vuelve un escenario de la jerarquía de la organización.", "c": "Se acaba la discusión honesta: los juniors callan y los pares se autocensuran. El diseñador optimiza para la aprobación, no para el usuario. El equipo aprende a leer el poder en vez de los problemas.", "h": "Separar la crítica de la aprobación (sign-off). Dejar claro que el objetivo es detectar riesgos. Un facilitador que dé voz a los más callados y pida razones, no veredictos, a los senior. Turnos de palabra estructurados."}, "en": {"t": "The Crit as a Status Ritual", "s": "Hierarchy Over Relevance", "q": "The meeting is more about showing alignment, authority, or who has the final say than improving the design. Senior opinions carry weight because of rank, not relevance.", "p": "UX projects span product, engineering, marketing, and leadership. In that setting, even a well-meant crit becomes a stage for the organization’s hierarchy.", "c": "Honest discussion dries up: juniors go quiet and peers self-censor. The designer optimizes for approval instead of the user. The team learns to read power rather than problems.", "h": "Keep critique separate from sign-off and make clear the goal is surfacing risks. A facilitator draws out quieter voices and asks seniors for reasons, not verdicts. Use structured turn-taking."}}, {"es": {"t": "Feedback vago e inaccionable", "s": "Vague and Unactionable Feedback", "q": "Comentarios que suenan profundos pero no dicen nada concreto: “hazlo resaltar”, “se siente pesado”, “es tosco”, “¿puede ser más amigable?”.", "p": "El revisor percibe que algo no funciona, pero le falta vocabulario de diseño (jerarquía, contraste, espacio en blanco, alineación) para nombrar qué causa la fricción.", "c": "El diseñador queda adivinando. Puede invertir horas en su propia interpretación de “resaltar” solo para escuchar en la próxima reunión que sigue sin estar bien.", "h": "Indagar con los “5 porqués”. Si alguien dice “se siente tosco”, preguntar: “¿Te refieres al contraste, al tamaño del texto o a la cantidad de clics?”. No avanzar hasta traducir la sensación en atributos concretos."}, "en": {"t": "Vague, Unactionable Feedback", "s": "The “Make It Pop” Syndrome", "q": "Comments that sound deep but say nothing concrete: “make it pop,” “it feels heavy,” “it’s clunky,” “can it be more user-friendly?”.", "p": "The reviewer senses something isn’t working but lacks the design vocabulary (hierarchy, contrast, whitespace, alignment) to name what is causing the friction.", "c": "The designer is left guessing. They may sink hours into their own take on “pop,” only to hear at the next meeting that it’s still not right.", "h": "Dig in with the “5 Whys.” If someone says “it feels clunky,” ask: “Do you mean the contrast, the text size, or the number of clicks?” Don’t move on until the feeling becomes concrete attributes."}}, {"es": {"t": "Defensividad del presentador", "s": "Presenter Defensiveness", "q": "El diseñador toma el feedback como un ataque personal: discute con los revisores, justifica cada decisión de inmediato o pone excusas en lugar de escuchar.", "p": "El trabajo de diseño se siente muy personal. El síndrome del impostor es común, y ver tu trabajo diseccionado frente a colegas activa una respuesta de “lucha o huida”.", "c": "Destruye la seguridad psicológica. Los revisores dejan de ser honestos para evitar conflictos, el diseñador deja de aprender y la calidad se estanca en una armonía artificial.", "h": "Cultivar la idea “no eres tu diseño”: se pone a prueba el trabajo, no tu competencia. Practicar la escucha activa con respuestas como “Interesante perspectiva, la anoto para explorarla”, sin rebatir al instante."}, "en": {"t": "Presenter Defensiveness", "s": "The Ego Trap", "q": "The designer treats feedback as a personal attack: arguing with reviewers, instantly justifying every decision, or making excuses instead of listening.", "p": "Design work feels deeply personal. Impostor syndrome is common, and seeing your work dissected in front of peers triggers a “fight or flight” reaction.", "c": "It wrecks psychological safety. Reviewers stop being candid to avoid conflict, the designer stops learning, and quality stalls in an artificial harmony.", "h": "Build the mindset “you are not your design”: the work is being tested, not your competence. Practice active listening with replies like “Interesting angle, I’ll note it to explore,” without rebutting on the spot."}}, {"es": {"t": "El efecto HiPPO", "s": "The HiPPO Effect", "q": "La persona de mayor rango (director, VP, fundador) habla primero y el resto se alinea de inmediato con su opinión, suprimiendo cualquier disenso.", "p": "Dinámicas de poder: contradecir a quien controla ascensos, evaluaciones y salario se siente arriesgado, así que estar de acuerdo parece la jugada más segura para la carrera.", "c": "Pensamiento de grupo. Se pierden perspectivas diversas, conocimiento especializado y miradas frescas; el producto se construye sobre los supuestos de una sola persona.", "h": "Que los líderes hablen al final, a propósito. O usar la “crítica silenciosa”: el diseño en una pizarra digital y 5–10 minutos para que todos escriban notas en silencio antes de discutir."}, "en": {"t": "The HiPPO Effect", "s": "Highest Paid Person’s Opinion", "q": "The most senior person in the room (director, VP, founder) speaks first and everyone else immediately falls in line, smothering any dissent.", "p": "Power dynamics: contradicting the person who controls promotions, reviews, and pay feels risky, so agreeing looks like the safest career move.", "c": "Groupthink. Diverse perspectives, specialist knowledge, and fresh eyes are lost; the product gets built on one person’s assumptions.", "h": "Have leaders deliberately speak last. Or run a “silent crit”: put the design on a digital whiteboard and give everyone 5–10 minutes to write notes quietly before any discussion."}}, {"es": {"t": "Todos contra todos", "s": "The Unfacilitated Free-for-All", "q": "Una discusión caótica sin agenda ni límites de tiempo: se salta de tema en tema, dominan las voces fuertes y se termina hablando de deuda técnica o estrategia de marketing.", "p": "Las culturas de equipo informales relajan la estructura de las reuniones. Y como la UX toca todo el producto, mirar una interfaz despierta temas sistémicos más amplios.", "c": "Se acaba el tiempo: la primera pantalla recibe 40 minutos de debate y las cinco restantes, 5. El diseñador sale sin el feedback que necesitaba para avanzar.", "h": "Asignar siempre un facilitador (distinto del presentador) que controle el tiempo y el rumbo. Usar un “parking lot” para ideas válidas pero fuera de tema, y volver de inmediato a la interfaz."}, "en": {"t": "The Unfacilitated Free-for-All", "s": "Down the Rabbit Hole", "q": "A chaotic discussion with no agenda or time limits: topics jump around, loud voices dominate, and the talk ends up on tech debt or marketing strategy.", "p": "Informal team cultures loosen meeting structure. And because UX touches the whole product, looking at a UI sparks broader, systemic topics.", "c": "Time runs out: the first screen gets 40 minutes of debate and the remaining five get 5. The designer walks away without the feedback needed to move forward.", "h": "Always assign a facilitator (not the presenter) to manage time and direction. Use a “parking lot” for valid but off-topic ideas, then steer straight back to the UI."}}, {"es": {"t": "Diseño por comité", "s": "Designing by Committee", "q": "Tratar la crítica como una votación: el diseñador intenta incorporar cada comentario, o el grupo busca consenso total en cada decisión antes de avanzar.", "p": "Deseo de democracia, miedo a pisar callos, política interna o la idea errónea de que todo feedback es un mandato y no un dato a considerar.", "c": "Un diseño “Frankenstein”, inflado e incoherente, que intenta complacer a todos y no funciona para nadie. La visión fuerte de producto muere en el comité.", "h": "Aclarar desde el inicio que la crítica sirve para recoger perspectivas y detectar riesgos, no para decidir. El diseñador es dueño del trabajo: escucha todo, sintetiza y decide qué se implementa."}, "en": {"t": "Designing by Committee", "s": "Lack of Ownership", "q": "Treating the crit as a vote: the designer tries to fold in every comment, or the group seeks full consensus on each decision before moving on.", "p": "A wish for democracy, fear of stepping on toes, office politics, or the mistaken belief that every piece of feedback is a mandate rather than a data point.", "c": "A bloated, incoherent “Frankenstein” design that tries to please everyone and works for no one. Any bold product vision gets diluted away.", "h": "State up front that the crit gathers perspectives and surfaces risks; it doesn’t make decisions. The designer owns the work: listens to everything, synthesizes, and decides what ships."}}, {"es": {"t": "El agujero negro", "s": "The Black Hole", "q": "Una discusión excelente de 45 minutos de la que nadie toma nota, sin resumen ni próximos pasos. La crítica queda como un evento aislado y no como parte del proceso de diseño.", "p": "El presentador está ocupado presentando y respondiendo, y todos asumen que otro está anotando. Los puntos clave parecen obvios y memorables, pero la memoria comprime los matices.", "c": "Las ideas se evaporan, los mismos temas se vuelven a discutir en la siguiente crítica y los revisores se sienten ignorados al no ver su feedback reflejado en la nueva iteración.", "h": "Asignar un tomador de notas. Al cierre, el presentador resume en voz alta 3–5 acciones. En 24 horas, compartir qué feedback se implementará y cuál se descarta (y por qué)."}, "en": {"t": "The Black Hole", "s": "Not Documenting or Closing the Loop", "q": "A great 45-minute discussion that nobody writes down, with no summary or next steps. The crit becomes a one-off event instead of part of the design process.", "p": "The presenter is busy presenting and answering, and everyone assumes someone else is taking notes. Key points seem obvious and memorable, but memory flattens nuance.", "c": "Ideas evaporate, the same issues get re-argued at the next crit, and reviewers feel ignored when their feedback doesn’t show up in the next iteration.", "h": "Assign a note-taker. At the close, the presenter recaps 3–5 actions out loud. Within 24 hours, share which feedback will be implemented and which is set aside (and why)."}}, {"es": {"t": "Mostrar el diseño demasiado tarde", "s": "The Design Is Shown Too Late", "q": "La crítica llega cuando el diseño ya está pulido, socializado o parcialmente construido. El feedback parece posible, pero en la sala no hay ganas reales de revisar a fondo.", "p": "Los diseñadores esperan a que el trabajo se vea coherente: nadie disfruta mostrar ideas a medio hacer. Además, las agendas están llenas y los stakeholders prefieren ver algo “real”.", "c": "Lo peor de ambos mundos: se ignoran problemas graves porque ya es tarde, o se descubren fallas de fondo tras una gran inversión. Aprender sale innecesariamente caro.", "h": "Criticar temprano, cuando cambiar es barato. Bocetos, flujos, wireframes y prototipos son material válido, y a menudo mejor: invitan feedback conceptual porque su pulido aún no seduce a la sala."}, "en": {"t": "Showing the Design Too Late", "s": "When Change Is Already Expensive", "q": "The crit arrives once the design is polished, socialized, or partly built. Feedback seems possible, but the room has no real appetite for deep revision.", "p": "Designers wait until the work looks coherent; nobody enjoys showing half-formed ideas. Calendars are also packed, and stakeholders prefer to see something “real.”", "c": "A lose-lose: serious problems get ignored because it’s too late, or fundamental flaws surface after major investment. Learning becomes needlessly costly.", "h": "Critique early, while change is cheap. Sketches, flows, wireframes, and prototypes are all valid material, and often better, since their lack of polish invites conceptual feedback."}}];

const BW=240, BH=320, N=DATA.length;
const stage=document.getElementById('stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const canHover=matchMedia('(hover: hover)').matches;
let lang='es', view='fan', hovered=-1, openIdx=-1, busy=false, pos=[];
// tablet y móvil: siempre lista
const curView=()=>(innerWidth<1024&&view==='fan')?'list':view;
let drawn=-1, lastDrawn=-1, deckOrder=[...Array(N).keys()], jit=[];
function shuffleDeck(){
  for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [deckOrder[i],deckOrder[j]]=[deckOrder[j],deckOrder[i]];}
  jit=DATA.map(()=>({r:(Math.random()*2-1)*4, x:(Math.random()*2-1)*3, y:(Math.random()*2-1)*3}));
}
shuffleDeck();

const pad=n=>String(n).padStart(2,'0');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function frontHTML(i){const d=DATA[i][lang];
  return `<div class="num">${pad(i+1)}</div><div class="txt"><div class="tt">${esc(d.t)}</div><div class="st">${esc(d.s)}</div></div>`;}
function backHTML(i){const d=DATA[i][lang], u=UI[lang];
  return `<div class="bh"><div class="bn" style="background:${PAL[i].bg};color:${PAL[i].ink}">${pad(i+1)}</div><div class="bt" id="mTitle">${esc(d.t)}</div><button class="close" id="closeBtn" aria-label="${u.close}">×</button></div>
  <div class="secs">${artHTML(i)}${KEYS.map((k,j)=>`<div class="sec ${CLS[j]}"><div class="lab"><i></i>${u.labs[j]}</div><p>${esc(d[k])}</p></div>`).join('')}</div>
  <div class="src">${srcLink(u.src)}</div>`;}

// tarjetas del escenario
const cards=DATA.map((_,i)=>{
  const b=document.createElement('button'); b.className='card'; b.dataset.i=i;
  b.innerHTML=`<div class="face front"></div><div class="face cover"><div class="glyph">${DOG}</div></div>`;
  b.addEventListener('click',()=>{ if(curView()==='tarot'){ if(i===drawn) openCard(i); else draw(); } else openCard(i); });
  if(canHover){
    b.addEventListener('mouseenter',()=>{if(openIdx<0&&curView()!=='tarot'){hovered=i;applyHover();}});
    b.addEventListener('mouseleave',()=>{if(hovered===i){hovered=-1;applyHover();}});
  }
  b.addEventListener('focus',()=>{if(openIdx<0&&canHover&&curView()!=='tarot'){hovered=i;applyHover();}});
  b.addEventListener('blur',()=>{if(hovered===i){hovered=-1;applyHover();}});
  stage.appendChild(b); return b;
});

function computeLayout(){
  const W=stage.clientWidth; pos=[];
  if(curView()==='tarot'){
    const narrow=W<640, cw=Math.min(narrow?W*0.62:250,250), s=cw/BW, ch=BH*s, top=16;
    const cy=top+ch/2+(narrow?ch*0.1:0);
    let deckX=W/2, deckY=cy, deckS=s, cardX=W/2, cardY=cy;
    if(drawn>=0){ if(narrow){deckS=s*0.8; deckY=cy-ch*0.1; cardY=cy+ch*0.04;} else {deckX=W/2-cw*0.66; cardX=W/2+cw*0.66;} }
    for(let i=0;i<N;i++){
      if(i===drawn){ pos[i]={x:cardX,y:cardY,r:0,s:s*1.04,z:200,ch,ry:0}; continue; }
      const k=deckOrder.indexOf(i);
      pos[i]={x:deckX+jit[i].x, y:deckY-k*0.8+jit[i].y, r:jit[i].r, s:deckS, z:k, ch, ry:180};
    }
    return top+ch*1.14+(narrow?ch*0.12:0)+16;
  }
  if(curView()==='fan'){
    const cw=Math.max(96,Math.min(210,W/6.6)), s=cw/BW, ch=BH*s;
    const span=34*Math.PI/180;
    const R=Math.max((W*0.9-cw)/(2*Math.sin(span)), cw*1.6);
    const top=ch*0.2+8;
    for(let i=0;i<N;i++){
      const a=((i/(N-1))*2-1)*span;
      pos.push({x:W/2+R*Math.sin(a), y:top+ch/2+R*(1-Math.cos(a)), r:a*180/Math.PI, s, z:i, ch});
    }
    return top+ch+R*(1-Math.cos(span))+cw*Math.sin(span)*0.6+12;
  }
  const gap=W<560?12:20, target=W<560?150:200;
  const cols=Math.max(2,Math.floor((W+gap)/(target+gap)));
  const cw=Math.min(230,(W-gap*(cols-1))/cols), s=cw/BW, ch=BH*s;
  const rowW=cols*cw+gap*(cols-1), off=(W-rowW)/2;
  for(let i=0;i<N;i++){
    const c=i%cols, r=Math.floor(i/cols);
    pos.push({x:off+c*(cw+gap)+cw/2, y:12+r*(ch+gap)+ch/2, r:0, s, z:i, ch});
  }
  return 12+Math.ceil(N/cols)*(ch+gap)+8;
}
function tf(p,hover){
  let {x,y,r,s}=p;
  if(hover&&curView()!=='tarot'){ if(curView()==='fan'){y-=p.ch*0.16; r=0; s*=1.07;} else {y-=8; s*=1.03;} }
  return `perspective(1600px) translate(${x-BW/2}px,${y-BH/2}px) rotate(${r}deg) scale(${s}) rotateY(${p.ry||0}deg)`;
}
function render(stagger){
  const tv=curView()==='tarot';
  stage.classList.toggle('tarot',tv); document.getElementById('tarotUi').hidden=!tv;
  document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view===curView()));
  updText();
  stage.style.height=computeLayout()+'px';
  cards.forEach((c,i)=>{
    c.style.transitionDelay=stagger&&!reduce?`${(curView()==='fan'?i:N-1-i)*22}ms`:'0ms';
    c.style.transform=tf(pos[i],i===hovered);
    c.style.zIndex=i===hovered?100:pos[i].z;
  });
  if(stagger) setTimeout(()=>cards.forEach(c=>c.style.transitionDelay='0ms'),900);
}
function updText(){
  const u=UI[lang], tv=curView()==='tarot';
  document.getElementById('lede').textContent=tv?(drawn>=0?u.hintT1:u.hintT0):u.hint;
  document.getElementById('drawBtn').textContent=drawn>=0?u.again:u.draw;
}
function draw(){
  if(busy||openIdx>=0||curView()!=='tarot') return; busy=true;
  const T=reduce?0:300;
  stage.classList.add('shuffling');
  drawn=-1; shuffleDeck(); render(false);
  setTimeout(()=>{ if(!reduce) cards.forEach((c,i)=>{const p=pos[i]; c.style.transform=tf({...p, x:p.x+(Math.random()*2-1)*p.ch*0.16, r:p.r+(Math.random()*2-1)*12},false);}); },T);
  setTimeout(()=>render(false),T*2);
  setTimeout(()=>{
    stage.classList.remove('shuffling');
    let n; do{ n=Math.floor(Math.random()*N); } while(n===lastDrawn&&N>1);
    lastDrawn=drawn=n; render(false);
    setTimeout(()=>{busy=false;},reduce?0:1100);
  },T*3);
}
document.getElementById('drawBtn').addEventListener('click',draw);
function applyHover(){
  stage.classList.toggle('hovering',hovered>=0);
  cards.forEach((c,i)=>{c.classList.toggle('is-hover',i===hovered); c.style.transform=tf(pos[i],i===hovered); c.style.zIndex=i===hovered?100:pos[i].z;});
}
function setLang(l){
  lang=l; document.documentElement.lang=l; const u=UI[l];
  document.getElementById('title').textContent=u.title; document.title=u.title;
  document.querySelector('[data-view=tarot]').textContent=u.tarot;
  document.getElementById('tQ').textContent=u.tq;
  updText();
  document.getElementById('foot').innerHTML=srcLink(u.src);
  document.getElementById('viewSeg').setAttribute('aria-label',u.view);
  document.querySelector('[data-view=fan]').textContent=u.fan;
  document.querySelector('[data-view=list]').textContent=u.list;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  cards.forEach((c,i)=>{const f=c.querySelector('.front'); f.innerHTML=frontHTML(i); f.style.cssText=fstyle(i); c.setAttribute('aria-label',`${u.open} ${pad(i+1)}: ${DATA[i][l].t}`);});
  if(openIdx>=0) fillModal(openIdx);
}

// ===== modal con giro =====
const modal=document.getElementById('modal'), flip=document.getElementById('flip'), scrim=document.getElementById('scrim');
const mFront=document.getElementById('mFront'), mBack=document.getElementById('mBack');
function modalSize(){const vw=innerWidth, vh=innerHeight; const w=Math.min(560, vw*0.92, vh*0.88*0.75); return {w, h:w/0.75};}
function fillModal(i){mFront.innerHTML=frontHTML(i); mFront.style.cssText=fstyle(i); mBack.innerHTML=backHTML(i); mBack.style.setProperty('--braw',PAL[i].raw+'73'); document.getElementById('closeBtn').onclick=closeCard;}
function keyframes(i){
  const {w}=modalSize(), p=pos[i], sr=stage.getBoundingClientRect();
  const dx=sr.left+p.x-innerWidth/2, dy=sr.top+p.y-innerHeight/2;
  const st=(BW*p.s)/w;
  return [
    {transform:`translate(${dx}px,${dy}px) rotate(${p.r}deg) scale(${st}) rotateY(0deg)`},
    {transform:`translate(${dx*0.75}px,${dy*0.75-24}px) rotate(${p.r*0.4}deg) scale(${st*1.2}) rotateY(0deg)`, offset:0.28},
    {transform:`translate(0px,0px) rotate(0deg) scale(1) rotateY(180deg)`}
  ];
}
function placeModal(){const {w,h}=modalSize(); Object.assign(modal.style,{width:w+'px',height:h+'px',marginLeft:-w/2+'px',marginTop:-h/2+'px'});}
function openCard(i){
  if(busy||openIdx>=0) return; busy=true; openIdx=i;
  hovered=-1; applyHover(); render(false);
  fillModal(i); placeModal();
  modal.hidden=false; scrim.hidden=false; requestAnimationFrame(()=>scrim.classList.add('on'));
  cards[i].style.visibility='hidden';
  const a=flip.animate(keyframes(i),{duration:reduce?1:950,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});
  a.onfinish=()=>{busy=false; document.getElementById('closeBtn').focus({preventScroll:true});};
}
function closeCard(){
  if(busy||openIdx<0) return; busy=true; const i=openIdx;
  scrim.classList.remove('on');
  const a=flip.animate(keyframes(i).reverse().map((k,j)=>j===1?{...k,offset:0.72}:k),{duration:reduce?1:850,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
  a.onfinish=()=>{modal.hidden=true; scrim.hidden=true; cards[i].style.visibility=''; flip.getAnimations().forEach(x=>x.cancel());
    openIdx=-1; busy=false; cards[i].focus({preventScroll:true});};
}
scrim.addEventListener('click',closeCard);
modal.addEventListener('click',e=>{ if(!flip.contains(e.target)) closeCard(); });
addEventListener('keydown',e=>{ if(e.key==='Escape') closeCard(); });

document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
  if(curView()===b.dataset.view||openIdx>=0||busy) return; view=b.dataset.view;
  drawn=-1; if(view==='tarot') shuffleDeck();
  hovered=-1; stage.classList.remove('hovering'); cards.forEach(c=>c.classList.remove('is-hover')); render(true);
}));
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
let rt, lastV=curView(); addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>{const v=curView(), changed=v!==lastV; if(changed){lastV=v; hovered=-1; stage.classList.remove('hovering'); cards.forEach(c=>c.classList.remove('is-hover'));} render(changed); if(openIdx>=0&&!busy){placeModal(); flip.getAnimations().forEach(x=>x.cancel()); flip.style.transform='rotateY(180deg)';}},80);});

setLang('es'); render(false);
</script>
</body>
