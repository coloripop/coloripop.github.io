<style>
:root{
  --bg:#F8FAFF; --surface:#FFFFFF; --surface-2:#F1F3F7; --line:#E1E4ED;
  --text:#19213D; --text-2:#5A6380; --link:#1468D6; --accent:#1A6EE0; --on-accent:#FFFFFF;
  --sky:#E3EFFF; --sky-2:#C3DDFF; --head:#D6E4FA; --on-head:#19213D; --on-head-2:#4A5370;
  --lvA:#FABE3F; --onA:#0C1124; --lvAA:#F36127; --onAA:#0C1124; --lvAAA:#F23857; --onAAA:#0C1124;
  --scA-bg:#FFF4DB; --scA-bd:#F2C866; --scA-tx:#7A4A00;
  --scAA-bg:#FFEADF; --scAA-bd:#F5A27C; --scAA-tx:#9A3412;
  --scAAA-bg:#FFE5EA; --scAAA-bd:#F28DA1; --scAAA-tx:#A3123A;
  --focus:#1A6EE0;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121830; --surface:#19213D; --surface-2:#232C4D; --line:#33406A;
    --text:#FFFFFF; --text-2:#C2C7D6; --link:#8FC2FF; --accent:#5AA6FF; --on-accent:#19213D;
    --sky:#232C4D; --sky-2:#33406A; --head:#0C1124; --on-head:#FFFFFF; --on-head-2:#C2C7D6;
    --lvA:#FABE3F; --onA:#0C1124; --lvAA:#F36127; --onAA:#0C1124; --lvAAA:#F23857; --onAAA:#0C1124;
    --scA-bg:#3A3119; --scA-bd:#8A6B22; --scA-tx:#FCD679;
    --scAA-bg:#3E2619; --scAA-bd:#9A4A26; --scAA-tx:#FFB08A;
    --scAAA-bg:#3F1B27; --scAAA-bd:#9A3450; --scAAA-tx:#FFA3B5;
    --focus:#8FC2FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121830; --surface:#19213D; --surface-2:#232C4D; --line:#33406A;
  --text:#FFFFFF; --text-2:#C2C7D6; --link:#8FC2FF; --accent:#5AA6FF; --on-accent:#19213D;
  --sky:#232C4D; --sky-2:#33406A; --head:#0C1124; --on-head:#FFFFFF; --on-head-2:#C2C7D6;
  --lvA:#FABE3F; --onA:#0C1124; --lvAA:#F36127; --onAA:#0C1124; --lvAAA:#F23857; --onAAA:#0C1124;
  --scA-bg:#3A3119; --scA-bd:#8A6B22; --scA-tx:#FCD679;
  --scAA-bg:#3E2619; --scAA-bd:#9A4A26; --scAA-tx:#FFB08A;
  --scAAA-bg:#3F1B27; --scAAA-bd:#9A3450; --scAAA-tx:#FFA3B5;
  --focus:#8FC2FF;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:48px 24px 64px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:24px;width:max-content;max-width:100%;margin:0 auto;padding:8px 8px 8px 24px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 32px rgba(25,33,61,.08)}
.nav-brand{display:flex;align-items:center;gap:10px;color:var(--text)}
.logo{display:block;height:32px;width:auto}
.nav-label{font-size:14px;font-weight:600;color:var(--text-2)}
.hero{text-align:center;padding:64px 0 16px}
.hero h1{font-size:clamp(36px,6.4vw,84px);line-height:1.04;letter-spacing:-.035em;font-weight:700;margin:0 auto 20px;max-width:16ch;color:var(--text);background:linear-gradient(100deg,var(--text) 0%,var(--text) 35%,var(--link) 50%,var(--text) 65%,var(--text) 100%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sheen 2.4s ease-out .2s both}
@keyframes sheen{from{background-position:0 0}to{background-position:100% 0}}
.hero p{margin:0 auto;color:var(--text-2);max-width:60ch;font-size:18px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:40px 0 28px}
.stat{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;align-items:flex-start;min-height:220px;padding:24px;border-radius:28px;color:#0C1124}
.stat-all{background:#19213D;color:#FFFFFF;border:1px solid var(--line)}
.stat-A{background:var(--lvA)} .stat-AA{background:var(--lvAA)} .stat-AAA{background:var(--lvAAA)}
.stat-top{display:contents}
.stat b{display:block;font-size:clamp(44px,4.6vw,60px);font-weight:800;line-height:1;letter-spacing:-.03em}
.stat .lbl{font-size:17px;font-weight:500;line-height:1.3;margin-top:8px;max-width:9em}
.stat-all .lbl{color:#C2C7D6}
.stat .badge{order:3;margin-top:auto;position:relative;z-index:1;width:96px;box-shadow:0 2px 8px rgba(12,17,36,.18)}
.badge{display:block;width:114px;height:auto;flex:none}
.deco{position:absolute;right:-3%;bottom:-6%;width:64%;height:auto;z-index:-1;pointer-events:none}
.deco text{font-family:Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-4px}
.controls{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:16px}
.controls fieldset{border:0;margin:0;padding:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls legend{float:left;margin-right:8px;font-weight:600;font-size:14px}
.seg button{font:inherit;font-size:14px;font-weight:600;min-height:36px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.search{display:flex;align-items:center;gap:8px;margin-left:auto}
.search label{font-size:14px;font-weight:600}
.search input{font:inherit;font-size:14px;min-height:36px;width:220px;max-width:60vw;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
.status{font-size:14px;color:var(--text-2);margin:0 0 8px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:860px}
caption{text-align:left;padding:0;position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
thead th{font-size:14px;font-weight:600;color:var(--text-2);text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th .lv{margin-left:6px}
tbody td,tbody th{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
tbody th[scope="row"]{font-weight:600;width:24%}
.pnum{color:var(--link);margin-right:6px}
.plink{display:flex;align-items:baseline;gap:8px;color:inherit;text-decoration:none;border-radius:4px}
.plink .pnum{flex:none;min-width:2em;margin-right:0}
.plink .pname{min-width:0}
.plink:hover .pname{text-decoration:underline;text-underline-offset:3px}
.plink .nw{white-space:nowrap}
.plink .ext{display:inline-block;width:13px;height:13px;margin-left:6px;vertical-align:-1px;color:var(--link)}
.group th{background:var(--head);color:var(--on-head);padding:0;border-bottom:0}
.group button{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;font-size:18px;font-weight:700}
.group button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.group .meta{margin-left:auto;font-size:14px;font-weight:500;color:var(--on-head-2)}
.group .chev{width:20px;height:20px;transition:transform .2s ease;flex:none}
.group button[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.subtotal th,.subtotal td{background:var(--sky);font-weight:600;font-size:14px}
tfoot th,tfoot td{padding:16px;font-weight:700;border-top:2px solid var(--text);text-align:left}
.lv{display:inline-block;font-size:12px;font-weight:700;line-height:1;padding:5px 9px;border-radius:999px}
.lv-A{background:var(--lvA);color:var(--onA)}
.lv-AA{background:var(--lvAA);color:var(--onAA)}
.lv-AAA{background:var(--lvAAA);color:var(--onAAA)}
.total{font-weight:700;font-size:18px}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:8px;max-width:140px;background:var(--surface-2)}
.bar i{display:block;height:100%}
.bar .bA{background:var(--lvA)} .bar .bAA{background:var(--lvAA)} .bar .bAAA{background:var(--lvAAA)}
.split{font-size:13px;color:var(--text-2);margin-top:6px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.names .chips{flex-direction:column;align-items:flex-start}
.sc{display:inline-flex;align-items:baseline;gap:6px;text-align:left;min-height:28px;padding:3px 10px;border-radius:8px;border:1px solid var(--sky-2);background:var(--sky);color:var(--link);text-decoration:none;font-size:14px;font-weight:600}
.sc:hover{text-decoration:underline}
.sc[data-lv="A"]{background:var(--scA-bg);border-color:var(--scA-bd);color:var(--scA-tx)}
.sc[data-lv="AA"]{background:var(--scAA-bg);border-color:var(--scAA-bd);color:var(--scAA-tx)}
.sc[data-lv="AAA"]{background:var(--scAAA-bg);border-color:var(--scAAA-bd);color:var(--scAAA-tx)}
.sc .nm{display:none;font-weight:500;color:var(--text)}
.names .sc .nm{display:inline}
.sc.removed{border-style:dashed;background:var(--surface-2);color:var(--text-2)}
.sc .rm{font-weight:500;font-style:italic}
.empty{color:var(--text-2)}
.dim{opacity:.4}
.hidden{display:none}
.arrow{flex:none;width:28px;height:16px;color:var(--text-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lane-cell{display:flex;align-items:center;gap:10px;height:32px}
.lane-cell .sc{flex:none}
td.lane-lbl{padding:12px 16px 2px;font-size:13px;font-weight:600;color:var(--text-2)}
tr.lane-lbl-row + tr td[data-col],tr.lane-lbl-row + tr td.arrow-col{padding-top:6px}
td.arrow-col,th.arrow-col{width:48px;padding-left:0;padding-right:0;text-align:center}
thead td.arrow-col{border-bottom:1px solid var(--line)}
td.arrow-col .arrow{display:block;width:56px;height:16px;margin:0 auto}
.lane-line{flex:1;min-width:0;height:0;border-top:2px solid var(--text-2)}
.lane-cell .head{flex:none;width:10px;height:16px;margin-left:-1px;color:var(--text-2)}
td.arrow-col .lane-cell{gap:0}
td.arrow-col .lane-cell.with-head{padding-right:8px}
td.gap-td{padding-left:0;padding-right:0}
td.gap-td .lane-cell,td.arrow-col .lane-cell{gap:0}
td.tail{padding-right:0}
td.tail .lane-cell{gap:0}
td.tail .lane-cell .sc{margin-right:0}
.lane-gap{display:block;width:100%;min-width:40px;border-top:2px dashed var(--line)}
tr.lane-cont td,tr.lane-cont th{border-bottom:0}
tr.lane-cont th[rowspan],tr.lane-cont td[rowspan]{border-bottom:1px solid var(--line)}
tr.lane-next td{padding-top:4px}
tr.lane-cont td[data-col]{padding-bottom:4px}
.sc.dup{border-style:dashed}
.notes{margin-top:24px;color:var(--text-2);font-size:14px}
.notes{text-align:center}
.notes p{margin:6px 0;max-width:none}
.prefs{display:flex;gap:12px;flex-wrap:wrap}
.prefs .seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.prefs .seg button{border:0;min-height:32px;padding:4px 12px}
@media (max-width:760px){
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{min-height:180px;padding:18px;border-radius:22px}
  .stat .badge{width:76px}
  .deco{width:46%;bottom:-4%}
  .nav{width:100%;padding-left:16px;gap:12px}
  .prefs{gap:6px;flex-wrap:nowrap}
  .prefs .seg button{padding:4px 9px}
  .logo{height:26px}
  .hero{padding-top:40px}
  .search{margin-left:0;width:100%}
  .search input{flex:1;width:auto}
}
@media (prefers-reduced-motion: reduce){.group .chev{transition:none}.hero h1{animation:none}}
</style>
</head>

const inTarget=l=>state.target==="all"||LV.indexOf(l)<=LV.indexOf(state.target);
